name: DSA Run063 00008 current-session sentinel

on:
  push:
    branches: [research/run063-o-00008-sentinel-20260918]
    paths:
      - .github/workflows/127-run063-o-00008-sentinel.yml
      - docs/runtime/RUN063_SCOPE.json

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-run063-o-00008-sentinel
  cancel-in-progress: true

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'

    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}

      - name: Install native and deterministic dependencies
        run: pip install -r research/requirements.txt pytest httpx requests deepseek-recipe==0.1.1

      - name: Verify immutable one-slot scope and accepted dry parent
        working-directory: research
        run: |
          python -m pytest --noconftest -q             tests/test_o_news_coverage_limitation.py             tests/test_o_frozen_native_history_adapter.py             tests/test_o_native_input_contract.py             tests/test_bounded_native_members.py             tests/test_bounded_native_members_v2.py             tests/test_deepseek_flash_cap010_guard.py             tests/test_o_provider_completion.py             tests/test_private_multipart.py             tests/test_dsa_drive_recovery_regressions.py             tests/test_o_release_gate_contract.py
          python - <<'PY'
          import json
          s=json.load(open('docs/runtime/RUN063_SCOPE.json'))
          p=json.load(open('docs/runtime/RUN062_RESULT.json'))
          assert s['codes']==['00008'] and s['deferred_ready_codes']==['00010']
          assert s['maximum_requests']==1 and s['maximum_cost_cny']=='0.10'
          assert s['provider_send_authorized'] is True and s['automatic_retry'] is False
          assert s['frozen_native_history_adapter'] is True
          assert s['news_coverage_limitation_v1'] is True
          assert p['state']=='PASS_SENTINEL_READY'
          assert p['selected_sentinel']=='00008'
          row=next(x for x in p['members'] if x['code']=='00008')
          assert row['status']=='PASS_CURRENT_FROZEN_DRY'
          assert row['dry_request_status']=='dry_envelope_validated_not_sent'
          assert row['pre_send_peak_upper_cny']=='0.079956'
          assert p['model_http_requests']==0
          print('RUN063_SCOPE_PASS')
          PY

      - uses: actions/download-artifact@v4
        with:
          run-id: 35336247845
          github-token: ${{ github.token }}
          name: RUN058U_20260918_SESSION_ROLLOVER
          path: parent

      - name: Bind exact current O history
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN063_SCOPE.json'))
          hs=[p for p in Path('parent').rglob('market-history.json') if hashlib.sha256(p.read_bytes()).hexdigest()==s['history_cache_sha256']]
          assert len(hs)==1
          h=json.loads(hs[0].read_text())
          assert h['target_session']=='2026-09-18' and 'hk00008' in (h.get('histories') or {})
          Path('/tmp/history-path').write_text(str(hs[0].resolve()))
          print('RUN063_HISTORY_BIND_PASS')
          PY

      - name: Fail closed because parallel Run064 owns MB004 provider authority
        run: |
          echo "DISARMED_BY_PARALLEL_RUN064_NO_PROVIDER_CALL"
          exit 1

      - name: Execute at most one provider request for 00008 with Drive persistence
        if: ${{ false }}
        working-directory: research
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: |
          python scripts/run_hk_bounded_native_members.py             --checkout ../original             --cache "$(cat /tmp/history-path)"             --scope docs/runtime/RUN063_SCOPE.json             --out /tmp/run063

      - name: Build sanitized reconciliation
        if: always()
        working-directory: research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/run063/SANITIZED_RESULT.json')
          if not p.exists():
              rec={'schema_version':1,'run_id':'TRI-DSA-O-NATIVE-20260918-063',
                   'state':'STOP_SENTINEL','reason':'SANITIZED_RESULT_MISSING','code':'00008',
                   'model_http_requests_confirmed':0,'model_http_requests_possible':0,
                   'qualified_signals':0,'orders':0,'simulation_writes':0,'automatic_retry':False}
          else:
              d=json.loads(p.read_text());m=d.get('members') or []
              assert len(m)<=1 and [x.get('code') for x in m]==['00008'][:len(m)]
              x=m[0] if m else {}
              priv=bool((x.get('private_persistence') or {}).get('save_read_hash_restore'))
              sent=x.get('model_http_requests_confirmed')==1
              rec={'schema_version':1,'run_id':'TRI-DSA-O-NATIVE-20260918-063',
                   'state':'PENDING_PRIVATE_SEMANTIC_REVIEW' if sent and priv else 'STOP_SENTINEL',
                   'code':'00008',
                   'member_status':{k:x.get(k) for k in (
                     'status','raw_gate','raw_blockers','model_http_requests_confirmed','model_http_requests_possible',
                     'usage_peak_estimate_cny','observed_balance_change_cny','preflight_sha256',
                     'frozen_native_history_adapter','news_coverage_limitation_v1','provider_completion'
                   )},
                   'model_http_requests_confirmed':d.get('model_http_requests_confirmed',0),
                   'model_http_requests_possible':d.get('model_http_requests_possible',0),
                   'maximum_cost_cny':'0.10','actual_attributable_charge_cny':d.get('actual_attributable_charge_cny'),
                   'private_final_roundtrip':priv,'qualified_signals':0,'orders':0,'simulation_writes':0,
                   'formal_pool_top3_generated':False,'automatic_retry':False,
                   'deferred_ready_codes':['00010'],
                   'next':'Private semantic review of immutable Drive evidence; never retry 00008.' if sent else 'Diagnose before any provider resend; automatic retry forbidden.'}
          Path('/tmp/RUN063_RECONCILIATION.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(rec,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RUN063_SANITIZED_SENTINEL
          path: |
            /tmp/run063/SANITIZED_RESULT.json
            /tmp/RUN063_RECONCILIATION.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit sanitized Run063 receipts
        if: always()
        working-directory: research
        run: |
          cp /tmp/RUN063_RECONCILIATION.json docs/runtime/RUN063_RECONCILIATION.json
          git add docs/runtime/RUN063_RECONCILIATION.json
          if test -f /tmp/run063/SANITIZED_RESULT.json; then
            cp /tmp/run063/SANITIZED_RESULT.json docs/runtime/RUN063_SANITIZED_RESULT.json
            git add docs/runtime/RUN063_SANITIZED_RESULT.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then echo no-change; else
            git commit -m 'dsa: record Run063 00008 sentinel'
            git push
          fi
