name: Run008 new paired O-track recovery OOS freeze
on:
  push:
    branches: [research/run008-recovery-oos]
    paths: [.github/workflows/41-run008-recovery-pair.yml]
permissions:
  contents: read
  actions: read
concurrency:
  group: run008-one-shot-paired-research
  cancel-in-progress: false
jobs:
  paired-freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: .
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Enforce one-shot research boundary
        run: |
          python - <<'PY'
          import os,json,datetime
          c=json.load(open('docs/run008/contract.json'))
          assert os.environ['GITHUB_RUN_ATTEMPT']=='1'
          assert datetime.datetime.now(datetime.timezone.utc)<datetime.datetime.fromisoformat(c['input_admission_deadline'])
          assert not c['frozen_old_run005_mutable'] and not c['shadow_trade_authority']
          print('RUN008_ONE_SHOT_BOUNDARY_OK')
          PY
      - run: python -m pip install pytest
      - run: python -m pytest --noconftest -q tests/test_run008_recovery_pair.py tests/test_dsa_ranking_envelope.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 34805328127
          name: run006-recovery-counterfactual-r8
          path: input/recovery
          github-token: ${{ github.token }}
      - name: Free input projection validation
        run: |
          python scripts/run008_recovery_pair.py --contract docs/run008/contract.json --universe docs/run008/universe.json --recovery input/recovery/recovery-counterfactual-r8.json --output /tmp/run008-preflight --preflight
      - name: New actual A0 A3 research calls; no raw text exported
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python scripts/run008_recovery_pair.py --contract docs/run008/contract.json --universe docs/run008/universe.json --recovery input/recovery/recovery-counterfactual-r8.json --output reports/run008
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: run008-new-paired-research-freeze
          path: reports/run008
          if-no-files-found: ignore
          retention-days: 90
