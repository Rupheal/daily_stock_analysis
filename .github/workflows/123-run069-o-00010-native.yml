name: DSA Run069 selective O native paid child 00010

on:
  push:
    branches: [research/run069-o-00010-native-20260918]
    paths:
      - .github/workflows/123-run069-o-00010-native.yml
      - docs/runtime/RUN069_SCOPE.json

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-run069-o-00010-native
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'

    steps:
      - uses: actions/checkout@v5
        with: {path: research, fetch-depth: 0}
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}

      - name: Install dependencies and verify no-repeat scope
        run: |
          pip install -r research/requirements.txt pytest httpx requests deepseek-recipe==0.1.1
          cd research
          python -m pytest --noconftest -q             tests/test_o_frozen_native_history_adapter.py             tests/test_o_native_input_contract.py             tests/test_bounded_native_members.py             tests/test_bounded_native_members_v2.py             tests/test_deepseek_flash_cap010_guard.py             tests/test_o_provider_completion.py             tests/test_private_multipart.py             tests/test_dsa_drive_recovery_regressions.py             tests/test_o_release_gate_contract.py
          python - <<'PY'
          import json
          s=json.load(open('docs/runtime/RUN069_SCOPE.json'))
          p=json.load(open('docs/runtime/RUN063_RESULT.json'))
          d=json.load(open('docs/runtime/RUN066_RESULT.json'))
          r=json.load(open('docs/runtime/RUN068_RESULT.json'))
          prev=json.load(open('docs/runtime/RUN067_RECONCILIATION.json'))
          assert s['codes']==['00010'] and s['no_repeat_codes']==['00008']
          assert s['maximum_requests']==1 and s['maximum_cost_cny']=='0.10'
          assert s['prior_model_http_requests_confirmed_for_00010']==0
          assert prev['sent_codes']==['00008'] and prev['unsent_codes']==['00010']
          assert r['code']=='00008' and r['repeat_model_request_permitted'] is False
          assert p['state']=='PASS_ALL_READY' and '00010' in p['ready_for_paid_child']
          dm={x['code']:x for x in d['members']}
          assert dm['00010']['dry_status']=='dry_envelope_validated_not_sent'
          assert dm['00010']['pre_send_peak_upper_cny']=='0.07971'
          assert s['automatic_retry'] is False and s['no_orders'] is True and s['no_signal_publish'] is True
          print('RUN069_SCOPE_NO_REPEAT_PASS')
          PY

      - uses: actions/download-artifact@v4
        with:
          run-id: 35335286449
          github-token: ${{ github.token }}
          name: RUN060_CURRENT_OFFICIAL_CLOSE_EVIDENCE
          path: parent

      - name: Bind exact Run060 universe and history
        run: |
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN069_SCOPE.json'))
          um=[];hm=[]
          for p in Path('parent').rglob('*'):
              if not p.is_file(): continue
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              if h==s['current_universe_sha256']: um.append(p)
              if h==s['history_cache_sha256']: hm.append(p)
          assert len(um)==1 and len(hm)==1
          u=json.loads(um[0].read_text()); m=json.loads(hm[0].read_text())
          assert len(u['members'])==660 and u['full_union_verified'] is True
          assert m['target_session']=='2026-09-18' and 'hk00010' in m['histories']
          shutil.copy2(um[0],'/tmp/run069-o-universe.json')
          shutil.copy2(hm[0],'/tmp/run069-o-history.json')
          print('RUN069_RUN060_BIND_PASS')
          PY

      - name: Execute exactly one eligible provider slot with Drive claim/private persistence
        working-directory: research
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: |
          python scripts/run_hk_bounded_native_members.py             --checkout ../original             --cache /tmp/run069-o-history.json             --scope docs/runtime/RUN069_SCOPE.json             --out /tmp/run069

      - name: Reconcile sanitized evidence without ledger advance
        if: always()
        working-directory: research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/run069/SANITIZED_RESULT.json')
          if not p.exists():
              rec={'schema_version':1,'run_id':'TRI-DSA-O-NATIVE-20260918-069','state':'STOP_BATCH',
                   'reason':'SANITIZED_RESULT_MISSING','micro_batch_id':'O57-MB-004','code':'00010',
                   'model_http_requests_confirmed':0,'model_http_requests_possible':0,'qualified_signals':0,
                   'orders':0,'simulation_ledger_writes':0,'automatic_retry':False,'rollout_ledger_advanced':False}
          else:
              d=json.loads(p.read_text()); m=d.get('members') or []
              assert len(m)<=1 and [x.get('code') for x in m]==['00010'][:len(m)]
              assert d.get('model_http_requests_confirmed',0)<=1 and d.get('model_http_requests_possible',0)<=1
              assert d.get('qualified_signals')==0 and d.get('formal_pool_top3_generated') is False and d.get('simulation_ledger_writes')==0
              sent=len(m)==1 and m[0].get('model_http_requests_confirmed')==1
              priv=sent and bool((m[0].get('private_persistence') or {}).get('save_read_hash_restore'))
              rec={'schema_version':1,'run_id':'TRI-DSA-O-NATIVE-20260918-069',
                   'state':'PENDING_PRIVATE_SEMANTIC_REVIEW' if sent and priv else 'STOP_BATCH',
                   'micro_batch_id':'O57-MB-004','code':'00010',
                   'member_status':{k:(m[0].get(k) if m else None) for k in (
                     'status','raw_gate','raw_blockers','model_http_requests_confirmed','model_http_requests_possible',
                     'usage_peak_estimate_cny','observed_balance_change_cny','preflight_sha256',
                     'frozen_native_history_adapter','failure_code')},
                   'model_http_requests_confirmed':d.get('model_http_requests_confirmed',0),
                   'model_http_requests_possible':d.get('model_http_requests_possible',0),
                   'maximum_cost_cny':'0.10','actual_attributable_charge_cny':d.get('actual_attributable_charge_cny'),
                   'private_final_roundtrip':priv,'qualified_signals':0,'orders':0,'simulation_ledger_writes':0,
                   'automatic_retry':False,'rollout_ledger_advanced':False,
                   'repeat_00010_permitted':False if sent else None,
                   'next':'Private semantic review; never retry sent 00010.' if sent else 'Diagnose before any provider retry; no automatic retry.'}
          Path('/tmp/RUN069_RECONCILIATION.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(rec,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RUN069_SANITIZED_00010_CHILD
          path: |
            /tmp/run069/SANITIZED_RESULT.json
            /tmp/RUN069_RECONCILIATION.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit sanitized receipts only
        if: always()
        working-directory: research
        run: |
          set -euo pipefail
          cp /tmp/RUN069_RECONCILIATION.json docs/runtime/RUN069_RECONCILIATION.json
          git add docs/runtime/RUN069_RECONCILIATION.json
          if test -f /tmp/run069/SANITIZED_RESULT.json; then
            cp /tmp/run069/SANITIZED_RESULT.json docs/runtime/RUN069_SANITIZED_RESULT.json
            git add docs/runtime/RUN069_SANITIZED_RESULT.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then echo no-change; else
            git commit -m 'dsa: record Run069 00010 paid child'
            git push
          fi
