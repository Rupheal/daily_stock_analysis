name: Run006 Tencent qfq recovery probe
on:
  push:
    branches: [trident/run004-fullpool-pit]
    paths: [.github/workflows/38-run006-tencent-raw-geometry-probe.yml]
permissions:
  contents: read
  actions: read
jobs:
  qfq-recovery-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify one-shot free execution boundary R5
        run: |
          python - <<'PY'
          import os
          if os.environ.get('GITHUB_RUN_ATTEMPT')!='1': raise SystemExit('rerun prohibited')
          print('RUN006_QFQ_BOUNDARY_R5_OK', {'geometry_denominator':114,'original_recovery_denominator':253,'model_calls':0,'paid_data':0})
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 34709328183
          name: public-pool-price-checks
          path: input/pool
          github-token: ${{ github.token }}
      - name: Verify frozen O-integrity denominator
        run: |
          python - <<'PY'
          import json
          x=json.load(open('input/pool/O-integrity.json'))
          assert x['track']=='O' and x['denominator']==660 and x['isolated']==253
          assert sum(1 for r in x['coverage'] if 'invalid_daily_geometry' in r.get('reason',''))==114
          print('RUN006_SOURCE_OK')
          PY
      - name: Validate Tencent qfq fallback eligibility R5
        run: python scripts/run006_probe_tencent_raw_geometry.py --integrity input/pool/O-integrity.json --output reports/run006/tencent-qfq-recovery.json
      - name: Verify diagnostic accounting
        run: |
          python - <<'PY'
          import json
          x=json.load(open('reports/run006/tencent-qfq-recovery.json'))
          assert x['run_id']=='TRI-DSA-DAT-20260914-006-GEOMETRY-QFQ-R5'
          assert x['geometry_denominator']==114 and len(x['rows'])==114
          assert sum(x['classification_counts'].values())==114
          assert x['model_http_requests']==0 and x['paid_data_used'] is False and x['historical_inputs_rewritten'] is False
          print('RUN006_QFQ_RECOVERY_R5_OK',x['classification_counts'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: run006-tencent-qfq-recovery-r5
          path: reports/run006/tencent-qfq-recovery.json
          if-no-files-found: error
          retention-days: 30
