name: DSA R0 Snapshot Guard Regression
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - scripts/u_daily_data_integrity_v1.py
      - scripts/dsa_snapshot_r0_contract_v1.py
      - scripts/u_production_daily_member_v1.py
      - scripts/dsa_daily_u_production_v1.py
      - scripts/dsa_daily_market_snapshot_v1.py
      - tests/test_snapshot_r0_contract_repair_v1.py
      - .github/workflows/dsa-snapshot-r0-guards-ci.yml
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts:${{ github.workspace }}
    steps:
      - uses: actions/checkout@v5
        with: {ref: '${{ github.sha }}', persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install pytest requests pandas openpyxl exchange-calendars yfinance
      - run: >
          python -m pytest --noconftest -q
          tests/test_snapshot_r0_contract_repair_v1.py
          tests/test_dsa_daily_formal_generation_repair_v1.py
          tests/test_dsa_daily_formal_packet_v1.py
          tests/test_u_production_daily_member_v1.py
