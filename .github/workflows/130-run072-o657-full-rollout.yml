name: DSA Run072 O657 formal full rollout and ranking
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - 'docs/runtime/RUN072_O657_FULL_SCOPE.json'
permissions:
  contents: write
  actions: read
concurrency:
  group: dsa-native-private-branch-writer
  cancel-in-progress: false
  queue: max

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      planned_calls: ${{ steps.plan.outputs.planned_calls }}
      deferred_count: ${{ steps.plan.outputs.deferred_count }}
      full_remaining_wave: ${{ steps.plan.outputs.full_remaining_wave }}
    env:
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/native-private-execution-20260914
          path: research
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pytest httpx requests
      - name: Verify canary, recovery, planner and ranking contracts
        working-directory: research
        run: |
          python -m pytest --noconftest -q             tests/test_plan_o657_rollout_v3.py             tests/test_aggregate_o_formal_ranking_v3.py             tests/test_o_strategy_core_acceptance.py             tests/test_o_unresolved_exclusion_policy.py
          python - <<'PY'
          import json
          s=json.load(open('docs/runtime/RUN072_O657_FULL_SCOPE.json'))
          c=json.load(open('docs/runtime/RUN071_O_CANARY_RESULT.json'))
          r=json.load(open('docs/runtime/RUN070_O_00008_CORE_RECOVERY_RESULT.json'))
          l=json.load(open('docs/runtime/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json'))
          assert s['target_session']=='2026-09-18'
          assert c['state']=='PASS_O_V3_CURRENT_SESSION_CANARY' and c['full_rollout_authorized'] is True
          assert r['state']=='PASS_CURRENT_CORE_RECOVERY' and r['ranking_eligible'] is True
          assert l['current_confirmed_send_count']>=4
          assert {x['code'] for x in l['confirmed_provider_sends']} >= {'00008','00010','00012','00013'}
          assert s['automatic_retry'] is False and s['real_orders']==0
          print('RUN072_PARENT_GATES_PASS')
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 35335286449
          github-token: ${{ github.token }}
          name: RUN060_CURRENT_OFFICIAL_CLOSE_EVIDENCE
          path: /tmp/run060
      - name: Bind exact Run060 O inputs
        working-directory: research
        run: |
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          s=json.load(open('docs/runtime/RUN072_O657_FULL_SCOPE.json'))
          targets={'universe':s['current_universe_sha256'],'history':s['history_cache_sha256']}
          found={}
          for p in Path('/tmp/run060').rglob('*'):
              if not p.is_file(): continue
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              for k,v in targets.items():
                  if h==v:
                      if k in found: raise SystemExit('DUPLICATE_HASH_MATCH:'+k)
                      found[k]=p
          assert set(found)==set(targets),found
          root=Path('/tmp/run072-plan/input');root.mkdir(parents=True)
          shutil.copy2(found['universe'],root/'O_UNIVERSE.json')
          shutil.copy2(found['history'],root/'O_HISTORY.json')
          print('RUN072_INPUT_HASH_BIND_PASS')
          PY
      - name: Plan affordable no-duplicate wave
        id: plan
        working-directory: research
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,httpx
          from decimal import Decimal,ROUND_FLOOR
          from pathlib import Path
          s=json.load(open('docs/runtime/RUN072_O657_FULL_SCOPE.json'))
          with httpx.Client(timeout=20) as c:
              r=c.get('https://api.deepseek.com/user/balance',headers={'Authorization':'Bearer '+os.environ['DEEPSEEK_API_KEY']})
              r.raise_for_status();d=r.json()
          rows=[x for x in d.get('balance_infos',[]) if x.get('currency')=='CNY']
          if not d.get('is_available') or len(rows)!=1: raise SystemExit('AVAILABLE_CNY_BALANCE_UNVERIFIED')
          bal=Decimal(rows[0]['total_balance'])
          reserve=Decimal(s['balance_safety_reserve_cny'])
          cap=Decimal(s['per_member_hard_cap_cny'])
          usable=max(Decimal('0'),bal-reserve)
          affordable=int((usable/cap).to_integral_value(rounding=ROUND_FLOOR))
          Path('/tmp/affordable-count').write_text(str(affordable))
          print('RUN072_BALANCE_GATE_PASS','positive_capacity='+str(affordable>0))
          PY
          python scripts/plan_o657_rollout_v3.py             --universe /tmp/run072-plan/input/O_UNIVERSE.json             --policy docs/runtime/O_UNRESOLVED_EXCLUSION_POLICY.json             --ledger docs/runtime/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json             --affordable-calls "$(cat /tmp/affordable-count)"             --max-shards 16             --out /tmp/run072-plan/PLAN.json
          python - <<'PY'
          import json,os
          from pathlib import Path
          s=json.load(open('docs/runtime/RUN072_O657_FULL_SCOPE.json'))
          p=json.load(open('/tmp/run072-plan/PLAN.json'))
          scopes=Path('/tmp/run072-plan/scopes');codes=Path('/tmp/run072-plan/codes')
          scopes.mkdir();codes.mkdir()
          for sh in p['shards']:
              sid=sh['shard_id']
              (codes/f'shard-{sid}.json').write_text(json.dumps(sh['codes'],ensure_ascii=False))
              scope={
                'schema_version':1,
                'run_id':s['run_id']+'-S'+sid,
                'shard_id':sid,
                'target_session':s['target_session'],
                'decision_session':s['decision_session'],
                'frozen_upstream':s['frozen_upstream'],
                'native_model_configuration':s['native_model_configuration'],
                'history_cache_sha256':s['history_cache_sha256'],
                'artifact_prefix':s['artifact_prefix']+'-S'+sid,
                'maximum_requests':sh['maximum_requests'],
                'maximum_cost_cny':sh['maximum_cost_cny'],
                'per_member_hard_cap_cny':s['per_member_hard_cap_cny'],
                'max_consecutive_provider_failures':s['max_consecutive_provider_failures'],
                'max_consecutive_infra_failures':s['max_consecutive_infra_failures'],
                'automatic_retry':False,'no_orders':True,'no_signal_publish':True,
                'simulation_writes':0,'raw_content_public':False
              }
              (scopes/f'scope-{sid}.json').write_text(json.dumps(scope,ensure_ascii=False,indent=2)+'\n')
          matrix={'include':[{'shard':x['shard_id']} for x in p['shards']]}
          out=os.environ['GITHUB_OUTPUT']
          with open(out,'a') as f:
              f.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
              f.write('planned_calls='+str(p['planned_calls'])+'\n')
              f.write('deferred_count='+str(p['deferred_count'])+'\n')
              f.write('full_remaining_wave='+str(p['full_remaining_wave']).lower()+'\n')
          print(json.dumps({
            'confirmed_spent_before_wave':p['confirmed_spent_before_wave'],
            'uncertain_claims_before_wave':p['uncertain_claims_before_wave'],
            'remaining_before_wave':p['remaining_before_wave'],
            'planned_calls':p['planned_calls'],'deferred_count':p['deferred_count'],
            'shard_count':p['shard_count'],'full_remaining_wave':p['full_remaining_wave'],
            'planned_maximum_cost_cny':p['planned_maximum_cost_cny']
          }))
          if p['planned_calls']==0: raise SystemExit('NO_AFFORDABLE_MODEL_CALL_CAPACITY')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RUN072_O657_PLAN_INPUT
          path: /tmp/run072-plan/
          retention-days: 90

  rollout:
    needs: plan
    if: needs.plan.outputs.planned_calls != '0'
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/native-private-execution-20260914
          path: research
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install native runtime
        run: pip install -r research/requirements.txt httpx requests deepseek-recipe==0.1.1
      - uses: actions/download-artifact@v4
        with:
          name: RUN072_O657_PLAN_INPUT
          path: /tmp/plan
      - name: Execute shard ${{ matrix.shard }}
        id: run
        continue-on-error: true
        working-directory: research
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: |
          python scripts/run_hk_o_operational_shard_v3.py             --checkout ../original             --cache /tmp/plan/input/O_HISTORY.json             --universe /tmp/plan/input/O_UNIVERSE.json             --policy docs/runtime/O_UNRESOLVED_EXCLUSION_POLICY.json             --scope "/tmp/plan/scopes/scope-${{ matrix.shard }}.json"             --codes-file "/tmp/plan/codes/shard-${{ matrix.shard }}.json"             --out "/tmp/run072-${{ matrix.shard }}"
      - name: Build sanitized shard artifact even on runner failure
        if: always()
        env:
          RUNNER_OUTCOME: ${{ steps.run.outcome }}
          SHARD_ID: ${{ matrix.shard }}
        run: |
          mkdir -p /tmp/public
          python - <<'PY'
          import json,os
          from pathlib import Path
          sid=os.environ['SHARD_ID'];src=Path('/tmp/run072-'+sid+'/SHARD_RESULT.json')
          if src.exists():
              d=json.load(open(src))
          else:
              planned=json.load(open('/tmp/plan/codes/shard-'+sid+'.json'))
              d={'schema_version':1,'run_id':'TRI-DSA-O-FULL-20260918-072-S'+sid,
                 'shard_id':sid,'members':[],
                 'planned_codes':[x['code'] for x in planned],
                 'attempted_members':0,'core_accepted':0,'model_http_requests_confirmed':0,
                 'usage_peak_estimate_cny':'0','shared_stop_reason':'SHARD_RUNNER_NO_RESULT',
                 'automatic_retry':False,'real_orders':0,'simulation_writes':0,'raw_content_public':False}
          d['runner_step_outcome']=os.environ['RUNNER_OUTCOME']
          Path('/tmp/public/SHARD_RESULT_'+sid+'.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'shard':sid,'outcome':os.environ['RUNNER_OUTCOME'],
                            'rows':len(d.get('members') or []),
                            'confirmed':d.get('model_http_requests_confirmed',0),
                            'core':d.get('core_accepted',0),
                            'shared_stop':d.get('shared_stop_reason')}))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RUN072_O657_SHARD_${{ matrix.shard }}
          path: /tmp/public/SHARD_RESULT_${{ matrix.shard }}.json
          if-no-files-found: error
          retention-days: 90

  aggregate:
    needs: [plan, rollout]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/native-private-execution-20260914
          path: research
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pytest
      - uses: actions/download-artifact@v4
        with:
          name: RUN072_O657_PLAN_INPUT
          path: /tmp/plan
      - uses: actions/download-artifact@v4
        if: needs.plan.outputs.planned_calls != '0'
        with:
          pattern: RUN072_O657_SHARD_*
          path: /tmp/shards
          merge-multiple: true
      - name: Validate ranking aggregator
        working-directory: research
        run: python -m pytest --noconftest -q tests/test_aggregate_o_formal_ranking_v3.py
      - name: Aggregate all current-session cores and update no-repeat ledger
        working-directory: research
        env:
          PLAN_FULL_WAVE: ${{ needs.plan.outputs.full_remaining_wave }}
          PLAN_DEFERRED: ${{ needs.plan.outputs.deferred_count }}
          PLAN_CALLS: ${{ needs.plan.outputs.planned_calls }}
        run: |
          python - <<'PY'
          import json,os,sys
          from decimal import Decimal
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from aggregate_o_formal_ranking_v3 import aggregate

          universe=json.load(open('/tmp/plan/input/O_UNIVERSE.json'))
          policy=json.load(open('docs/runtime/O_UNRESOLVED_EXCLUSION_POLICY.json'))
          sources=[
            ('RUN070_00008',json.load(open('docs/runtime/RUN070_O_00008_CORE_RECOVERY_RESULT.json'))),
            ('RUN071_CANARY',json.load(open('docs/runtime/RUN071_O_CANARY_RESULT.json'))),
          ]
          shard_paths=sorted(Path('/tmp/shards').glob('SHARD_RESULT_*.json')) if Path('/tmp/shards').exists() else []
          for p in shard_paths:
              sources.append((p.name,json.load(open(p))))
          rank=aggregate(universe,policy,sources)

          ledger=json.load(open('docs/runtime/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json'))
          frozen=ledger['frozen_upstream'];session=ledger['session']
          confirmed={x['model_call_key'] for x in ledger.get('confirmed_provider_sends') or []}
          uncertain={x['model_call_key'] for x in ledger.get('no_repeat_uncertain_claims') or []}
          wave_confirmed=0;wave_uncertain=0;wave_cost=Decimal('0')
          for p in shard_paths:
              d=json.load(open(p))
              for x in d.get('members') or []:
                  code=str(x.get('code') or '')
                  key=f'{session}:{code}:{frozen}'
                  req=int(x.get('model_http_requests_confirmed',0) or 0)
                  poss=int(x.get('model_http_requests_possible',0) or 0)
                  claimed=bool(x.get('claim_persisted'))
                  wave_cost+=Decimal(str(x.get('usage_peak_estimate_cny','0') or '0'))
                  if req==1:
                      if key in confirmed or key in uncertain: raise SystemExit('DUPLICATE_MODEL_CALL_KEY:'+key)
                      ledger['confirmed_provider_sends'].append({
                        'code':code,'model_call_key':key,'source_branch':'fix/native-private-execution-20260914',
                        'source_receipt':'docs/runtime/RUN072_O657_FORMAL_RESULT.json',
                        'source_run_id':d.get('run_id'),'source_workflow_run':int(os.environ['GITHUB_RUN_ID']),
                        'provider_response_sha256':x.get('provider_response_sha256'),
                        'model_http_requests_confirmed':1,'usage_peak_estimate_cny':x.get('usage_peak_estimate_cny'),
                        'strategy_core_sha256':x.get('strategy_core_sha256'),'raw_result_sha256':x.get('raw_result_sha256'),
                        'repeat_permitted':False
                      });confirmed.add(key);wave_confirmed+=1
                  elif claimed and poss>0:
                      if key in confirmed or key in uncertain: raise SystemExit('DUPLICATE_UNCERTAIN_CALL_KEY:'+key)
                      ledger.setdefault('no_repeat_uncertain_claims',[]).append({
                        'code':code,'model_call_key':key,'source_run_id':d.get('run_id'),
                        'source_workflow_run':int(os.environ['GITHUB_RUN_ID']),
                        'status':x.get('status'),'failure_code':x.get('failure_code'),
                        'model_http_requests_confirmed':0,'model_http_requests_possible':poss,
                        'repeat_permitted':False
                      });uncertain.add(key);wave_uncertain+=1
          ledger['current_confirmed_send_count']=len(ledger.get('confirmed_provider_sends') or [])
          ledger['current_uncertain_no_repeat_count']=len(ledger.get('no_repeat_uncertain_claims') or [])
          Path('/tmp/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json').write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')

          plan=json.load(open('/tmp/plan/PLAN.json'))
          rank.update({
            'run_id':'TRI-DSA-O-FULL-20260918-072',
            'decision_session':'2026-09-18',
            'base_operational_O_denominator':657,
            'model_http_requests_this_wave':wave_confirmed,
            'uncertain_no_repeat_claims_this_wave':wave_uncertain,
            'usage_peak_estimate_cny_this_wave':str(wave_cost),
            'current_session_confirmed_provider_sends':ledger['current_confirmed_send_count'],
            'current_session_uncertain_no_repeat_claims':ledger['current_uncertain_no_repeat_count'],
            'planned_calls_this_wave':plan['planned_calls'],
            'deferred_for_budget_count':plan['deferred_count'],
            'full_remaining_wave_planned':plan['full_remaining_wave'],
            'canary_gate':'PASS_O_V3_CURRENT_SESSION_CANARY',
            'raw_content_public':False,
            'automatic_retry':False,
            'schedule_changes':0,
            'main_merge':False,
          })
          if plan['deferred_count']>0 and rank['state']=='PASS_O_FORMAL_CORE_RANKING_TOP3':
              raise SystemExit('FORMAL_PASS_WITH_DEFERRED_BUDGET_CODES_PROHIBITED')
          Path('/tmp/RUN072_O657_FORMAL_RESULT.json').write_text(json.dumps(rank,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({
            'state':rank['state'],'processed':rank['processed_operational_members'],
            'missing':rank['missing_count'],'eligible':rank['ranking_eligible_count'],
            'additional_excluded':rank['additional_excluded_count'],
            'wave_confirmed':wave_confirmed,'wave_uncertain':wave_uncertain,
            'deferred_budget':plan['deferred_count'],
            'top3':[[x['code'],x['sentiment_score'],x['action']] for x in rank['Top3']]
          },ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RUN072_O657_FORMAL_SANITIZED
          path: |
            /tmp/RUN072_O657_FORMAL_RESULT.json
            /tmp/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json
            /tmp/plan/PLAN.json
          retention-days: 90
      - name: Commit formal result, model ledger, and checkpoint
        working-directory: research
        run: |
          cp /tmp/RUN072_O657_FORMAL_RESULT.json docs/runtime/RUN072_O657_FORMAL_RESULT.json
          cp /tmp/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json docs/runtime/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.load(open('/tmp/RUN072_O657_FORMAL_RESULT.json'))
          p=Path('docs/DSA_NEXT_ACTIONS.json');d=json.load(open(p))
          for row in d.get('next_actions',[]):
              if row.get('id')=='G4':
                  row['current_O_formal_receipt']='docs/runtime/RUN072_O657_FORMAL_RESULT.json'
                  row['status']=(
                    'O_FORMAL_TOP3_PASS_CORE'+str(result['ranking_eligible_count'])
                    +'_EXCLUDED'+str(result['base_excluded_count']+result['additional_excluded_count'])
                    if result['state']=='PASS_O_FORMAL_CORE_RANKING_TOP3'
                    else 'O_FORMAL_PARTIAL_MISSING'+str(result['missing_count'])
                    +'_CORE'+str(result['ranking_eligible_count'])
                  )+'; U_FORMAL_DECISION44_OF45_WAIT_NO_BUY'
          d['updated_at_utc']='2026-09-18T15:00:00Z'
          p.write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
          git add docs/runtime/RUN072_O657_FORMAL_RESULT.json docs/runtime/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json docs/DSA_NEXT_ACTIONS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Rupheal@users.noreply.github.com'
          git commit -m 'dsa: record O657 v3 formal core ranking wave'
          git fetch origin fix/native-private-execution-20260914
          git rebase origin/fix/native-private-execution-20260914
          git push origin HEAD:fix/native-private-execution-20260914
      - name: Report formal gate
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/RUN072_O657_FORMAL_RESULT.json'))
          if r['state']=='PASS_O_FORMAL_CORE_RANKING_TOP3':
              print('O_FORMAL_TOP3_PASS',[(x['code'],x['sentiment_score'],x['action']) for x in r['Top3']])
          else:
              print('O_FORMAL_NOT_CLOSED',r['state'],'missing',r['missing_count'])
          assert r['real_orders']==0 and r['simulation_writes']==0
          PY
