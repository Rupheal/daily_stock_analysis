name: Run006 B1 Tencent arbitration

on:
  push:
    branches: [trident/run004-fullpool-pit]
    paths: [run006_b1_tencent_arbitration_trigger.json]

permissions:
  contents: read
  actions: read

jobs:
  arbitrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify zero-cost trigger and syntax
        run: |
          python - <<'PY'
          import json,os,py_compile
          if os.environ.get('GITHUB_RUN_ATTEMPT')!='1': raise SystemExit('rerun prohibited')
          t=json.load(open('run006_b1_tencent_arbitration_trigger.json'))
          assert t['run_id']=='TRI-DSA-DAT-20260914-006-R1-TENCENT-ARBITRATION'
          assert t['paid_resources'] is False and t['model_calls_authorized'] is False
          assert t['frozen_recovery_denominator']==253 and t['track_denominator']==121
          py_compile.compile('scripts/run006_probe_tencent_recovery.py',doraise=True)
          print('RUN006_TENCENT_TRIGGER_OK')
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 34709328183
          name: public-pool-price-checks
          github-token: ${{ github.token }}
          path: input/integrity
      - name: Reverify frozen taxonomy
        run: |
          python - <<'PY'
          import json
          x=json.load(open('input/integrity/O-integrity.json'))
          assert x['denominator']==660 and x['passed']==407 and x['isolated']==253
          assert x['reasons']=={'independent_daily_disagreement':132,'ValueError:invalid_daily_geometry':114,'ValueError:missing_latest_session_or_21_bar_history':7}
          print('RUN006_TENCENT_DENOMINATOR_OK')
          PY
      - name: Probe Tencent raw and qfq windows
        run: |
          python scripts/run006_probe_tencent_recovery.py \
            --integrity input/integrity/O-integrity.json \
            --output reports/run006-b1/tencent-arbitration.json \
            --workers 8
      - name: Verify accounting
        run: |
          python - <<'PY'
          import json
          x=json.load(open('reports/run006-b1/tencent-arbitration.json'))
          assert x['track_denominator']==121 and len(x['rows'])==121
          assert sum(x['classification_counts'].values())==121
          assert x['model_http_requests']==0 and x['paid_data_used'] is False
          print('RUN006_TENCENT_ACCOUNTING_OK',x['classification_counts'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: run006-b1-tencent-arbitration
          path: reports/run006-b1/
          if-no-files-found: error
          retention-days: 30
