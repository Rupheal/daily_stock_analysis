name: Independent PR7 Foundation contract audit
on:
  push:
    branches:
      - audit/pr7-foundation-contract-independent-20260927
permissions:
  contents: read
jobs:
  contract-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pytest
      - run: PYTHONPATH=. pytest --noconftest -q tests/test_independent_pr7_foundation_contract.py tests/test_independent_pr40_snapshot.py
