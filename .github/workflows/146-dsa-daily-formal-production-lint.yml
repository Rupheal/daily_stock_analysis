name: DSA Daily Formal Production lint
on:
  push:
    branches: [research/dsa-daily-formal-generation-repair-20260921]
    paths:
      - .github/workflows/144-dsa-daily-o-formal-producer.yml
      - .github/workflows/145-dsa-daily-u-formal-producer.yml
      - .github/workflows/146-dsa-daily-formal-production-lint.yml
      - .github/workflows/148-dsa-daily-formal-default-scheduler.yml
permissions:
  contents: read
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {ref: research/dsa-daily-formal-generation-repair-20260921, persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install pyyaml
      - name: Parse and inspect production workflows
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          fs=['.github/workflows/144-dsa-daily-o-formal-producer.yml','.github/workflows/145-dsa-daily-u-formal-producer.yml']
          for f in fs:
              raw=Path(f).read_text();yaml.safe_load(raw)
              assert 'fix/native-private-execution-20260914' in raw
              assert 'real_orders' in raw.lower()
              assert 'force: true' not in raw.lower()
          assert 'U_DAILY_MACRO_AUTHORITY_LATEST.json' in Path(fs[1]).read_text()
          s=Path('.github/workflows/148-dsa-daily-formal-default-scheduler.yml').read_text();yaml.safe_load(s)
          assert "cron: '30 9 * * 1-5'" in s and "cron: '35 1 * * 1-5'" in s
          assert "REAL_ORDERS_AUTHORIZED: 'false'" in s
          print('DSA_DAILY_FORMAL_PRODUCTION_LINT_PASS')
          PY
