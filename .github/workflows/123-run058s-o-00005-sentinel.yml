name: DSA Run058S 00005 SEM002-mitigation sentinel

on:
  push:
    branches: [research/run058s-o-00005-sentinel-20260918]
    paths:
      - .github/workflows/123-run058s-o-00005-sentinel.yml
      - docs/runtime/RUN058S_SCOPE.json

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-run058s-o-00005-sentinel
  cancel-in-progress: false

jobs:
  sentinel:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'

    steps:
      - uses: actions/checkout@v5
        with:
          ref: research/run058s-o-00005-sentinel-20260918
          path: research
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}

      - name: Install deterministic and native dependencies
        run: pip install -r research/requirements.txt pytest httpx requests deepseek-recipe==0.1.1

      - name: Verify scope and mitigation dry parent
        working-directory: research
        run: |
          python -m pytest --noconftest -q             tests/test_o_news_coverage_limitation.py             tests/test_o_frozen_native_history_adapter.py             tests/test_o_native_input_contract.py             tests/test_bounded_native_members.py             tests/test_bounded_native_members_v2.py             tests/test_deepseek_flash_cap010_guard.py             tests/test_o_provider_completion.py             tests/test_private_multipart.py             tests/test_dsa_drive_recovery_regressions.py             tests/test_o_release_gate_contract.py
          python - <<'PY'
          import json
          s=json.load(open('docs/runtime/RUN058S_SCOPE.json'))
          r=json.load(open('docs/runtime/RUN058R_RESULT.json'))
          assert s['codes']==['00005'] and s['peer_session_isolated']==['00006']
          assert s['maximum_requests']==1 and s['maximum_cost_cny']=='0.10'
          assert s['frozen_native_history_adapter'] is True
          assert s['news_coverage_limitation_v1'] is True
          assert s['provider_send_authorized'] is True and s['automatic_retry'] is False
          assert s['no_orders'] is True and s['no_signal_publish'] is True
          assert r['state']=='PASS_COVERAGE_LIMITATION_DRY_READY_SENTINEL'
          assert r['code']=='00005'
          assert r['news_coverage_limitation_version']=='O_NEWS_COVERAGE_LIMITATION_v1'
          assert r['coverage_limitation_applied'] is True
          assert r['guard_relaxed'] is False and r['fake_news_added'] is False
          assert r['native_scoring_changed'] is False and r['frozen_upstream_prompt_template_changed'] is False
          assert r['model_http_requests']==0
          print('RUN058S_SCOPE_PASS')
          PY

      - uses: actions/download-artifact@v4
        with:
          run-id: 35224980615
          github-token: ${{ github.token }}
          name: RUN049_PUBLIC_CLOSE_AND_GATE_EVIDENCE
          path: parent

      - name: Bind exact O660 history
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN058S_SCOPE.json'))
          m=[p for p in Path('parent').rglob('market-history.json') if hashlib.sha256(p.read_bytes()).hexdigest()==s['history_cache_sha256']]
          assert len(m)==1
          d=json.loads(m[0].read_text())
          assert d['target_session']==s['target_session']
          assert 'hk00005' in (d.get('histories') or {})
          Path('/tmp/history-path').write_text(str(m[0].resolve()))
          PY

      - name: Execute at most one sentinel provider request for 00005
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: |
          python research/scripts/run_hk_bounded_native_members.py             --checkout original             --cache "$(cat /tmp/history-path)"             --scope research/docs/runtime/RUN058S_SCOPE.json             --out /tmp/run058s

      - name: Build sanitized sentinel reconciliation
        if: always()
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          p=Path('/tmp/run058s/SANITIZED_RESULT.json')
          if not p.exists():
              rec={
                'schema_version':1,'run_id':'TRI-DSA-O-NATIVE-20260918-058S',
                'state':'STOP_PAID_ROLLOUT','reason':'SANITIZED_RESULT_MISSING',
                'code':'00005','model_http_requests_confirmed':0,'model_http_requests_possible':0,
                'qualified_signals':0,'orders':0,'automatic_retry':False
              }
          else:
              d=json.loads(p.read_text()); m=d.get('members') or []
              assert len(m)<=1 and [x.get('code') for x in m]==['00005'][:len(m)]
              assert d.get('model_http_requests_confirmed',0)<=1
              assert d.get('model_http_requests_possible',0)<=1
              assert Decimal(d['maximum_cost_cny'])==Decimal('0.10')
              assert d.get('qualified_signals')==0 and d.get('simulation_ledger_writes')==0
              x=m[0] if m else {}
              priv=bool((x.get('private_persistence') or {}).get('save_read_hash_restore'))
              rec={
                'schema_version':1,'run_id':'TRI-DSA-O-NATIVE-20260918-058S',
                'state':'PENDING_PRIVATE_SEMANTIC_REVIEW' if d.get('model_http_requests_confirmed',0)==1 and priv else 'STOP_PAID_ROLLOUT',
                'code':'00005',
                'member_status':{k:x.get(k) for k in (
                    'status','raw_gate','raw_blockers','model_http_requests_confirmed',
                    'model_http_requests_possible','usage_peak_estimate_cny',
                    'observed_balance_change_cny','preflight_sha256',
                    'frozen_native_history_adapter','news_coverage_limitation_v1'
                )},
                'model_http_requests_confirmed':d.get('model_http_requests_confirmed',0),
                'model_http_requests_possible':d.get('model_http_requests_possible',0),
                'maximum_cost_cny':'0.10',
                'actual_attributable_charge_cny':d.get('actual_attributable_charge_cny'),
                'private_final_roundtrip':priv,
                'qualified_signals':0,'orders':0,'simulation_ledger_writes':0,
                'automatic_retry':False,'rollout_ledger_advanced':False,
                'next':'Private semantic review; if SEM-002 persists, stop paid rollout. Never retry this sent member.' if d.get('model_http_requests_confirmed',0)==1 else 'Stop paid rollout and diagnose without retry.'
              }
          Path('/tmp/RUN058S_RECONCILIATION.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(rec,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RUN058S_SANITIZED_SENTINEL
          path: |
            /tmp/run058s/SANITIZED_RESULT.json
            /tmp/RUN058S_RECONCILIATION.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit sanitized sentinel receipt to research branch only
        if: always()
        working-directory: research
        run: |
          set -euo pipefail
          cp /tmp/RUN058S_RECONCILIATION.json docs/runtime/RUN058S_RECONCILIATION.json
          if test -f /tmp/run058s/SANITIZED_RESULT.json; then
            cp /tmp/run058s/SANITIZED_RESULT.json docs/runtime/RUN058S_SANITIZED_RESULT.json
            git add docs/runtime/RUN058S_SANITIZED_RESULT.json
          fi
          git add docs/runtime/RUN058S_RECONCILIATION.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'dsa: record Run058S 00005 sentinel'
            git push origin HEAD:research/run058s-o-00005-sentinel-20260918
          fi
