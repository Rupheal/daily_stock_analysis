name: HK research official universe source probe
on:
  workflow_dispatch:
  push:
    branches: [fix/daily-data-integrity]
    paths: [.github/workflows/08-hk-research-sources.yml]
permissions:
  contents: read
jobs:
  source-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: python -m pip install openpyxl
      - run: python scripts/probe_hk_research_sources.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hk-research-official-sources
          path: probe/
          retention-days: 7
