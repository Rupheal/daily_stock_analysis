name: O frozen native session data-only diagnostic
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - .github/workflows/48-o-native-session-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Assert O disarmed and no model key exposed
        run: |
          python - <<'PY'
          import json,os
          arm=json.load(open('research/docs/runtime/run012-private-native-arm.json'))
          assert arm.get('armed') is False, 'O_MUST_REMAIN_DISARMED'
          assert not os.environ.get('DEEPSEEK_API_KEY')
          assert not os.environ.get('LLM_DEEPSEEK_API_KEY')
          print('{"o_disarmed":true,"model_key_exposed":false,"model_requests":0}')
          PY
      - name: Install frozen native runtime
        run: python -m pip install -r research/requirements.txt
      - name: Run frozen native CLI data-only with private local log
        shell: bash
        run: |
          set +e
          python research/scripts/run_hk_native_data_probe.py \
            --checkout original \
            --universe research/docs/dsa-u-universe.json \
            --scope O_single_stock_smoke \
            --expected-date 2026-09-15 \
            --expected-commit 089d9d26d68f8b839ea5a74a3784e4402925f8b7 \
            --timeout 240 \
            --output /tmp/o-native-session \
            > /tmp/o-native-session-private.log 2>&1
          rc=$?
          echo "$rc" > /tmp/o-native-session-probe.rc
          exit 0
      - name: Publish sanitized session metadata only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/o-native-session/coverage.json')
          out={'model_requests':0,'raw_native_log_disclosed':False,'expected_date':'2026-09-15'}
          out['probe_wrapper_exit_code']=int(Path('/tmp/o-native-session-probe.rc').read_text().strip())
          if not p.exists():
              out.update(status='coverage_missing')
              print(json.dumps(out)); raise SystemExit(1)
          d=json.loads(p.read_text())
          rows=d.get('coverage') or []
          row=rows[0] if len(rows)==1 else {}
          out.update(
            scope=d.get('scope'),
            frozen_commit=d.get('code_commit'),
            native_cli_returncode=d.get('returncode'),
            coverage_denominator=d.get('coverage_denominator'),
            current_valid_count=d.get('current_valid_count'),
            native_status=d.get('status'),
            code=row.get('code'),
            bars=row.get('bars'),
            latest_date=row.get('latest_date'),
            latest_bar_status=row.get('status'),
            native_log_mentions_code=row.get('native_log_mentions_code'),
            model_credentials_provided=d.get('model_credentials_provided'),
            model_analysis_enabled=d.get('model_analysis_enabled'),
            native_logic_modified=d.get('native_logic_modified'),
          )
          print(json.dumps(out,sort_keys=True))
          PY
