name: O frozen native session data-only diagnostic
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - .github/workflows/48-o-native-session-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Assert O disarmed and no model key exposed
        run: |
          python - <<'PY'
          import json,os
          arm=json.load(open('research/docs/runtime/run012-private-native-arm.json'))
          assert arm.get('armed') is False, 'O_MUST_REMAIN_DISARMED'
          assert not os.environ.get('DEEPSEEK_API_KEY')
          assert not os.environ.get('LLM_DEEPSEEK_API_KEY')
          print('{"o_disarmed":true,"model_key_exposed":false,"model_requests":0}')
          PY
      - name: Install frozen native runtime
        run: python -m pip install -r research/requirements.txt
      - name: Run frozen native CLI data-only with private local log
        shell: bash
        run: |
          set +e
          python research/scripts/run_hk_native_data_probe.py \
            --checkout original \
            --universe research/docs/dsa-u-universe.json \
            --scope O_single_stock_smoke \
            --expected-date 2026-09-15 \
            --expected-commit 089d9d26d68f8b839ea5a74a3784e4402925f8b7 \
            --timeout 240 \
            --output /tmp/o-native-session \
            > /tmp/o-native-session-private.log 2>&1
          rc=$?
          echo "$rc" > /tmp/o-native-session-probe.rc
          exit 0
      - name: Attribute native provider path without raw log disclosure
        run: |
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          text=Path('/tmp/o-native-session-private.log').read_text(errors='replace').lower()
          aliases={
            'EfinanceFetcher':['efinancefetcher','efinance'],
            'AkshareFetcher':['aksharefetcher','akshare'],
            'PytdxFetcher':['pytdxfetcher','pytdx'],
            'TushareFetcher':['tusharefetcher','tushare'],
            'BaostockFetcher':['baostockfetcher','baostock'],
            'YfinanceFetcher':['yfinancefetcher','yfinance','yahoo'],
            'TencentFetcher':['tencentfetcher','tencent'],
            'LongbridgeFetcher':['longbridgefetcher','longbridge'],
            'FutuFetcher':['futufetcher','futu'],
            'TickflowFetcher':['tickflowfetcher','tickflow'],
          }
          mentions={}; first={}
          for name,tokens in aliases.items():
              positions=[]; count=0
              for token in tokens:
                  count += text.count(token)
                  pos=text.find(token)
                  if pos >= 0: positions.append(pos)
              if count:
                  mentions[name]=count; first[name]=min(positions)
          order=[name for name,_ in sorted(first.items(),key=lambda kv:kv[1])]
          db=sqlite3.connect('/tmp/o-native-session/native-data.db')
          columns=[r[1] for r in db.execute('PRAGMA table_info(stock_daily)').fetchall()]
          source_col=next((c for c in ('source','data_source','provider') if c in columns),None)
          source_class='not_stored'
          if source_col:
              raw=db.execute(f"SELECT {source_col} FROM stock_daily WHERE code=? COLLATE NOCASE ORDER BY date DESC LIMIT 1",('hk01810',)).fetchone()
              value=str(raw[0]).lower() if raw and raw[0] is not None else ''
              source_class='unknown'
              for name,tokens in aliases.items():
                  if any(t in value for t in tokens): source_class=name; break
          db.close()
          print(json.dumps({
            'model_requests':0,
            'provider_mentions':mentions,
            'provider_first_mention_order':order,
            'stock_daily_source_column_present':bool(source_col),
            'stored_source_class':source_class,
            'raw_native_log_disclosed':False,
            'raw_stored_source_disclosed':False,
          },sort_keys=True))
          PY
      - name: Compare native final bar with independently dated target session
        run: |
          python - <<'PY'
          import json,sqlite3,requests
          from datetime import datetime
          db=sqlite3.connect('/tmp/o-native-session/native-data.db')
          row=db.execute("SELECT date,open,high,low,close,volume FROM stock_daily WHERE code=? COLLATE NOCASE ORDER BY date DESC LIMIT 1",('hk01810',)).fetchone()
          db.close()
          if not row: raise SystemExit('NATIVE_BAR_MISSING')
          native_date=str(row[0])[:10]; native=[float(x) for x in row[1:]]
          t=requests.get('https://web.ifzq.gtimg.cn/appstock/app/hkfqkline/get',params={'param':'hk01810,day,,,5,qfq'},timeout=20).json()
          rows=((t.get('data') or {}).get('hk01810') or {}).get('qfqday') or []
          target=next((r for r in rows if str(r[0])[:10]=='2026-09-15'),None)
          if not target: raise SystemExit('TARGET_TENCENT_BAR_MISSING')
          tv=[float(target[1]),float(target[3]),float(target[4]),float(target[2]),float(target[5])]
          pdiffs=[abs(native[i]-tv[i]) for i in range(4)]
          vol_rel=abs(native[4]/tv[4]-1.0) if native[4] and tv[4] else (0.0 if native[4]==tv[4] else None)
          out={
            'model_requests':0,'native_recorded_date':native_date,'independent_target_date':'2026-09-15',
            'date_offset_days':(datetime.fromisoformat('2026-09-15')-datetime.fromisoformat(native_date)).days,
            'ohlc_max_abs_diff':max(pdiffs),'ohlc_same_within_0_005':max(pdiffs)<=0.005,
            'volume_relative_diff':vol_rel,
            'volume_same_within_calibrated_latest_bound':vol_rel is not None and vol_rel<=0.00170985,
            'same_bar_fingerprint':max(pdiffs)<=0.005 and vol_rel is not None and vol_rel<=0.00170985,
            'raw_prices_disclosed':False,
          }
          print(json.dumps(out,sort_keys=True))
          PY
      - name: Publish sanitized session metadata only
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/o-native-session/coverage.json')
          out={'model_requests':0,'raw_native_log_disclosed':False,'expected_date':'2026-09-15'}
          out['probe_wrapper_exit_code']=int(Path('/tmp/o-native-session-probe.rc').read_text().strip())
          if not p.exists():
              out.update(status='coverage_missing')
              print(json.dumps(out)); raise SystemExit(1)
          d=json.loads(p.read_text())
          rows=d.get('coverage') or []
          row=rows[0] if len(rows)==1 else {}
          out.update(scope=d.get('scope'),frozen_commit=d.get('code_commit'),native_cli_returncode=d.get('returncode'),coverage_denominator=d.get('coverage_denominator'),current_valid_count=d.get('current_valid_count'),native_status=d.get('status'),code=row.get('code'),bars=row.get('bars'),latest_date=row.get('latest_date'),latest_bar_status=row.get('status'),native_log_mentions_code=row.get('native_log_mentions_code'),model_credentials_provided=d.get('model_credentials_provided'),model_analysis_enabled=d.get('model_analysis_enabled'),native_logic_modified=d.get('native_logic_modified'))
          print(json.dumps(out,sort_keys=True))
          PY
