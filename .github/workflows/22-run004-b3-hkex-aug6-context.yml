name: Run004 B3 Aug6 MINIMAX quote context
on:
  push:
    branches: [trident/run004-fullpool-pit]
    paths: [run004_b3_hkex_aug6_probe.json]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - name: Fetch and print all bounded MINIMAX contexts
        run: |
          curl --fail --location --silent --show-error --max-time 60 'https://www.hkex.com.hk/eng/stat/smstat/dayquot/d260806e.htm' -o /tmp/page.htm
          python - <<'PY'
          from pathlib import Path
          import re,html
          raw=Path('/tmp/page.htm').read_bytes().decode('latin1','ignore')
          text=re.sub(r'<[^>]+>','',html.unescape(raw)).replace('\r','')
          positions=[]; start=0
          while True:
              i=text.find('MINIMAX-W',start)
              if i<0: break
              positions.append(i); start=i+1
          print('MINIMAX_OCCURRENCES',len(positions))
          for n,i in enumerate(positions,1):
              print(f'---CONTEXT_{n}---')
              print(text[max(0,i-500):i+1300])
          PY
