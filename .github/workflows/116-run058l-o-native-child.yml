name: DSA Run058L second O native paid micro-batch

on:
  push:
    branches: [research/run058l-o-native-child-20260918]
    paths:
      - .github/workflows/116-run058l-o-native-child.yml
      - docs/runtime/RUN058L_SCOPE.json

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-run058l-o-native-child
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deterministic and native dependencies
        run: pip install -r research/requirements.txt pytest httpx requests deepseek-recipe==0.1.1

      - name: Verify immutable scope and dry parent
        working-directory: research
        run: |
          python -m pytest --noconftest -q             tests/test_o_frozen_native_history_adapter.py             tests/test_o_native_input_contract.py             tests/test_bounded_native_members.py             tests/test_bounded_native_members_v2.py             tests/test_deepseek_flash_cap010_guard.py             tests/test_o_provider_completion.py             tests/test_private_multipart.py             tests/test_dsa_drive_recovery_regressions.py             tests/test_o_release_gate_contract.py
          python - <<'PY'
          import json
          s=json.load(open('docs/runtime/RUN058L_SCOPE.json'))
          k=json.load(open('docs/runtime/RUN058K_RESULT.json'))
          assert s['codes']==['00003','00004']
          assert s['maximum_requests']==2 and s['maximum_cost_cny']=='0.20'
          assert s['per_member_cap_cny']=='0.10'
          assert s['frozen_native_history_adapter'] is True
          assert s['prior_model_http_requests_confirmed_for_this_batch']==0
          assert s['automatic_retry'] is False and s['no_orders'] is True and s['no_signal_publish'] is True
          assert k['state']=='PASS_BOTH_FROZEN_HISTORY_DRY'
          assert k['ready_for_paid_child']==['00003','00004']
          assert k['model_http_requests']==0
          print('RUN058L_SCOPE_PASS')
          PY

      - uses: actions/download-artifact@v4
        with:
          run-id: 35224980615
          github-token: ${{ github.token }}
          name: RUN049_PUBLIC_CLOSE_AND_GATE_EVIDENCE
          path: parent

      - name: Bind exact O660 history
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN058L_SCOPE.json'))
          matches=[p for p in Path('parent').rglob('market-history.json') if hashlib.sha256(p.read_bytes()).hexdigest()==s['history_cache_sha256']]
          assert len(matches)==1
          d=json.loads(matches[0].read_text())
          assert d['target_session']==s['target_session']
          for c in s['codes']: assert 'hk'+c in (d.get('histories') or {})
          Path('/tmp/history-path').write_text(str(matches[0].resolve()))
          print('RUN058L_HISTORY_BIND_PASS')
          PY

      - name: Execute at most one provider request per member with Drive claims and private persistence
        working-directory: research
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: |
          python scripts/run_hk_bounded_native_members.py             --checkout ../original             --cache "$(cat /tmp/history-path)"             --scope docs/runtime/RUN058L_SCOPE.json             --out /tmp/run058l

      - name: Build sanitized reconciliation without advancing ledger
        if: always()
        working-directory: research
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          p=Path('/tmp/run058l/SANITIZED_RESULT.json')
          if not p.exists():
              rec={
                'schema_version':1,'run_id':'TRI-DSA-O-NATIVE-20260918-058L',
                'state':'STOP_BATCH','reason':'SANITIZED_RESULT_MISSING',
                'micro_batch_id':'O57-MB-002','codes':['00003','00004'],
                'model_http_requests_confirmed':0,'model_http_requests_possible':0,
                'qualified_signals':0,'orders':0,'simulation_ledger_writes':0,
                'automatic_retry':False,'rollout_ledger_advanced':False
              }
          else:
              d=json.loads(p.read_text()); m=d.get('members') or []
              assert [x.get('code') for x in m]==['00003','00004'][:len(m)]
              assert d.get('model_http_requests_confirmed',0)<=2
              assert d.get('model_http_requests_possible',0)<=2
              assert Decimal(d['maximum_cost_cny'])==Decimal('0.20')
              assert d.get('qualified_signals')==0 and d.get('formal_pool_top3_generated') is False
              assert d.get('simulation_ledger_writes')==0
              sent=[x for x in m if x.get('model_http_requests_confirmed')==1]
              priv=all((x.get('private_persistence') or {}).get('save_read_hash_restore') for x in sent)
              rec={
                'schema_version':1,'run_id':'TRI-DSA-O-NATIVE-20260918-058L',
                'state':'PENDING_PRIVATE_SEMANTIC_REVIEW' if sent and priv else 'STOP_BATCH',
                'micro_batch_id':'O57-MB-002','codes':['00003','00004'],
                'attempted_members':len(m),
                'member_statuses':[{k:x.get(k) for k in (
                  'code','status','raw_gate','raw_blockers','model_http_requests_confirmed',
                  'model_http_requests_possible','usage_peak_estimate_cny','observed_balance_change_cny',
                  'preflight_sha256','frozen_native_history_adapter'
                )} for x in m],
                'sent_codes':[x.get('code') for x in sent],
                'unsent_codes':[x.get('code') for x in m if x.get('model_http_requests_confirmed')!=1],
                'model_http_requests_confirmed':d.get('model_http_requests_confirmed',0),
                'model_http_requests_possible':d.get('model_http_requests_possible',0),
                'maximum_cost_cny':'0.20','actual_attributable_charge_cny':d.get('actual_attributable_charge_cny'),
                'private_final_roundtrip_all_sent':priv,
                'qualified_signals':0,'orders':0,'simulation_ledger_writes':0,
                'formal_pool_top3_generated':False,'automatic_retry':False,
                'rollout_ledger_advanced':False,
                'next':'Restore and semantically review every actually-sent private response. Do not retry any sent member. Only after all sent members are dispositioned may the batch ledger advance or a never-sent member receive a new child.'
              }
          Path('/tmp/RUN058L_RECONCILIATION.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(rec,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RUN058L_SANITIZED_PAID_CHILD
          path: |
            /tmp/run058l/SANITIZED_RESULT.json
            /tmp/RUN058L_RECONCILIATION.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit sanitized receipts only
        if: always()
        working-directory: research
        run: |
          set -euo pipefail
          test -f /tmp/RUN058L_RECONCILIATION.json
          cp /tmp/RUN058L_RECONCILIATION.json docs/runtime/RUN058L_RECONCILIATION.json
          git add docs/runtime/RUN058L_RECONCILIATION.json
          if test -f /tmp/run058l/SANITIZED_RESULT.json; then
            cp /tmp/run058l/SANITIZED_RESULT.json docs/runtime/RUN058L_SANITIZED_RESULT.json
            git add docs/runtime/RUN058L_SANITIZED_RESULT.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then echo no-change; else
            git commit -m 'dsa: record Run058L second O paid child'
            git push
          fi
