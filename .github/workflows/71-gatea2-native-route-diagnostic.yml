name: O Gate A2 native route diagnostic
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - docs/runtime/run026-native-route-diagnostic.json
permissions:
  contents: read
concurrency:
  group: dsa-gatea2-native-diagnostic
  cancel-in-progress: false
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENV_FILE: /dev/null
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify diagnostic is model-free
        run: |
          python - <<'PY'
          import json,subprocess
          d=json.load(open('research/docs/runtime/run026-native-route-diagnostic.json'))
          assert d['model_http_requests_authorized']==0 and d['claim_creation_permitted'] is False
          assert d['gate_b_c']=='FROZEN' and d['runtime_activated'] is False
          assert subprocess.check_output(['git','rev-parse','HEAD'],cwd='original',text=True).strip()=='089d9d26d68f8b839ea5a74a3784e4402925f8b7'
          assert not subprocess.check_output(['git','diff','--name-only','HEAD'],cwd='original',text=True).strip()
          print('{"diagnostic_scope":"native_route_only","model_http_requests":0,"claim_created":false}')
          PY
      - name: Install runtime dependencies
        run: pip install -r research/requirements.txt pytest
      - name: Resolve target session
        run: |
          python - <<'PY'
          from datetime import datetime,timezone
          from pathlib import Path
          from o_target_session_contract import resolve_target_session
          t=resolve_target_session(datetime.now(timezone.utc)).target_session.isoformat()
          Path('/tmp/target').write_text(t); print('TARGET_SESSION',t)
          PY
      - name: Normal frozen native route
        run: |
          T="$(cat /tmp/target)"
          python research/scripts/run_hk_native_data_probe.py --checkout original --universe research/docs/dsa-u-universe.json --scope O_single_stock_smoke --expected-date "$T" --expected-commit 089d9d26d68f8b839ea5a74a3784e4402925f8b7 --target-boundary-adapter --timeout 240 --output /tmp/native-normal > /tmp/native-normal-wrapper.log 2>&1 || true
      - name: Explicit Yahoo-priority diagnostic route
        env:
          YFINANCE_PRIORITY: '0'
        run: |
          T="$(cat /tmp/target)"
          python research/scripts/run_hk_native_data_probe.py --checkout original --universe research/docs/dsa-u-universe.json --scope O_single_stock_smoke --expected-date "$T" --expected-commit 089d9d26d68f8b839ea5a74a3784e4402925f8b7 --target-boundary-adapter --timeout 240 --output /tmp/native-yahoo > /tmp/native-yahoo-wrapper.log 2>&1 || true
      - name: Build sanitized route comparison
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          target=Path('/tmp/target').read_text().strip()
          providers=['EfinanceFetcher','TencentFetcher','AkshareFetcher','TushareFetcher','TickFlowFetcher','PytdxFetcher','BaostockFetcher','YfinanceFetcher','LongbridgeFetcher','FutuFetcher']
          def one(root):
              p=Path(root)/'coverage.json'
              d=json.loads(p.read_text()) if p.exists() else {}
              rows=d.get('coverage') or []
              log=(Path(root)/'native.log').read_text(errors='replace') if (Path(root)/'native.log').exists() else ''
              return {
                'code_commit':d.get('code_commit'),'returncode':d.get('returncode'),'status':d.get('status'),
                'coverage_denominator':d.get('coverage_denominator'),'current_valid_count':d.get('current_valid_count'),
                'target_boundary_adapter':d.get('target_boundary_adapter'),'target_boundary_adapter_apply_count':d.get('target_boundary_adapter_apply_count'),
                'latest_date':rows[0].get('latest_date') if rows else None,'latest_status':rows[0].get('status') if rows else None,
                'providers_mentioned':[x for x in providers if x in log],
                'yfinance_success_marker':bool(re.search(r'YfinanceFetcher.*(?:获取成功|使用.*获取成功)',log)),
                'log_sha256':__import__('hashlib').sha256(log.encode()).hexdigest() if log else None
              }
          out={'schema_version':1,'run_id':'TRI-DSA-EXEC-20260916-026','target_session':target,
               'normal_route':one('/tmp/native-normal'),'yahoo_priority_route':one('/tmp/native-yahoo'),
               'model_http_requests':0,'claim_created':False,'runtime_activated':False,'gate_b_c':'FROZEN'}
          Path('run026-native-route-diagnostic.json').write_text(json.dumps(out,indent=2,ensure_ascii=False))
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: gatea2-native-route-diagnostic-${{ github.run_id }}
          path: run026-native-route-diagnostic.json
          if-no-files-found: warn
          retention-days: 14
