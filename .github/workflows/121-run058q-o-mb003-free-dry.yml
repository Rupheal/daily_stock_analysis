name: DSA Run058Q MB003 free preflight and frozen-history dry

on:
  push:
    branches: [research/run058q-o-mb003-free-dry-20260918]
    paths:
      - .github/workflows/121-run058q-o-mb003-free-dry.yml
      - docs/runtime/RUN058Q_SCOPE.json

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-run058q-o-mb003-free-dry
  cancel-in-progress: false

jobs:
  dry:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'

    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deterministic dependencies
        run: pip install -r research/requirements.txt pytest requests deepseek-recipe==0.1.1

      - name: Run safety tests and verify zero-model scope
        working-directory: research
        run: |
          python -m pytest --noconftest -q             tests/test_hk_pool_rollout_preflight_v2.py             tests/test_o_frozen_native_history_adapter.py             tests/test_o_native_input_contract.py             tests/test_deepseek_flash_cap010_guard.py             tests/test_bounded_native_members_v2.py             tests/test_run058_o_rollout_controller.py
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          s=json.load(open('docs/runtime/RUN058Q_SCOPE.json'))
          assert s['micro_batch_id']=='O57-MB-003'
          assert s['codes']==['00005','00006']
          assert s['model_http_requests_authorized']==0
          assert s['paid_data_calls_authorized']==0
          assert s['drive_writes_authorized']==0
          assert s['provider_send_authorized'] is False
          assert s['automatic_retry'] is False and s['no_orders'] is True
          assert hashlib.sha256(Path('docs/runtime/RUN058_O_ROLLOUT_LEDGER.jsonl').read_bytes()).hexdigest()==s['rollout_ledger_sha256']
          print('RUN058Q_ZERO_MODEL_SCOPE_PASS')
          PY

      - uses: actions/download-artifact@v4
        with:
          run-id: 35224980615
          github-token: ${{ github.token }}
          name: RUN049_PUBLIC_CLOSE_AND_GATE_EVIDENCE
          path: parent

      - name: Bind exact O660 history
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN058Q_SCOPE.json'))
          matches=[p for p in Path('parent').rglob('market-history.json') if hashlib.sha256(p.read_bytes()).hexdigest()==s['history_cache_sha256']]
          assert len(matches)==1
          d=json.loads(matches[0].read_text())
          assert d['target_session']==s['target_session']
          for c in s['codes']: assert 'hk'+c in (d.get('histories') or {})
          Path('/tmp/history-path').write_text(str(matches[0].resolve()))
          print('RUN058Q_HISTORY_BIND_PASS')
          PY

      - name: Build fresh v2 preflights
        run: |
          set +e
          mkdir -p /tmp/run058q
          for C in 00005 00006; do
            python research/scripts/prepare_hk_pool_rollout_preflight_v2.py               --code "$C" --target 2026-09-17               --universe research/docs/runtime/run032_public_cache/O_UNIVERSE.json               --cache "$(cat /tmp/history-path)"               --plan research/docs/runtime/RUN057_O_NATIVE_PLAN.json               --out "/tmp/run058q/$C-preflight"
            echo "$?" > "/tmp/run058q/$C-preflight.rc"
          done
          exit 0

      - name: Run frozen-history dry envelopes without provider or Drive credentials
        run: |
          mkdir -p /tmp/config
          python - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/config/native-model-config.json').write_text(json.dumps({
            'model_list':[{'model_name':'openai/deepseek-flash','litellm_params':{
              'model':'openai/deepseek-flash','api_base':'https://api.deepseek.com',
              'api_key':'os.environ/LLM_DEEPSEEK_API_KEY','extra_body':{'thinking':{'type':'disabled'}}
            }}]
          }))
          PY
          set +e
          for C in 00005 00006; do
            DSA_BUDGET_PROBE_ONLY=1             DSA_DEEPSEEK_V41_TOKENIZER="${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json"             DSA_INPUT_TOKEN_MARGIN=2048 DSA_EXPECT_THINKING=disabled             LITELLM_CONFIG=/tmp/config/native-model-config.json             LLM_CHANNELS=deepseek LLM_DEEPSEEK_PROTOCOL=openai LLM_DEEPSEEK_BASE_URL=https://api.deepseek.com             LLM_DEEPSEEK_MODELS=deepseek-flash LITELLM_MODEL=openai/deepseek-flash LITELLM_FALLBACK_MODELS=''             LLM_DEEPSEEK_API_KEY=dry-envelope-no-network             python research/scripts/run_hk_original_model_probe_run030.py               --symbol "HK$C"               --checkout original               --expected-commit 089d9d26d68f8b839ea5a74a3784e4402925f8b7               --preflight "/tmp/run058q/$C-preflight/preflight.json"               --output "/tmp/run058q/$C-dry"               --limit-cny 0.10 --carry-upper-cny 0               --target-boundary-adapter --frozen-native-history-adapter --news-handoff-v1
            echo "$?" > "/tmp/run058q/$C-dry.rc"
          done
          exit 0

      - name: Build fail-closed free receipt
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rows=[]
          for code in ['00005','00006']:
              pr=Path('/tmp/run058q')/(code+'-preflight')
              dr=Path('/tmp/run058q')/(code+'-dry')
              pre_rc=int((Path('/tmp/run058q')/(code+'-preflight.rc')).read_text())
              dry_rc=int((Path('/tmp/run058q')/(code+'-dry.rc')).read_text())
              row={'code':code,'preflight_returncode':pre_rc,'dry_returncode':dry_rc}
              p=pr/'preflight.json'
              if p.exists():
                  row['preflight_sha256']=hashlib.sha256(p.read_bytes()).hexdigest()
                  d=json.loads(p.read_text())
                  row['fresh_preflight_status']='PASS_POOL_TARGET_PREFLIGHT_V2' if pre_rc==0 else 'FAIL'
                  row['historical_mismatch_sessions']=d['price_reconciliation']['historical_cross_provider_diagnostic']['ohlc_mismatch_sessions']
                  row['target_volume_status']=d['price_reconciliation']['fresh_target_session']['volume']['latest_status']
              else:
                  f=pr/'FREE_PREFLIGHT_STATUS.json'
                  row['fresh_preflight_status']='FAIL'
                  row['preflight_failure_reason']=json.loads(f.read_text()).get('reason') if f.exists() else 'UNKNOWN'
              b=dr/'budget.json'; s=dr/'probe-summary.json'
              if b.exists():
                  bd=json.loads(b.read_text()); q=bd.get('requests') or []
                  row['request_count']=len(q)
                  row['dry_request_status']=q[0].get('status') if len(q)==1 else None
                  row['pre_send_peak_upper_cny']=q[0].get('pre_send_peak_upper_cny') if len(q)==1 else None
              if s.exists():
                  ps=json.loads(s.read_text())
                  row['input_validated']=ps.get('input_validated')
                  row['news_loader_consumed']=ps.get('news_loader_consumed')
                  row['news_prompt_consumed']=ps.get('news_prompt_consumed')
                  a=ps.get('frozen_native_history_adapter_receipt') or {}
                  row['adapter_count']=a.get('count')
                  row['history_rows']=a.get('rows')
                  row['history_sha256']=a.get('history_sha256')
              row['status']='PASS_FROZEN_HISTORY_DRY' if (
                  pre_rc==0 and row.get('request_count')==1 and
                  row.get('dry_request_status')=='dry_envelope_validated_not_sent' and
                  row.get('input_validated') is True and row.get('adapter_count')==1 and
                  (row.get('history_rows') or 0)>=21 and
                  row.get('news_loader_consumed') is True and row.get('news_prompt_consumed') is True
              ) else 'FAIL_FREE_OR_DRY'
              rows.append(row)
          ready=[x['code'] for x in rows if x['status']=='PASS_FROZEN_HISTORY_DRY']
          out={
            'schema_version':1,'run_id':'TRI-DSA-O-FREE-DRY-20260918-058Q',
            'state':'PASS_BOTH_FREE_DRY_PAID_GATE_HELD' if ready==['00005','00006'] else 'STOP_MB003_FREE_DRY',
            'micro_batch_id':'O57-MB-003','members':rows,
            'ready_for_paid_child':ready if ready==['00005','00006'] else [],
            'paid_gate_held':True,
            'paid_gate_hold_reason':'SYSTEMIC_SEM002_REVIEW_AFTER_3_OF_3_SENT_ROLLOUT_MEMBERS_PERMANENTLY_ISOLATED',
            'model_http_requests':0,'provider_credentials_used':False,'drive_writes':0,
            'DeepSeek_API_cost_cny':0,'paid_data_calls':0,'real_orders':0,'simulation_writes':0,
            'automatic_retry':False,
            'next':'Run systemic SEM-002 root-cause/mitigation acceptance before any paid MB003 child.' if ready==['00005','00006'] else 'Keep MB003 frozen and diagnose failed free gate.'
          }
          Path('/tmp/RUN058Q_RESULT.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: RUN058Q_MB003_FREE_DRY
          path: |
            /tmp/RUN058Q_RESULT.json
            /tmp/run058q/00005-preflight/preflight.json
            /tmp/run058q/00006-preflight/preflight.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit sanitized Run058Q receipt
        working-directory: research
        run: |
          set -euo pipefail
          cp /tmp/RUN058Q_RESULT.json docs/runtime/RUN058Q_RESULT.json
          git add docs/runtime/RUN058Q_RESULT.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then echo no-change; else
            git commit -m 'dsa: record Run058Q MB003 free dry'
            git push
          fi
