name: DSA Run058A0 fresh O preflight
on:
  push:
    branches: [research/run058a0-fresh-preflight-20260918]
    paths:
      - docs/runtime/RUN058A0_SCOPE.json
      - scripts/run058a0_fresh_preflight.py
      - tests/test_run058a0_fresh_preflight.py
      - .github/workflows/105-run058a0-fresh-preflight.yml
permissions:
  contents: write
  actions: read
concurrency:
  group: dsa-run058a0-fresh-preflight
  cancel-in-progress: false
jobs:
  fresh:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          persist-credentials: true
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install deterministic/public-data dependencies
        run: pip install -r research/requirements.txt pytest
      - name: Run Run058A0 deterministic tests
        working-directory: research
        run: python -m pytest --noconftest -q tests/test_run058a0_fresh_preflight.py tests/test_o_target_session_contract.py tests/test_o_native_input_contract.py
      - name: Build fresh 00001/00002 market preflights
        run: >
          python research/scripts/run058a0_fresh_preflight.py
          --checkout original
          --universe research/docs/runtime/run032_public_cache/O_UNIVERSE.json
          --scope research/docs/runtime/RUN058A0_SCOPE.json
          --out /tmp/run058a0
      - name: Verify fresh zero-model gate
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/run058a0/RUN058A0_FRESH_PREFLIGHT_RESULT.json')
          r=json.loads(p.read_text())
          assert r['state']=='PASS_FRESH_PREFLIGHT'
          assert r['target_session']=='2026-09-17' and r['decision_session']=='2026-09-18'
          assert r['pit']['effective_session']=='2026-09-17' and r['pit']['denominator']==660 and r['pit']['full_union_verified']
          assert [x['code'] for x in r['members']]==['00001','00002']
          assert all(x['native_sessions']>=21 and x['native_last']=='2026-09-17' and x['model_http_requests']==0 for x in r['members'])
          assert r['fresh_history_all_pass'] is True
          assert r['resource_accounting']['model_http_requests']==0 and r['resource_accounting']['deepseek_cost_cny']=='0'
          assert r['safety']['provider_send_authorized'] is False
          for code in ['00001','00002']:
              q=json.loads(Path('/tmp/run058a0/HK'+code+'/preflight.json').read_text())
              assert q['passed'] and q['prices_passed'] and q['target']=='2026-09-17'
              assert q['news_count']==0 and q['company_news_evidence']==[] and q['risk_review_complete'] is False
              assert len(q['validated_native_history'])>=21
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RUN058A0_FRESH_PREFLIGHT
          path: |
            /tmp/run058a0/RUN058A0_FRESH_PREFLIGHT_RESULT.json
            /tmp/run058a0/HK00001/preflight.json
            /tmp/run058a0/HK00002/preflight.json
          if-no-files-found: error
          retention-days: 90
      - name: Commit sanitized fresh preflight receipt
        run: |
          mkdir -p research/docs/runtime/run058a0_fresh_preflight
          cp /tmp/run058a0/RUN058A0_FRESH_PREFLIGHT_RESULT.json research/docs/runtime/
          cp /tmp/run058a0/HK00001/preflight.json research/docs/runtime/run058a0_fresh_preflight/HK00001.json
          cp /tmp/run058a0/HK00002/preflight.json research/docs/runtime/run058a0_fresh_preflight/HK00002.json
          cd research
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/runtime/RUN058A0_FRESH_PREFLIGHT_RESULT.json docs/runtime/run058a0_fresh_preflight/
          git diff --cached --quiet || git commit -m "dsa: record Run058A0 fresh O preflight"
          git push
