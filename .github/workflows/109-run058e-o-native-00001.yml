name: DSA Run058E paid O native child 00001

on:
  push:
    branches: [research/run058e-o-native-00001-20260918]
    paths:
      - .github/workflows/109-run058e-o-native-00001.yml
      - scripts/run_hk_bounded_native_members.py
      - docs/runtime/RUN058E_SCOPE.json

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-run058e-o-native-00001
  cancel-in-progress: false

jobs:
  native-00001:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'

    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install native dependencies
        run: pip install -r research/requirements.txt pytest httpx requests deepseek-recipe==0.1.1

      - name: Run bounded safety and v2 preflight tests
        working-directory: research
        run: |
          python -m pytest --noconftest -q \
            tests/test_hk_pool_rollout_preflight_v2.py \
            tests/test_native_model_configuration.py \
            tests/test_o_provider_completion.py \
            tests/test_private_multipart.py \
            tests/test_dsa_drive_recovery_regressions.py \
            tests/test_member_history_window.py \
            tests/test_bounded_native_members.py \
            tests/test_o_native_input_contract.py \
            tests/test_run_hk_original_model_probe_imports.py \
            tests/test_deepseek_flash_cap010_guard.py \
            tests/test_o_release_quote_semantics.py \
            tests/test_o_release_gate_contract.py

      - name: Verify immutable paid child scope
        run: |
          python - <<'PY'
          import json
          s=json.load(open('research/docs/runtime/RUN058E_SCOPE.json'))
          r=json.load(open('research/docs/runtime/RUN058D_RESULT.json'))
          assert s['run_id']=='TRI-DSA-O-NATIVE-20260918-058E'
          assert s['codes']==['00001']
          assert r['ready_for_new_paid_child']==['00001']
          assert '00002' in r['session_preflight_isolated']
          assert s['preflight_builder']=='O_POOL_TARGET_PREFLIGHT_V2'
          assert s['maximum_requests']==1 and s['maximum_cost_cny']=='0.10'
          assert s['per_member_cap_cny']=='0.10'
          assert s['provider_send_authorized'] is True
          assert s['automatic_retry'] is False
          assert s['no_orders'] is True and s['no_signal_publish'] is True
          assert set(s['codes']).isdisjoint(set(s['no_repeat_codes']))
          print('RUN058E_SCOPE_PASS')
          PY

      - uses: actions/download-artifact@v4
        with:
          run-id: 35224980615
          github-token: ${{ github.token }}
          name: RUN049_PUBLIC_CLOSE_AND_GATE_EVIDENCE
          path: parent

      - name: Bind exact 2026-09-17 O660 history cache
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN058E_SCOPE.json'))
          matches=[]
          for p in Path('parent').rglob('market-history.json'):
              if hashlib.sha256(p.read_bytes()).hexdigest()==s['history_cache_sha256']:
                  matches.append(p)
          assert len(matches)==1
          d=json.loads(matches[0].read_text())
          assert d['schema']=='DSA_PUBLIC_MARKET_HISTORY_v1'
          assert d['target_session']=='2026-09-17'
          assert 'hk00001' in d['histories']
          Path('/tmp/history-path').write_text(str(matches[0].resolve()))
          PY

      - name: Execute bounded provider child for 00001
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: |
          python research/scripts/run_hk_bounded_native_members.py \
            --checkout original \
            --cache "$(cat /tmp/history-path)" \
            --scope research/docs/runtime/RUN058E_SCOPE.json \
            --out /tmp/run058e

      - name: Reconcile paid child fail-closed
        if: always()
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          p=Path('/tmp/run058e/SANITIZED_RESULT.json')
          if not p.exists():
              out={
                'schema_version':1,'run_id':'TRI-DSA-O-NATIVE-20260918-058E',
                'state':'STOP_ROLLOUT','reason':'SANITIZED_RESULT_MISSING',
                'codes':['00001'],'model_http_requests_confirmed':0,
                'model_http_requests_possible':0,'maximum_cost_cny':'0.10',
                'qualified_signals':0,'orders':0,'automatic_retry':False,
              }
          else:
              d=json.loads(p.read_text());members=d.get('members') or []
              assert len(members)==1 and members[0].get('code')=='00001'
              m=members[0]
              assert d.get('model_http_requests_confirmed',0)<=1
              assert d.get('model_http_requests_possible',0)<=1
              assert Decimal(d['maximum_cost_cny'])==Decimal('0.10')
              assert d.get('qualified_signals')==0
              assert d.get('formal_pool_top3_generated') is False
              assert d.get('simulation_ledger_writes')==0
              accepted={'PASS_NATIVE_AUTOMATED_PENDING_MANUAL_REVIEW','PASS_WITH_VERSIONED_RELEASE_ADAPTER_PENDING_MANUAL_REVIEW'}
              private_ok=bool((m.get('private_persistence') or {}).get('save_read_hash_restore'))
              pre_private_ok=bool((m.get('pre_send_private_persistence') or {}).get('save_read_hash_restore'))
              accepted_native=m.get('status') in accepted and private_ok and pre_private_ok and m.get('model_http_requests_confirmed')==1
              out={
                'schema_version':1,'run_id':'TRI-DSA-O-NATIVE-20260918-058E',
                'state':'ACCEPTED_NATIVE_PENDING_MANUAL_REVIEW' if accepted_native else 'STOP_ROLLOUT',
                'codes':['00001'],
                'member_status':{k:m.get(k) for k in ('code','status','preflight_builder','raw_gate','raw_blockers','model_http_requests_confirmed','model_http_requests_possible','usage_peak_estimate_cny','observed_balance_change_cny','failure_class','failure_code')},
                'pre_send_private_roundtrip':pre_private_ok,
                'final_private_roundtrip':private_ok,
                'model_http_requests_confirmed':d.get('model_http_requests_confirmed',0),
                'model_http_requests_possible':d.get('model_http_requests_possible',0),
                'maximum_cost_cny':'0.10',
                'actual_attributable_charge_cny':d.get('actual_attributable_charge_cny'),
                'qualified_signals':0,'formal_pool_top3_generated':False,
                'orders':0,'simulation_ledger_writes':0,
                'manual_review_required':True,'automatic_retry':False,
                'next':'Record child and advance to next never-called member only after manual/semantic receipt acceptance.' if accepted_native else 'Freeze rollout; no automatic retry. Diagnose this child and reconcile any durable Drive claim before any new send.',
              }
          Path('/tmp/RUN058E_CHILD_RECONCILIATION.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RUN058E_SANITIZED_CHILD
          path: |
            /tmp/run058e/SANITIZED_RESULT.json
            /tmp/RUN058E_CHILD_RECONCILIATION.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit sanitized paid-child receipt
        if: always()
        working-directory: research
        run: |
          set -euo pipefail
          test -f /tmp/RUN058E_CHILD_RECONCILIATION.json
          cp /tmp/RUN058E_CHILD_RECONCILIATION.json docs/runtime/RUN058E_CHILD_RECONCILIATION.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime/RUN058E_CHILD_RECONCILIATION.json
          if test -f /tmp/run058e/SANITIZED_RESULT.json; then
            cp /tmp/run058e/SANITIZED_RESULT.json docs/runtime/RUN058E_SANITIZED_RESULT.json
            git add docs/runtime/RUN058E_SANITIZED_RESULT.json
          fi
          if git diff --cached --quiet; then echo 'No Run058E receipt changes'; else
            git commit -m 'dsa: record Run058E O native child 00001'
            git push
          fi
