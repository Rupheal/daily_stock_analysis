name: DSA Run058R selective O native paid child 00005

on:
  push:
    branches: [research/run058r-o-00005-native-20260918]
    paths:
      - .github/workflows/122-run058r-o-00005-native.yml
      - docs/runtime/RUN058R_SCOPE.json

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-run058r-o-00005-native
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v5
        with: {path: research, fetch-depth: 0}
      - uses: actions/checkout@v5
        with: {repository: ZhuLinsen/daily_stock_analysis, ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7, path: original, persist-credentials: false}
      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install -r research/requirements.txt pytest httpx requests deepseek-recipe==0.1.1
      - name: Verify scope
        working-directory: research
        run: |
          python -m pytest --noconftest -q tests/test_o_frozen_native_history_adapter.py tests/test_o_native_input_contract.py tests/test_bounded_native_members.py tests/test_bounded_native_members_v2.py tests/test_deepseek_flash_cap010_guard.py tests/test_o_provider_completion.py tests/test_private_multipart.py tests/test_dsa_drive_recovery_regressions.py tests/test_o_release_gate_contract.py
          python - <<'PY'
          import json
          s=json.load(open('docs/runtime/RUN058R_SCOPE.json')); q=json.load(open('docs/runtime/RUN058Q_RESULT.json'))
          assert s['codes']==['00005'] and s['maximum_requests']==1 and s['maximum_cost_cny']=='0.10'
          assert s['frozen_native_history_adapter'] is True and s['prior_model_http_requests_confirmed_for_this_batch']==0
          assert s['session_preflight_isolated']==['00006'] and s['automatic_retry'] is False
          m={x['code']:x for x in q['members']}
          assert m['00005']['status']=='PASS_FROZEN_HISTORY_DRY'
          assert m['00005']['pre_send_peak_upper_cny']=='0.079682'
          assert m['00006']['preflight_returncode']==1
          print('RUN058R_SCOPE_PASS')
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 35224980615
          github-token: ${{ github.token }}
          name: RUN049_PUBLIC_CLOSE_AND_GATE_EVIDENCE
          path: parent
      - name: Bind exact history
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN058R_SCOPE.json'))
          m=[p for p in Path('parent').rglob('market-history.json') if hashlib.sha256(p.read_bytes()).hexdigest()==s['history_cache_sha256']]
          assert len(m)==1 and json.loads(m[0].read_text())['target_session']==s['target_session'] and 'hk00005' in json.loads(m[0].read_text())['histories']
          Path('/tmp/history-path').write_text(str(m[0].resolve()))
          PY
      - name: One provider request max with Drive claim/private persistence
        working-directory: research
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: |
          python scripts/run_hk_bounded_native_members.py --checkout ../original --cache "$(cat /tmp/history-path)" --scope docs/runtime/RUN058R_SCOPE.json --out /tmp/run058r
      - name: Reconcile sanitized only
        if: always()
        working-directory: research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/run058r/SANITIZED_RESULT.json')
          d=json.loads(p.read_text()) if p.exists() else {'members':[],'model_http_requests_confirmed':0,'model_http_requests_possible':0}
          m=d.get('members') or []
          rec={'schema_version':1,'run_id':'TRI-DSA-O-NATIVE-20260918-058R','state':'PENDING_PRIVATE_SEMANTIC_REVIEW' if len(m)==1 and m[0].get('model_http_requests_confirmed')==1 and (m[0].get('private_persistence') or {}).get('save_read_hash_restore') else 'STOP_BATCH',
               'micro_batch_id':'O57-MB-003','code':'00005','peer_isolated':'00006',
               'member_status':{k:(m[0].get(k) if m else None) for k in ('status','raw_gate','raw_blockers','model_http_requests_confirmed','model_http_requests_possible','usage_peak_estimate_cny','observed_balance_change_cny','preflight_sha256','frozen_native_history_adapter')},
               'model_http_requests_confirmed':d.get('model_http_requests_confirmed',0),'model_http_requests_possible':d.get('model_http_requests_possible',0),
               'maximum_cost_cny':'0.10','actual_attributable_charge_cny':d.get('actual_attributable_charge_cny'),
               'qualified_signals':0,'orders':0,'simulation_ledger_writes':0,'automatic_retry':False,'rollout_ledger_advanced':False,
               'next':'Private semantic review; never retry sent 00005. 00006 remains target-session isolate.'}
          Path('/tmp/RUN058R_RECONCILIATION.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n'); print(json.dumps(rec,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RUN058R_SANITIZED_PAID_CHILD
          path: |
            /tmp/run058r/SANITIZED_RESULT.json
            /tmp/RUN058R_RECONCILIATION.json
          if-no-files-found: warn
          retention-days: 90
      - name: Commit sanitized receipts
        if: always()
        working-directory: research
        run: |
          set -euo pipefail
          cp /tmp/RUN058R_RECONCILIATION.json docs/runtime/RUN058R_RECONCILIATION.json
          git add docs/runtime/RUN058R_RECONCILIATION.json
          if test -f /tmp/run058r/SANITIZED_RESULT.json; then cp /tmp/run058r/SANITIZED_RESULT.json docs/runtime/RUN058R_SANITIZED_RESULT.json; git add docs/runtime/RUN058R_SANITIZED_RESULT.json; fi
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then echo no-change; else git commit -m 'dsa: record Run058R 00005 native child'; git push; fi
