name: O successor target wiring static model-free
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - .github/workflows/55-o-successor-target-static.yml
      - .github/workflows/52-o-zero-http-recovery-successor.yml
      - docs/runtime/run018-recovery-target-identity.json
      - scripts/prepare_xiaomi_acceptance_targeted.py
      - scripts/o_target_session_contract.py
permissions:
  contents: read
jobs:
  static-target-wiring:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install static parser only
        run: pip install pyyaml
      - name: Validate YAML target wiring and embedded Python syntax
        run: |
          python - <<'PY'
          import ast, re, yaml
          from pathlib import Path
          p=Path('.github/workflows/52-o-zero-http-recovery-successor.yml')
          text=p.read_text()
          yaml.safe_load(text)
          assert 'prepare_xiaomi_acceptance_targeted.py' in text
          assert "assert str(d.get('target'))=='2026-09-15'" not in text
          assert '--expected-date 2026-09-15' not in text
          assert "claimed_target_session" in text
          assert "/tmp/o-frozen-target-session" in text
          assert 'RECOVERY_TARGET_EXPIRED_NEW_COMPLETED_SESSION' in text
          blocks=[]
          lines=text.splitlines()
          i=0
          while i < len(lines):
              line=lines[i]
              if "python - <<'PY'" in line:
                  base=len(line)-len(line.lstrip())
                  i+=1; chunk=[]
                  while i < len(lines):
                      cur=lines[i]
                      if cur.strip()=='PY' and len(cur)-len(cur.lstrip())==base:
                          break
                      chunk.append(cur[base:])
                      i+=1
                  blocks.append('\n'.join(chunk))
              i+=1
          assert blocks
          for n,code in enumerate(blocks,1):
              ast.parse(code, filename=f'workflow52-heredoc-{n}')
          print({'yaml_parse':True,'embedded_python_blocks':len(blocks),
                 'targeted_preflight':True,'hardcoded_fresh_target_removed':True,
                 'model_requests':0})
          PY
      - name: Confirm this static workflow has no model credentials
        run: |
          python - <<'PY'
          import os
          assert not [k for k in os.environ if k.startswith('LLM_') or 'DEEPSEEK' in k]
          print('{"model_credentials_exposed":false,"model_requests":0}')
          PY
