name: HK US Europe free news and daily integration acceptance
# Goal G3 free gate: bounded judgment consumer and reviewed event identity; no model credentials.
on:
  workflow_dispatch:
  push:
    branches: [fix/daily-data-integrity]
    paths: [.github/workflows/07-hk-news-integration.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Shanghai
      ENV_FILE: /dev/null
      PYTHONPATH: .
      DATABASE_PATH: ./data/hk-news-acceptance.db
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt pytest pypdf
      - run: python -m pytest -q tests/test_hk_evidence_analysis.py tests/test_xiaomi_primary_evidence.py tests/test_xiaomi_fact_brief.py tests/test_hk_report_contract.py tests/test_xiaomi_acceptance_controls.py
      - name: Publish the no-model fact brief after independent price validation
        run: python scripts/run_xiaomi_fact_brief.py --refresh --with-primary-evidence --output-dir probe/fact-briefs
      - name: Make the fact brief readable in the run summary
        run: cat probe/fact-briefs/*/xiaomi-facts.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hk-news-integration
          path: probe/
          retention-days: 7
