name: DSA Run058J O rollout continuation
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths: [docs/runtime/RUN058J_SCOPE.json]
permissions: {contents: write}
concurrency:
  group: dsa-native-private-branch-writer
  cancel-in-progress: false
  queue: max
jobs:
  controller:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with: {ref: fix/native-private-execution-20260914, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install pytest
      - run: python -m pytest --noconftest -q tests/test_run058_o_rollout_controller.py
      - name: Build next child after terminal first batch
        run: |
          python scripts/build_run058_o_rollout_controller.py \
            --scope docs/runtime/RUN058_SCOPE.json \
            --plan docs/runtime/RUN057_O_NATIVE_PLAN.json \
            --ledger docs/runtime/RUN058_O_ROLLOUT_LEDGER.jsonl \
            --output /tmp/RUN058J_RESULT.json
          python - <<'PY'
          import json
          r=json.load(open('/tmp/RUN058J_RESULT.json'))
          assert r['state']=='READY_CHILD_ENVELOPE'
          c=r['selected_child']
          assert c['micro_batch_id']=='O57-MB-002'
          assert c['codes']==['00003','00004']
          assert r['ledger_summary']['terminal_batches']==1
          assert r['resource_accounting']['model_http_requests']==0
          print(json.dumps({'state':r['state'],'batch':c['micro_batch_id'],'codes':c['codes'],'model_requests':0}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RUN058J_O_CONTROLLER
          path: /tmp/RUN058J_RESULT.json
          retention-days: 90
      - name: Commit sanitized controller result
        run: |
          cp /tmp/RUN058J_RESULT.json docs/runtime/RUN058J_RESULT.json
          git add docs/runtime/RUN058J_RESULT.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Rupheal@users.noreply.github.com'
          git commit -m 'dsa: select second O rollout micro-batch'
          git fetch origin fix/native-private-execution-20260914
          git rebase origin/fix/native-private-execution-20260914
          git push origin HEAD:fix/native-private-execution-20260914
