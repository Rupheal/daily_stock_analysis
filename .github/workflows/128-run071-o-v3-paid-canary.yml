name: DSA Run071 O v3 current-session paid canary
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - 'docs/runtime/RUN071_O_CANARY_SCOPE.json'
      - '.github/workflows/128-run071-o-v3-paid-canary.yml'
permissions:
  contents: write
  actions: read
concurrency:
  group: dsa-native-private-branch-writer
  cancel-in-progress: false
  queue: max
jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/native-private-execution-20260914
          path: research
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install native runtime
        run: pip install -r research/requirements.txt pytest httpx requests deepseek-recipe==0.1.1

      - name: Verify scope, policy, and no-repeat ledger
        working-directory: research
        run: |
          python - <<'PY'
          import json
          s=json.load(open('docs/runtime/RUN071_O_CANARY_SCOPE.json'))
          p=json.load(open('docs/runtime/O_UNRESOLVED_EXCLUSION_POLICY.json'))
          l=json.load(open('docs/runtime/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json'))
          assert s['target_session']=='2026-09-18'
          assert s['codes']==['00010','00012','00013']
          assert s['maximum_requests']==3 and s['maximum_cost_cny']=='0.30'
          assert s['per_member_hard_cap_cny']=='0.10'
          assert s['automatic_retry'] is False and s['no_orders'] is True
          assert p['current_session']['operational_denominator']==657
          spent={x['code'] for x in l['confirmed_provider_sends']}
          assert not spent.intersection(s['codes']), (spent,s['codes'])
          assert '00008' in spent
          print('RUN071_SCOPE_NO_REPEAT_PASS')
          PY
          python -m pytest --noconftest -q             tests/test_o_strategy_core_acceptance.py             tests/test_hk_o_operational_preflight_v3.py             tests/test_o_operational_shard_v3.py

      - uses: actions/download-artifact@v4
        with:
          run-id: 35335286449
          github-token: ${{ github.token }}
          name: RUN060_CURRENT_OFFICIAL_CLOSE_EVIDENCE
          path: /tmp/run060

      - name: Bind exact Run060 O inputs by SHA256
        working-directory: research
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('docs/runtime/RUN071_O_CANARY_SCOPE.json'))
          targets={'universe':s['current_universe_sha256'],'history':s['history_cache_sha256']}
          found={}
          for p in Path('/tmp/run060').rglob('*'):
              if not p.is_file(): continue
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              for k,v in targets.items():
                  if h==v:
                      if k in found: raise SystemExit('DUPLICATE_HASH_MATCH:'+k)
                      found[k]=str(p.resolve())
          assert set(found)==set(targets), found
          Path('/tmp/run071-bind.json').write_text(json.dumps(found))
          print(json.dumps(found))
          PY

      - name: Freeze canary code rows from O657 operational universe
        working-directory: research
        run: |
          python - <<'PY'
          import json,sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from run_hk_o_operational_shard_v3 import select_operational_members
          b=json.load(open('/tmp/run071-bind.json'))
          u=json.load(open(b['universe']))
          p=json.load(open('docs/runtime/O_UNRESOLVED_EXCLUSION_POLICY.json'))
          s=json.load(open('docs/runtime/RUN071_O_CANARY_SCOPE.json'))
          rows=select_operational_members(u,p);by={x['code']:x for x in rows}
          selected=[by[x] for x in s['codes']]
          assert len(selected)==3
          Path('/tmp/run071-codes.json').write_text(json.dumps(selected,ensure_ascii=False))
          print(json.dumps(selected,ensure_ascii=False))
          PY

      - name: Execute O v3 canary with private evidence and no retries
        working-directory: research
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: |
          bind="$(cat /tmp/run071-bind.json)"
          history="$(python -c "import json;print(json.loads('''$bind''')['history'])")"
          universe="$(python -c "import json;print(json.loads('''$bind''')['universe'])")"
          python scripts/run_hk_o_operational_shard_v3.py             --checkout ../original             --cache "$history"             --universe "$universe"             --policy docs/runtime/O_UNRESOLVED_EXCLUSION_POLICY.json             --scope docs/runtime/RUN071_O_CANARY_SCOPE.json             --codes-file /tmp/run071-codes.json             --out /tmp/run071

      - name: Build sanitized canary acceptance and update current-session send ledger
        if: always()
        working-directory: research
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          s=json.load(open('docs/runtime/RUN071_O_CANARY_SCOPE.json'))
          p=Path('/tmp/run071/SHARD_RESULT.json')
          if not p.exists():
              out={'schema_version':1,'run_id':s['run_id'],'state':'NO_GO_CANARY',
                   'reason':'SHARD_RESULT_MISSING','codes':s['codes'],
                   'model_http_requests_confirmed':0,'real_orders':0,'full_rollout_authorized':False}
          else:
              d=json.load(open(p));rows=d.get('members') or []
              assert [x.get('code') for x in rows]==s['codes']
              assert len(rows)==3
              req=sum(int(x.get('model_http_requests_confirmed',0) or 0) for x in rows)
              possible=sum(int(x.get('model_http_requests_possible',0) or 0) for x in rows)
              cost=sum(Decimal(str(x.get('usage_peak_estimate_cny','0') or '0')) for x in rows)
              assert req<=3 and possible<=3 and cost<=Decimal('0.30')
              private_ok=all(
                (x.get('private_persistence') or {}).get('save_read_hash_restore')
                for x in rows if x.get('model_http_requests_confirmed')==1
              )
              core=sum(bool(x.get('ranking_eligible')) for x in rows)
              all_processed=d.get('shared_stop_reason') is None and d.get('attempted_members')==3
              sent=[x for x in rows if x.get('model_http_requests_confirmed')==1]
              pass_canary=all_processed and private_ok and req==3 and core>=2
              out={
                'schema_version':1,'run_id':s['run_id'],
                'state':'PASS_O_V3_CURRENT_SESSION_CANARY' if pass_canary else 'NO_GO_CANARY',
                'target_session':s['target_session'],'codes':s['codes'],
                'attempted_members':d.get('attempted_members'),'core_accepted':core,
                'narrative_quarantined':sum(x.get('narrative_release_status')=='QUARANTINED' for x in rows),
                'member_statuses':[{
                  'code':x.get('code'),'status':x.get('status'),'ranking_eligible':x.get('ranking_eligible'),
                  'strategy_core':x.get('strategy_core'),'strategy_core_sha256':x.get('strategy_core_sha256'),
                  'raw_result_sha256':x.get('raw_result_sha256'),
                  'provider_response_sha256':x.get('provider_response_sha256'),
                  'narrative_release_status':x.get('narrative_release_status'),
                  'semantic_guards':x.get('semantic_guards'),
                  'model_http_requests_confirmed':x.get('model_http_requests_confirmed'),
                  'usage_peak_estimate_cny':x.get('usage_peak_estimate_cny'),
                  'private_roundtrip':(x.get('private_persistence') or {}).get('save_read_hash_restore',False),
                  'failure_code':x.get('failure_code'),
                } for x in rows],
                'model_http_requests_confirmed':req,
                'model_http_requests_possible':possible,
                'usage_peak_estimate_cny':str(cost),
                'shared_stop_reason':d.get('shared_stop_reason'),
                'private_roundtrip_all_sent':private_ok,
                'full_rollout_authorized':pass_canary,
                'automatic_retry':False,'real_orders':0,'simulation_writes':0,'raw_content_public':False
              }
              if sent:
                  ledger=json.load(open('docs/runtime/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json'))
                  existing={x['model_call_key'] for x in ledger['confirmed_provider_sends']}
                  for x in sent:
                      key=f"{s['target_session']}:{x['code']}:{s['frozen_upstream']}"
                      if key in existing: raise SystemExit('DUPLICATE_MODEL_CALL_KEY:'+key)
                      ledger['confirmed_provider_sends'].append({
                        'code':x['code'],'model_call_key':key,
                        'source_branch':'fix/native-private-execution-20260914',
                        'source_receipt':'docs/runtime/RUN071_O_CANARY_RESULT.json',
                        'source_run_id':s['run_id'],'source_workflow_run':int(__import__('os').environ['GITHUB_RUN_ID']),
                        'provider_response_sha256':x.get('provider_response_sha256'),
                        'model_http_requests_confirmed':1,
                        'usage_peak_estimate_cny':x.get('usage_peak_estimate_cny'),
                        'strategy_core_sha256':x.get('strategy_core_sha256'),
                        'raw_result_sha256':x.get('raw_result_sha256'),
                        'repeat_permitted':False
                      });existing.add(key)
                  ledger['current_confirmed_send_count']=len(ledger['confirmed_provider_sends'])
                  Path('/tmp/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json').write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          Path('/tmp/RUN071_O_CANARY_RESULT.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RUN071_O_V3_CANARY_SANITIZED
          path: |
            /tmp/run071/SHARD_RESULT.json
            /tmp/RUN071_O_CANARY_RESULT.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit sanitized canary result and append-only send ledger
        if: always()
        working-directory: research
        run: |
          set -euo pipefail
          test -f /tmp/RUN071_O_CANARY_RESULT.json
          cp /tmp/RUN071_O_CANARY_RESULT.json docs/runtime/RUN071_O_CANARY_RESULT.json
          git add docs/runtime/RUN071_O_CANARY_RESULT.json
          if test -f /tmp/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json; then
            cp /tmp/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json docs/runtime/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json
            git add docs/runtime/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Rupheal@users.noreply.github.com'
          git commit -m 'dsa: record Run071 O v3 current-session canary'
          git fetch origin fix/native-private-execution-20260914
          git rebase origin/fix/native-private-execution-20260914
          git push origin HEAD:fix/native-private-execution-20260914

      - name: Gate full rollout
        run: |
          python - <<'PY'
          import json
          r=json.load(open('/tmp/RUN071_O_CANARY_RESULT.json'))
          assert r['state']=='PASS_O_V3_CURRENT_SESSION_CANARY', r
          assert r['full_rollout_authorized'] is True
          assert r['real_orders']==0
          print('RUN071_FULL_ROLLOUT_GATE_PASS')
          PY
