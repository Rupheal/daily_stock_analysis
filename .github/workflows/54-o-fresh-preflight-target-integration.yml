name: O fresh preflight target integration model-free
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - scripts/prepare_xiaomi_acceptance_targeted.py
      - tests/test_prepare_xiaomi_acceptance_targeted.py
      - .github/workflows/54-o-fresh-preflight-target-integration.yml
permissions:
  contents: read
jobs:
  target-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: .
      ENV_FILE: /dev/null
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deterministic/runtime dependencies
        run: pip install -r research/requirements.txt pytest
      - name: Unit-test target adapter and frozen target contract
        working-directory: research
        run: python -m pytest --noconftest -q tests/test_prepare_xiaomi_acceptance_targeted.py tests/test_o_target_session_contract.py
      - name: Execute fresh Xiaomi preflight through frozen target adapter
        working-directory: research
        run: |
          set +e
          python scripts/prepare_xiaomi_acceptance_targeted.py --allow-partial-news > /tmp/targeted-preflight.log 2>&1
          rc=$?
          set -e
          echo "$rc" > /tmp/targeted-preflight.rc
          python - <<'PY'
          import json
          from pathlib import Path
          rc=int(Path('/tmp/targeted-preflight.rc').read_text().strip())
          r=json.loads(Path('probe/target-session-receipt.json').read_text())
          assert r['rule_version']=='O_NATIVE_TARGET_SESSION_RULE_v1'
          assert r['target_session']
          assert r['model_http_requests']==0
          if rc == 0:
              p=json.loads(Path('probe/preflight.json').read_text())
              assert r['status']=='PREFLIGHT_COMPLETED_TARGET_MATCH'
              assert r['target_match'] is True
              assert p['target']==r['target_session']==r['preflight_target']
              downstream='PASS'
          else:
              assert r['status']=='PREFLIGHT_FAILED_AFTER_TARGET_RESOLUTION'
              assert r['preflight_target'] is None
              downstream='FAIL_AFTER_TARGET_RESOLUTION'
          print(json.dumps({'frozen_target_consumed':True,
                            'target_session':r['target_session'],
                            'rule_version':r['rule_version'],
                            'downstream_preflight':downstream,
                            'downstream_exit_code':rc,
                            'failure_type':r.get('failure_type'),
                            'failure_message':r.get('failure_message'),
                            'model_requests':0}))
          PY
      - name: Confirm model-free job environment
        run: |
          python - <<'PY'
          import os, json
          risky=[k for k in os.environ if k.startswith('LLM_') or 'DEEPSEEK' in k]
          assert risky == [], risky
          print(json.dumps({'model_credentials_exposed':False,'model_request_path_invoked':False}))
          PY
