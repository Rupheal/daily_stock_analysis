name: DSA Run064 MB004 current-session native paid child

on:
  push:
    branches: [research/run064-o-mb004-native-20260918]
    paths:
      - .github/workflows/114-run064-o-mb004-native.yml
      - docs/runtime/RUN064_SCOPE.json

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-run064-o-mb004-native
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v5
        with: {path: research, fetch-depth: 0}
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install dependencies and run safety tests
        run: |
          pip install -r research/requirements.txt pytest httpx requests deepseek-recipe==0.1.1
          cd research
          python -m py_compile scripts/run_hk_bounded_native_members.py scripts/prepare_run061_current_preflight.py
          python -m pytest --noconftest -q             tests/test_o_frozen_native_history_adapter.py             tests/test_o_native_input_contract.py             tests/test_bounded_native_members.py             tests/test_bounded_native_members_v2.py             tests/test_deepseek_flash_cap010_guard.py             tests/test_o_provider_completion.py             tests/test_private_multipart.py             tests/test_dsa_drive_recovery_regressions.py             tests/test_o_release_gate_contract.py
      - name: Verify immutable scope and parent preflight
        working-directory: research
        run: |
          python - <<'PY'
          import json
          s=json.load(open('docs/runtime/RUN064_SCOPE.json'))
          p=json.load(open('docs/runtime/RUN063_RESULT.json'))
          assert p['state']=='PASS_ALL_READY' and p['ready_for_paid_child']==['00008','00010']
          assert s['codes']==['00008','00010'] and s['micro_batch_id']=='O57-MB-004'
          assert s['target_session']=='2026-09-18'
          assert s['maximum_requests']==2 and s['maximum_cost_cny']=='0.20' and s['per_member_cap_cny']=='0.10'
          assert s['preflight_contract']=='POOL_CURRENT_SESSION_V3'
          assert s['frozen_native_history_adapter'] is True
          assert s['prior_model_http_requests_confirmed_for_this_batch']==0
          assert s['automatic_retry'] is False and s['no_orders'] is True and s['no_signal_publish'] is True
          print('RUN064_SCOPE_PASS')
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 35335286449
          github-token: ${{ github.token }}
          name: RUN060_CURRENT_OFFICIAL_CLOSE_EVIDENCE
          path: parent
      - name: Bind exact Run060 universe and history by hash
        run: |
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN064_SCOPE.json'))
          um=[];hm=[]
          for p in Path('parent').rglob('*'):
              if not p.is_file():continue
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              if h=='6415847af25e86f201bb69759f6ecef053cfc69079809200650dd8b74550daf8':um.append(p)
              if h==s['history_cache_sha256']:hm.append(p)
          assert len(um)==1 and len(hm)==1
          u=json.loads(um[0].read_text());m=json.loads(hm[0].read_text())
          assert len(u['members'])==660 and u['full_union_verified'] is True
          assert m['target_session']=='2026-09-18'
          for c in s['codes']:assert 'hk'+c in m['histories']
          shutil.copy2(um[0],'/tmp/run064-o-universe.json')
          shutil.copy2(hm[0],'/tmp/run064-o-history.json')
          print('RUN064_RUN060_BIND_PASS')
          PY
      - name: Execute bounded MB004 child with fresh preflight, Drive claims and private persistence
        working-directory: research
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: |
          python scripts/run_hk_bounded_native_members.py             --checkout ../original             --cache /tmp/run064-o-history.json             --scope docs/runtime/RUN064_SCOPE.json             --out /tmp/run064
      - name: Build sanitized reconciliation without advancing ledger
        if: always()
        working-directory: research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/run064/SANITIZED_RESULT.json')
          if not p.exists():
              rec={'schema_version':1,'run_id':'TRI-DSA-O-NATIVE-20260918-064','state':'STOP_BATCH',
                   'micro_batch_id':'O57-MB-004','codes':['00008','00010'],
                   'model_http_requests_confirmed':0,'model_http_requests_possible':0,
                   'qualified_signals':0,'orders':0,'simulation_ledger_writes':0,
                   'automatic_retry':False,'rollout_ledger_advanced':False}
          else:
              d=json.loads(p.read_text());m=d.get('members') or []
              assert [x.get('code') for x in m]==['00008','00010'][:len(m)]
              assert d.get('model_http_requests_confirmed',0)<=2 and d.get('model_http_requests_possible',0)<=2
              assert d.get('qualified_signals')==0 and d.get('formal_pool_top3_generated') is False
              assert d.get('simulation_ledger_writes')==0
              sent=[x for x in m if x.get('model_http_requests_confirmed')==1]
              priv=bool(sent) and all((x.get('private_persistence') or {}).get('save_read_hash_restore') for x in sent)
              rec={'schema_version':1,'run_id':'TRI-DSA-O-NATIVE-20260918-064',
                   'state':'PENDING_PRIVATE_SEMANTIC_REVIEW' if sent and priv else 'STOP_BATCH',
                   'micro_batch_id':'O57-MB-004','codes':['00008','00010'],
                   'attempted_members':len(m),
                   'member_statuses':[{k:x.get(k) for k in ('code','status','raw_gate','raw_blockers','model_http_requests_confirmed',
                     'model_http_requests_possible','usage_peak_estimate_cny','observed_balance_change_cny','preflight_sha256',
                     'frozen_native_history_adapter','failure_code')} for x in m],
                   'sent_codes':[x.get('code') for x in sent],
                   'unsent_codes':[x.get('code') for x in m if x.get('model_http_requests_confirmed')!=1],
                   'model_http_requests_confirmed':d.get('model_http_requests_confirmed',0),
                   'model_http_requests_possible':d.get('model_http_requests_possible',0),
                   'maximum_cost_cny':'0.20','actual_attributable_charge_cny':d.get('actual_attributable_charge_cny'),
                   'private_final_roundtrip_all_sent':priv,'qualified_signals':0,'orders':0,'simulation_ledger_writes':0,
                   'automatic_retry':False,'rollout_ledger_advanced':False,
                   'next':'Private semantic review every sent member. Never retry a sent member; only then close MB004 or run a never-sent member.' if sent else 'Diagnose before any provider send.'}
          Path('/tmp/RUN064_RECONCILIATION.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(rec,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RUN064_SANITIZED_MB004_CHILD
          path: |
            /tmp/run064/SANITIZED_RESULT.json
            /tmp/RUN064_RECONCILIATION.json
          if-no-files-found: warn
          retention-days: 90
      - name: Commit sanitized receipts only
        if: always()
        working-directory: research
        run: |
          cp /tmp/RUN064_RECONCILIATION.json docs/runtime/RUN064_RECONCILIATION.json
          git add docs/runtime/RUN064_RECONCILIATION.json
          if test -f /tmp/run064/SANITIZED_RESULT.json; then cp /tmp/run064/SANITIZED_RESULT.json docs/runtime/RUN064_SANITIZED_RESULT.json;git add docs/runtime/RUN064_SANITIZED_RESULT.json;fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then echo no-change; else git commit -m 'dsa: record Run064 MB004 paid child';git push;fi
