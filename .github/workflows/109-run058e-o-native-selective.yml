name: DSA Run058E selective O native paid child

on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - .github/workflows/109-run058e-o-native-selective.yml
      - docs/runtime/RUN058E_SCOPE.json
      - scripts/run_hk_bounded_native_members.py
      - tests/test_bounded_native_members_v2.py

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-run058e-o-native-selective
  cancel-in-progress: false

jobs:
  native-child:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'

    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/native-private-execution-20260914
          path: research
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}

      - name: Install deterministic and native dependencies
        run: pip install -r research/requirements.txt pytest httpx requests deepseek-recipe==0.1.1

      - name: Verify one-member immutable scope and free-preflight route
        working-directory: research
        run: |
          python -m pytest --noconftest -q tests/test_bounded_native_members.py tests/test_bounded_native_members_v2.py tests/test_hk_pool_rollout_preflight_v2.py tests/test_o_provider_completion.py tests/test_private_multipart.py tests/test_dsa_drive_recovery_regressions.py tests/test_o_native_input_contract.py tests/test_deepseek_flash_cap010_guard.py tests/test_o_release_gate_contract.py
          python - <<'PY'
          import json
          s=json.load(open('docs/runtime/RUN058E_SCOPE.json'));d=json.load(open('docs/runtime/RUN058D_RESULT.json'))
          assert s['codes']==['00001'] and s['maximum_requests']==1 and s['maximum_cost_cny']=='0.10'
          assert s['preflight_contract']=='POOL_TARGET_V2' and s['provider_send_authorized'] is True
          assert d['ready_for_new_paid_child']==['00001'] and '00002' in d['session_preflight_isolated']
          assert s['preflight_expected_sha256']==next(x['preflight_sha256'] for x in d['members'] if x['code']=='00001')
          assert s['automatic_retry'] is False and s['no_orders'] is True and s['no_signal_publish'] is True
          print('RUN058E_SCOPE_PASS')
          PY

      - uses: actions/download-artifact@v4
        with:
          run-id: 35224980615
          github-token: ${{ github.token }}
          name: RUN049_PUBLIC_CLOSE_AND_GATE_EVIDENCE
          path: parent

      - name: Bind exact Run049 O660 native history
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN058E_SCOPE.json'));matches=[]
          for p in Path('parent').rglob('market-history.json'):
              if hashlib.sha256(p.read_bytes()).hexdigest()==s['history_cache_sha256']: matches.append(p)
          assert len(matches)==1
          d=json.loads(matches[0].read_text());assert d['target_session']==s['target_session']
          assert 'hk00001' in (d.get('histories') or {})
          Path('/tmp/history-path').write_text(str(matches[0].resolve()))
          PY

      - name: Execute at most one provider request for 00001
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: |
          python research/scripts/run_hk_bounded_native_members.py --checkout original --cache "$(cat /tmp/history-path)" --scope research/docs/runtime/RUN058E_SCOPE.json --out /tmp/run058e

      - name: Build fail-closed reconciliation
        if: always()
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          p=Path('/tmp/run058e/SANITIZED_RESULT.json')
          if not p.exists():
              rec={'schema_version':1,'run_id':'TRI-DSA-O-NATIVE-20260918-058E','state':'STOP_TRANCHE','reason':'SANITIZED_RESULT_MISSING','codes':['00001'],'model_http_requests_confirmed':0,'model_http_requests_possible':0,'qualified_signals':0,'simulation_ledger_writes':0,'automatic_retry':False}
          else:
              d=json.loads(p.read_text());m=d.get('members') or []
              assert len(m)<=1 and [x.get('code') for x in m]==['00001'][:len(m)]
              assert d.get('model_http_requests_confirmed',0)<=1 and d.get('model_http_requests_possible',0)<=1
              assert Decimal(d['maximum_cost_cny'])==Decimal('0.10') and d.get('qualified_signals')==0 and d.get('simulation_ledger_writes')==0
              accepted={'PASS_NATIVE_AUTOMATED_PENDING_MANUAL_REVIEW','PASS_WITH_VERSIONED_RELEASE_ADAPTER_PENDING_MANUAL_REVIEW'}
              priv=len(m)==1 and bool((m[0].get('private_persistence') or {}).get('save_read_hash_restore'))
              ok=len(m)==1 and m[0].get('status') in accepted and priv
              rec={'schema_version':1,'run_id':'TRI-DSA-O-NATIVE-20260918-058E','state':'ACCEPTED_NATIVE_PENDING_MANUAL_REVIEW' if ok else 'STOP_TRANCHE','codes':['00001'],'member_statuses':[{k:m[0].get(k) for k in ('code','status','raw_gate','raw_blockers','model_http_requests_confirmed','model_http_requests_possible','usage_peak_estimate_cny','observed_balance_change_cny','preflight_sha256')} ] if m else [],'model_http_requests_confirmed':d.get('model_http_requests_confirmed',0),'model_http_requests_possible':d.get('model_http_requests_possible',0),'maximum_cost_cny':'0.10','actual_attributable_charge_cny':d.get('actual_attributable_charge_cny'),'private_final_roundtrip_all':priv,'qualified_signals':0,'simulation_ledger_writes':0,'formal_pool_top3_generated':False,'manual_review_required':True,'automatic_retry':False,'next':'Manual semantic review; do not advance rollout until reconciled.'}
          Path('/tmp/RUN058E_RECONCILIATION.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n');print(json.dumps(rec,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RUN058E_SANITIZED_CHILD
          path: |
            /tmp/run058e/SANITIZED_RESULT.json
            /tmp/RUN058E_RECONCILIATION.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit sanitized receipt only
        if: always()
        working-directory: research
        run: |
          set -euo pipefail
          cp /tmp/RUN058E_RECONCILIATION.json docs/runtime/RUN058E_RECONCILIATION.json
          if test -f /tmp/run058e/SANITIZED_RESULT.json; then cp /tmp/run058e/SANITIZED_RESULT.json docs/runtime/RUN058E_SANITIZED_RESULT.json; git add docs/runtime/RUN058E_SANITIZED_RESULT.json; fi
          git add docs/runtime/RUN058E_RECONCILIATION.json
          git config user.name 'github-actions[bot]'; git config user.email '41898282+Rupheal@users.noreply.github.com'
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'dsa: record Run058E selective O native child'; git push origin HEAD:fix/native-private-execution-20260914; fi
