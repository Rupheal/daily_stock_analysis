name: Run005 V4 ranking uncertainty
on:
  push:
    branches: [trident/run004-fullpool-pit]
    paths: [run005_v4_uncertainty_trigger.json]
permissions:
  contents: read
  actions: read
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify free one-shot trigger
        run: |
          python - <<'PY'
          import json,os
          if os.environ.get('GITHUB_RUN_ATTEMPT')!='1': raise SystemExit('rerun prohibited')
          x=json.load(open('run005_v4_uncertainty_trigger.json'))
          assert x['run_id']=='TRI-DSA-VAL-20260913-005-V4-UNCERTAINTY-R1'
          assert x['paid_resources'] is False
          assert x['source_outcome_run_id']==34788108594
          assert x['source_artifact_id']==10326983504
          assert x['source_artifact_digest']=='sha256:cd378ecf8bd8354e0832ad347888b229eefceba8582997c5900773009c07c103'
          assert x['bootstrap_seed']==20260914 and x['bootstrap_reps']==5000
          print('RUN005_V4_TRIGGER_OK')
          PY
      - name: Install deterministic test dependencies
        run: python -m pip install pytest anyio fastapi httpx starlette
      - name: Test uncertainty harness
        run: python -m pytest -q tests/test_run005_v4_ranking_uncertainty.py
      - name: Download frozen outcome artifact
        uses: actions/download-artifact@v4
        with:
          name: run005-v1-outcomes-20260907-r3
          path: input/outcome
          run-id: 34788108594
          github-token: ${{ github.token }}
      - name: Compute only predeclared ranking metrics uncertainty
        run: |
          python scripts/run005_v4_ranking_uncertainty.py \
            --input input/outcome/run005-anchor-outcomes.json \
            --output reports/run005-v4/ranking-uncertainty.json \
            --seed 20260914 --reps 5000
      - name: Verify denominator and no metric substitution
        run: |
          python - <<'PY'
          import json
          x=json.load(open('reports/run005-v4/ranking-uncertainty.json'))
          assert x['original_denominator']==54
          assert set(x['horizons'])=={'1','3','5'}
          for h,v in x['horizons'].items():
              assert v['point']['n']==54
              assert v['bootstrap']['reps']==5000
              assert len(v['bootstrap']['spearman_ci95'])==2
              assert len(v['bootstrap']['pairwise_accuracy_ci95'])==2
              assert len(v['bootstrap']['top_k_lift_pp_ci95'])==2
          print('RUN005_V4_UNCERTAINTY_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: run005-v4-ranking-uncertainty
          path: reports/run005-v4/
          if-no-files-found: error
          retention-days: 14
