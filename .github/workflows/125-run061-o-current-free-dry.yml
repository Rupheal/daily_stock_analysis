name: DSA Run061 current O free preflight and dry

on:
  push:
    branches: [research/run061-o-current-free-dry-20260918]
    paths:
      - docs/runtime/RUN061_SCOPE.json
      - .github/workflows/125-run061-o-current-free-dry.yml

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-run061-o-current-free-dry
  cancel-in-progress: false

jobs:
  free-dry:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'

    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}

      - name: Install deterministic dependencies
        run: pip install -r research/requirements.txt pytest requests deepseek-recipe==0.1.1

      - name: Verify zero-model scope
        working-directory: research
        run: |
          python - <<'PY'
          import json
          s=json.load(open('docs/runtime/RUN061_SCOPE.json'))
          p=json.load(open('docs/runtime/RUN061_O_NATIVE_PLAN.json'))
          assert s['target_session']=='2026-09-18'
          assert p['target_session']=='2026-09-18'
          assert p['denominator']['O_universe']==660
          assert p['denominator']['deterministic_ready']==608
          assert p['denominator']['retained_isolated']==52
          assert s['model_http_requests_authorized']==0
          assert s['provider_send_authorized'] is False
          assert s['drive_writes_authorized']==0
          print('RUN061_SCOPE_PASS')
          PY

      - uses: actions/download-artifact@v4
        with:
          run-id: 35335286449
          github-token: ${{ github.token }}
          name: RUN060_CURRENT_OFFICIAL_CLOSE_EVIDENCE
          path: parent

      - name: Locate exact current O universe and market history
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN061_SCOPE.json'))
          us=[p for p in Path('parent').rglob('O_UNIVERSE.json') if hashlib.sha256(p.read_bytes()).hexdigest()==s['current_input']['O_universe_sha256']]
          hs=[p for p in Path('parent').rglob('market-history.json') if hashlib.sha256(p.read_bytes()).hexdigest()==s['current_input']['O_history_sha256']]
          assert len(us)==1 and len(hs)==1
          u=json.loads(us[0].read_text()); h=json.loads(hs[0].read_text())
          assert u['member_count']==660 and u['effective_session']=='2026-09-18'
          assert h['target_session']=='2026-09-18'
          Path('/tmp/o-universe').write_text(str(us[0].resolve()))
          Path('/tmp/o-history').write_text(str(hs[0].resolve()))
          print('RUN061_CURRENT_INPUT_BIND_PASS')
          PY

      - name: Run fresh v2 preflight and adapted dry for 00005 and 00006
        working-directory: research
        run: |
          mkdir -p /tmp/run061 /tmp/config
          python - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/config/native-model-config.json').write_text(json.dumps({
            'model_list':[{'model_name':'openai/deepseek-flash','litellm_params':{
              'model':'openai/deepseek-flash','api_base':'https://api.deepseek.com',
              'api_key':'os.environ/LLM_DEEPSEEK_API_KEY',
              'extra_body':{'thinking':{'type':'disabled'}}
            }}]
          }))
          PY
          for code in 00005 00006; do
            mkdir -p "/tmp/run061/$code"
            set +e
            python scripts/prepare_hk_pool_rollout_preflight_v2.py               --code "$code" --target 2026-09-18               --universe "$(cat /tmp/o-universe)"               --cache "$(cat /tmp/o-history)"               --plan docs/runtime/RUN061_O_NATIVE_PLAN.json               --out "/tmp/run061/$code/preflight"
            pre_rc=$?
            set -e
            echo "$pre_rc" > "/tmp/run061/$code/preflight.rc"
            if test "$pre_rc" -eq 0; then
              set +e
              DSA_BUDGET_PROBE_ONLY=1               DSA_DEEPSEEK_V41_TOKENIZER="${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json"               DSA_INPUT_TOKEN_MARGIN=2048 DSA_EXPECT_THINKING=disabled               LITELLM_CONFIG=/tmp/config/native-model-config.json               LLM_CHANNELS=deepseek LLM_DEEPSEEK_PROTOCOL=openai               LLM_DEEPSEEK_BASE_URL=https://api.deepseek.com               LLM_DEEPSEEK_MODELS=deepseek-flash LITELLM_MODEL=openai/deepseek-flash               LITELLM_FALLBACK_MODELS='' LLM_DEEPSEEK_API_KEY=dry-envelope-no-network               python scripts/run_hk_original_model_probe_run030.py                 --symbol "HK$code" --checkout ../original                 --expected-commit 089d9d26d68f8b839ea5a74a3784e4402925f8b7                 --preflight "/tmp/run061/$code/preflight/preflight.json"                 --output "/tmp/run061/$code/dry"                 --limit-cny 0.10 --carry-upper-cny 0                 --target-boundary-adapter --frozen-native-history-adapter                 --news-handoff-v1 --news-coverage-limitation-v1
              echo "$?" > "/tmp/run061/$code/dry.rc"
              set -e
            fi
          done

      - name: Build sanitized selector result
        working-directory: research
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rows=[]
          for code in ('00005','00006'):
            root=Path('/tmp/run061')/code
            pre_rc=int((root/'preflight.rc').read_text())
            row={'code':code,'preflight_returncode':pre_rc,'status':'FAIL_FREE_PREFLIGHT'}
            if pre_rc==0:
              p=json.load(open(root/'preflight/preflight.json'))
              b=json.load(open(root/'dry/budget.json')) if (root/'dry/budget.json').exists() else {}
              s=json.load(open(root/'dry/probe-summary.json')) if (root/'dry/probe-summary.json').exists() else {}
              req=b.get('requests') or []
              row.update({
                'preflight_sha256':hashlib.sha256((root/'preflight/preflight.json').read_bytes()).hexdigest(),
                'target_volume_status':((p.get('price_reconciliation') or {}).get('volume') or {}).get('latest_status'),
                'historical_mismatch_sessions':((p.get('price_reconciliation') or {}).get('historical_cross_provider_diagnostic') or {}).get('ohlc_mismatch_sessions'),
                'request_count':len(req),
                'dry_request_status':req[-1].get('status') if req else None,
                'pre_send_peak_upper_cny':req[-1].get('pre_send_peak_upper_cny') if req else None,
                'input_validated':s.get('input_validated'),
                'frozen_history_adapter_count':(s.get('frozen_native_history_adapter_receipt') or {}).get('count'),
                'coverage_limitation_applied':(s.get('news_coverage_limitation_receipt') or {}).get('applied'),
                'news_prompt_consumed':s.get('news_prompt_consumed')
              })
              if len(req)==1 and req[0].get('status')=='dry_envelope_validated_not_sent' and s.get('input_validated') is True and (s.get('frozen_native_history_adapter_receipt') or {}).get('count')==1 and (s.get('news_coverage_limitation_receipt') or {}).get('applied') is True:
                row['status']='PASS_CURRENT_FROZEN_DRY'
              else:
                row['status']='FAIL_DRY'
            else:
              fp=root/'preflight/FREE_PREFLIGHT_STATUS.json'
              if fp.exists(): row['reason']=json.load(open(fp)).get('reason')
            rows.append(row)
          ready=[r['code'] for r in rows if r['status']=='PASS_CURRENT_FROZEN_DRY']
          selected=ready[0] if ready else None
          out={'schema_version':1,'run_id':'TRI-DSA-O-FREE-DRY-20260918-061',
               'state':'PASS_ONE_SENTINEL_READY' if selected else 'STOP_NO_SENTINEL_READY',
               'target_session':'2026-09-18','O_denominator':660,'historical_isolates_retained':52,
               'members':rows,'ready_for_paid_sentinel':ready,'selected_sentinel':selected,
               'model_http_requests':0,'provider_credentials_used':False,'drive_writes':0,
               'DeepSeek_API_cost_cny':0,'paid_data_calls':0,'real_orders':0,'simulation_writes':0,
               'automatic_retry':False}
          Path('/tmp/RUN061_RESULT.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: RUN061_CURRENT_FREE_DRY
          path: /tmp/RUN061_RESULT.json
          retention-days: 90

      - name: Commit sanitized result
        working-directory: research
        run: |
          cp /tmp/RUN061_RESULT.json docs/runtime/RUN061_RESULT.json
          git add docs/runtime/RUN061_RESULT.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then echo no-change; else
            git commit -m 'dsa: record Run061 current free dry'
            git push
          fi
