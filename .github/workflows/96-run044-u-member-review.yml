name: DSA Run044 independent U member reviews
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths: [docs/runtime/RUN044_SCOPE.json]
permissions: {contents: read}
concurrency: {group: dsa-run044-u-private, cancel-in-progress: false}
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research/scripts
    steps:
      - uses: actions/checkout@v5
        with: {path: research, persist-credentials: false}
      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install httpx pytest deepseek-recipe==0.1.1
      - working-directory: research
        run: python -m pytest --noconftest -q tests/test_u_member_reports.py tests/test_private_multipart.py tests/test_o_provider_completion.py
      - name: Private U qualitative review with two unique claims
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: python research/scripts/run_u_bounded_member_review.py --packet research/docs/runtime/RUN041_U45_MEMBER_REPORTS.json --scope research/docs/runtime/RUN044_SCOPE.json --out /tmp/run044
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RUN044_SANITIZED_U_RECEIPT
          path: /tmp/run044/SANITIZED_U_RESULT.json
          if-no-files-found: warn
          retention-days: 90
