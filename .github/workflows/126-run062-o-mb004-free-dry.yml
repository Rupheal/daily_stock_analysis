name: DSA Run062 MB004 current free-dry

on:
  push:
    branches: [research/run062-o-mb004-free-dry-20260918]
    paths:
      - .github/workflows/126-run062-o-mb004-free-dry.yml
      - docs/runtime/RUN062_SCOPE.json

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-run062-o-mb004-free-dry
  cancel-in-progress: false

jobs:
  free-dry:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'

    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}

      - name: Install deterministic dependencies
        run: pip install -r research/requirements.txt pytest requests deepseek-recipe==0.1.1

      - name: Verify zero-model scope
        working-directory: research
        run: |
          python - <<'PY'
          import json
          s=json.load(open('docs/runtime/RUN062_SCOPE.json'))
          u=json.load(open('docs/runtime/RUN058U_RESULT.json'))
          assert s['target_session']=='2026-09-18'
          assert s['codes']==['00008','00010']
          assert s['model_http_requests_authorized']==0 and s['provider_send_authorized'] is False
          assert u['state']=='STOP_MB003_FREE_GATE'
          assert u['ready_for_paid_sentinel']==[]
          assert u['session_isolated']==['00005','00006']
          print('RUN062_SCOPE_PASS')
          PY

      - uses: actions/download-artifact@v4
        with:
          run-id: 35336247845
          github-token: ${{ github.token }}
          name: RUN058U_20260918_SESSION_ROLLOVER
          path: parent

      - name: Bind current official pool, history, and session plan
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          u=[p for p in Path('parent').rglob('O_UNIVERSE.json')]
          h=[p for p in Path('parent').rglob('market-history.json')]
          p=[p for p in Path('parent').rglob('RUN058U_SESSION_PLAN.json')]
          assert len(u)==len(h)==len(p)==1
          ud=json.loads(u[0].read_text()); hd=json.loads(h[0].read_text()); pd=json.loads(p[0].read_text())
          assert ud['member_count']==660 and ud['effective_session']=='2026-09-18'
          assert hd['target_session']=='2026-09-18'
          assert pd['target_session']=='2026-09-18' and pd['state']=='PASS_ZERO_MODEL_O_NATIVE_ROLLOUT_PLAN'
          assert '00008' in pd['rollout']['ready_codes'] and '00010' in pd['rollout']['ready_codes']
          Path('/tmp/o-universe').write_text(str(u[0].resolve()))
          Path('/tmp/o-history').write_text(str(h[0].resolve()))
          Path('/tmp/o-plan').write_text(str(p[0].resolve()))
          print('RUN062_PARENT_BIND_PASS')
          PY

      - name: Run fresh free v2 preflight and adapted dry for MB004
        working-directory: research
        env:
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: |
          mkdir -p /tmp/run062 /tmp/config
          python - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/config/native-model-config.json').write_text(json.dumps({
            'model_list':[{'model_name':'openai/deepseek-flash','litellm_params':{
              'model':'openai/deepseek-flash','api_base':'https://api.deepseek.com',
              'api_key':'os.environ/LLM_DEEPSEEK_API_KEY',
              'extra_body':{'thinking':{'type':'disabled'}}
            }}]
          }))
          PY
          for code in 00008 00010; do
            mkdir -p "/tmp/run062/$code"
            set +e
            python scripts/prepare_hk_pool_rollout_preflight_v2.py               --code "$code" --target 2026-09-18               --universe "$(cat /tmp/o-universe)"               --cache "$(cat /tmp/o-history)"               --plan "$(cat /tmp/o-plan)"               --out "/tmp/run062/$code/preflight"
            echo "$?" > "/tmp/run062/$code/preflight.rc"
            set -e
            if test "$(cat /tmp/run062/$code/preflight.rc)" = "0"; then
              set +e
              DSA_BUDGET_PROBE_ONLY=1               LLM_DEEPSEEK_API_KEY=dry-envelope-no-network               LLM_CHANNELS=deepseek               LLM_DEEPSEEK_PROTOCOL=openai               LLM_DEEPSEEK_BASE_URL=https://api.deepseek.com               LLM_DEEPSEEK_MODELS=deepseek-flash               LITELLM_MODEL=openai/deepseek-flash               LITELLM_FALLBACK_MODELS=''               DSA_INPUT_TOKEN_MARGIN=2048 DSA_EXPECT_THINKING=disabled               DSA_DEEPSEEK_V41_TOKENIZER="${DSA_DEEPSEEK_V41_TOKENIZER}"               python scripts/run_hk_original_model_probe_run030.py                 --symbol "HK$code"                 --checkout ../original                 --expected-commit 089d9d26d68f8b839ea5a74a3784e4402925f8b7                 --preflight "/tmp/run062/$code/preflight/preflight.json"                 --output "/tmp/run062/$code/dry"                 --limit-cny 0.10 --carry-upper-cny 0                 --target-boundary-adapter --news-handoff-v1                 --frozen-native-history-adapter --news-coverage-limitation-v1
              echo "$?" > "/tmp/run062/$code/dry.rc"
              set -e
            fi
          done

      - name: Build sanitized selector
        working-directory: research
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          rows=[]
          for code in ('00008','00010'):
            root=Path('/tmp/run062')/code
            pre_rc=int((root/'preflight.rc').read_text())
            row={'code':code,'preflight_returncode':pre_rc,'status':'FAIL_FREE_PREFLIGHT'}
            if pre_rc==0:
              p=json.load(open(root/'preflight/preflight.json'))
              b=json.load(open(root/'dry/budget.json')) if (root/'dry/budget.json').exists() else {}
              s=json.load(open(root/'dry/probe-summary.json')) if (root/'dry/probe-summary.json').exists() else {}
              q=b.get('requests') or []
              row.update({
                'preflight_sha256':hashlib.sha256((root/'preflight/preflight.json').read_bytes()).hexdigest(),
                'target_volume_status':((p.get('price_reconciliation') or {}).get('volume') or {}).get('latest_status'),
                'historical_mismatch_sessions':((p.get('price_reconciliation') or {}).get('historical_cross_provider_diagnostic') or {}).get('ohlc_mismatch_sessions'),
                'request_count':len(q),
                'dry_request_status':q[-1].get('status') if q else None,
                'pre_send_peak_upper_cny':q[-1].get('pre_send_peak_upper_cny') if q else None,
                'input_validated':s.get('input_validated'),
                'frozen_history_adapter_count':(s.get('frozen_native_history_adapter_receipt') or {}).get('count'),
                'coverage_limitation_applied':(s.get('news_coverage_limitation_receipt') or {}).get('applied'),
                'news_prompt_consumed':s.get('news_prompt_consumed')
              })
              if len(q)==1 and q[0].get('status')=='dry_envelope_validated_not_sent' and s.get('input_validated') is True and (s.get('frozen_native_history_adapter_receipt') or {}).get('count')==1 and (s.get('news_coverage_limitation_receipt') or {}).get('applied') is True:
                row['status']='PASS_CURRENT_FROZEN_DRY'
              else:
                row['status']='FAIL_DRY'
            else:
              f=root/'preflight/FREE_PREFLIGHT_STATUS.json'
              if f.exists(): row['reason']=json.load(open(f)).get('reason')
            rows.append(row)
          ready=[x['code'] for x in rows if x['status']=='PASS_CURRENT_FROZEN_DRY']
          out={'schema_version':1,'run_id':'TRI-DSA-O-FREE-DRY-20260918-062',
               'state':'PASS_SENTINEL_READY' if ready else 'STOP_MB004_FREE_GATE',
               'target_session':'2026-09-18','micro_batch_id':'O57-MB-004',
               'members':rows,'ready_for_paid_sentinel':ready,
               'selected_sentinel':ready[0] if ready else None,
               'model_http_requests':0,'provider_credentials_used':False,'drive_writes':0,
               'DeepSeek_API_cost_cny':0,'paid_data_calls':0,'real_orders':0,'simulation_writes':0,
               'automatic_retry':False}
          Path('/tmp/RUN062_RESULT.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: RUN062_MB004_FREE_DRY
          path: /tmp/RUN062_RESULT.json
          retention-days: 90

      - name: Commit sanitized Run062 result
        working-directory: research
        run: |
          cp /tmp/RUN062_RESULT.json docs/runtime/RUN062_RESULT.json
          git add docs/runtime/RUN062_RESULT.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then echo no-change; else
            git commit -m 'dsa: record Run062 MB004 free dry'
            git push
          fi
