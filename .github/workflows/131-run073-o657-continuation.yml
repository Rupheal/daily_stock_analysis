name: DSA Run073 retired superseded by Run075
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - '.github/workflows/131-run073-o657-continuation.yml'

permissions:
  contents: read

concurrency:
  group: dsa-run073-o657-continuation
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Retirement guard
        run: |
          echo "RUN073_RETIRED=1"
          echo "SUPERSEDED_BY=RUN075"
          echo "MODEL_HTTP_REQUESTS=0"
          echo "REAL_ORDERS=0"
