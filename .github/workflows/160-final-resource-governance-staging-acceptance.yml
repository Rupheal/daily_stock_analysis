name: Final resource-governance staging acceptance
on:
  push:
    branches:
      - audit/resource-governance-final-staging-20260927
permissions:
  contents: read
concurrency:
  group: final-resource-governance-staging-acceptance
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -q pytest httpx
      - name: Foundation A unchanged countertests
        run: PYTHONPATH=. pytest --noconftest -q tests/test_independent_pr40_snapshot.py tests/test_independent_pr40_multiprocess_cas.py
      - name: DSA B unchanged countertests
        run: PYTHONPATH=. pytest --noconftest -q tests/test_independent_pr7_foundation_contract.py
      - name: Foundation-DSA canonical contract
        run: PYTHONPATH=. pytest --noconftest -q tests/test_independent_ab_contract.py
      - name: DSA adapter regressions
        run: PYTHONPATH=.:scripts pytest --noconftest -q tests/test_dsa_resource_adapter.py tests/test_dsa_drive_store.py tests/test_dsa_simulation_journal_drive.py
      - name: Foundation-NeoTutor canonical contract
        run: PYTHONPATH=. pytest --noconftest -q tests/test_independent_ac_contract.py
      - name: NeoTutor local safety suite
        run: |
          cd audit_fixtures/neotutor_c
          python -m unittest -v test_resource_adapter.py
