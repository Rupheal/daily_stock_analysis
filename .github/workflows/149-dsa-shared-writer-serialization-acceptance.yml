name: DSA shared branch writer serialization acceptance
on:
  push:
    branches: [fix/dsa-shared-writer-serialization-20260927]
    paths:
      - '.github/workflows/**'
      - 'tests/test_shared_branch_writer_concurrency_v1.py'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsa-shared-writer-serialization-acceptance
  cancel-in-progress: false
  queue: max

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install -q pytest
      - run: python -m pytest --noconftest -q tests/test_shared_branch_writer_concurrency_v1.py
