name: DSA Run075 recover proven-unsent O657 members
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - 'docs/runtime/RUN073_O657_FORMAL_RESULT.json'
permissions:
  contents: write
  actions: read
concurrency:
  group: dsa-run075-o657-proven-unsent-recovery
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      planned_calls: ${{ steps.plan.outputs.planned_calls }}
      deferred_count: ${{ steps.plan.outputs.deferred_count }}
    env:
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/native-private-execution-20260914
          path: research
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pytest httpx requests
      - name: Verify repaired runner and reconciliation semantics
        working-directory: research
        run: |
          python -m pytest --noconftest -q \
            tests/test_o_operational_shard_v3.py \
            tests/test_aggregate_o_formal_ranking_v3.py \
            tests/test_plan_o657_continuation_v3.py \
            tests/test_deepseek_flash_cap010_guard.py
          python - <<'PY'
          import json
          p=json.load(open('docs/runtime/RUN075_PROVEN_UNSENT_RECOVERY_POLICY.json'))
          r=json.load(open('docs/runtime/RUN073_O657_FORMAL_RESULT.json'))
          assert p['target_session']==r['target_session']=='2026-09-18'
          assert p['authorized_per_member_ceiling_cny']=='2.00'
          assert p['member_local_exclusions_retried'] is False
          print('RUN075_PARENT_PASS',r['state'],r['missing_count'])
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 35335286449
          github-token: ${{ github.token }}
          name: RUN060_CURRENT_OFFICIAL_CLOSE_EVIDENCE
          path: /tmp/run060
      - name: Bind exact O inputs
        working-directory: research
        run: |
          python - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          p=json.load(open('docs/runtime/RUN075_PROVEN_UNSENT_RECOVERY_POLICY.json'))
          targets={'universe':p['current_universe_sha256'],'history':p['history_cache_sha256']}
          found={}
          for f in Path('/tmp/run060').rglob('*'):
              if not f.is_file(): continue
              h=hashlib.sha256(f.read_bytes()).hexdigest()
              for k,v in targets.items():
                  if h==v:
                      if k in found: raise SystemExit('DUPLICATE_HASH_MATCH:'+k)
                      found[k]=f
          assert set(found)==set(targets),found
          root=Path('/tmp/run075-plan/input');root.mkdir(parents=True)
          shutil.copy2(found['universe'],root/'O_UNIVERSE.json')
          shutil.copy2(found['history'],root/'O_HISTORY.json')
          print('RUN075_INPUT_BIND_PASS')
          PY
      - name: Release only proven-unsent NameError ledger locks
        working-directory: research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.load(open('docs/runtime/RUN073_O657_FORMAL_RESULT.json'))
          ledger=json.load(open('docs/runtime/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json'))
          proven={x['code'] for x in result.get('shared_unprocessed') or [] if x.get('status')=='PROVEN_UNSENT_RUNNER_BUG' and x.get('failure_code')=='NameError'}
          kept=[];released=[]
          for x in ledger.get('no_repeat_uncertain_claims') or []:
              code=str(x.get('code') or '')
              releasable=(code in proven and x.get('status')=='EXCLUDED_AFTER_CLAIM_NO_RETRY'
                          and x.get('failure_code')=='NameError'
                          and int(x.get('model_http_requests_confirmed',0) or 0)==0
                          and int(x.get('model_http_requests_possible',0) or 0)>=1)
              if releasable: released.append(code)
              else: kept.append(x)
          ledger['no_repeat_uncertain_claims']=kept
          ledger['current_uncertain_no_repeat_count']=len(kept)
          ledger.setdefault('released_proven_unsent_claims',[]).append({
            'source_result':'docs/runtime/RUN073_O657_FORMAL_RESULT.json',
            'reason':'RUN073_COMMON_NAMEERROR_BEFORE_PROVIDER_SUBPROCESS',
            'codes':sorted(released)
          })
          Path('/tmp/run075-plan/CLEAN_LEDGER.json').write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          Path('/tmp/run075-plan/RELEASE.json').write_text(json.dumps({
            'proven_unsent_count':len(proven),'released_lock_count':len(released),
            'proven_unsent_codes':sorted(proven),'released_codes':sorted(released)
          },ensure_ascii=False,indent=2)+'\n')
          if proven and set(released)!=proven:
              raise SystemExit('PROVEN_UNSENT_LEDGER_RELEASE_INCOMPLETE')
          print('RUN075_RELEASE_PASS',len(released))
          PY
      - name: Plan all retryable missing members
        id: plan
        working-directory: research
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          import json,os,httpx
          from decimal import Decimal,ROUND_FLOOR
          from pathlib import Path
          p=json.load(open('docs/runtime/RUN075_PROVEN_UNSENT_RECOVERY_POLICY.json'))
          with httpx.Client(timeout=20) as c:
              r=c.get('https://api.deepseek.com/user/balance',headers={'Authorization':'Bearer '+os.environ['DEEPSEEK_API_KEY']})
              r.raise_for_status();d=r.json()
          rows=[x for x in d.get('balance_infos',[]) if x.get('currency')=='CNY']
          if not d.get('is_available') or len(rows)!=1: raise SystemExit('AVAILABLE_CNY_BALANCE_UNVERIFIED')
          bal=Decimal(rows[0]['total_balance']);cap=Decimal(p['default_per_member_cap_cny'])
          affordable=int((max(Decimal('0'),bal)/cap).to_integral_value(rounding=ROUND_FLOOR))
          Path('/tmp/run075-plan/affordable-count').write_text(str(affordable))
          print('RUN075_BALANCE_GATE_PASS','positive_capacity='+str(affordable>0))
          PY
          python scripts/plan_o657_continuation_v3.py \
            --universe /tmp/run075-plan/input/O_UNIVERSE.json \
            --policy docs/runtime/O_UNRESOLVED_EXCLUSION_POLICY.json \
            --ledger /tmp/run075-plan/CLEAN_LEDGER.json \
            --previous docs/runtime/RUN073_O657_FORMAL_RESULT.json \
            --affordable-calls "$(cat /tmp/run075-plan/affordable-count)" \
            --max-shards 16 \
            --out /tmp/run075-plan/PLAN.json
          python - <<'PY'
          import json,os
          from decimal import Decimal
          from pathlib import Path
          p=json.load(open('docs/runtime/RUN075_PROVEN_UNSENT_RECOVERY_POLICY.json'))
          plan=json.load(open('/tmp/run075-plan/PLAN.json'))
          scopes=Path('/tmp/run075-plan/scopes');codes=Path('/tmp/run075-plan/codes');scopes.mkdir();codes.mkdir()
          ceiling=Decimal(p['authorized_per_member_ceiling_cny'])
          for sh in plan['shards']:
              sid=sh['shard_id'];(codes/f'shard-{sid}.json').write_text(json.dumps(sh['codes'],ensure_ascii=False))
              scope={
                'schema_version':1,'run_id':'TRI-DSA-O-RECOVER-20260918-075-S'+sid,'shard_id':sid,
                'target_session':'2026-09-18','decision_session':'2026-09-18',
                'frozen_upstream':p['frozen_upstream'],'native_model_configuration':'O_DEEPSEEK_FLASH_NONTHINKING_v1',
                'history_cache_sha256':p['history_cache_sha256'],'artifact_prefix':'ART-DSA-RUN075-O-RECOVER-S'+sid,
                'maximum_requests':sh['maximum_requests'],'maximum_cost_cny':sh['maximum_cost_cny'],
                'per_member_hard_cap_cny':p['default_per_member_cap_cny'],
                'per_member_authorized_ceiling_cny':p['authorized_per_member_ceiling_cny'],
                'maximum_authorized_cost_cny':str(ceiling*sh['maximum_requests']),
                'max_consecutive_provider_failures':2,'max_consecutive_infra_failures':2,
                'automatic_retry':False,'no_orders':True,'no_signal_publish':True,
                'simulation_writes':0,'raw_content_public':False
              }
              (scopes/f'scope-{sid}.json').write_text(json.dumps(scope,ensure_ascii=False,indent=2)+'\n')
          matrix={'include':[{'shard':x['shard_id']} for x in plan['shards']]}
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('matrix='+json.dumps(matrix,separators=(',',':'))+'\n')
              f.write('planned_calls='+str(plan['planned_calls'])+'\n')
              f.write('deferred_count='+str(plan['deferred_count'])+'\n')
          print(json.dumps({'prior_missing':plan['prior_missing_count'],'blocked_no_repeat':plan['blocked_no_repeat_missing_count'],
                            'retryable':plan['retryable_missing_before_wave'],'planned':plan['planned_calls'],
                            'deferred':plan['deferred_count'],'shards':plan['shard_count']}))
          if plan['planned_calls']==0 and plan['prior_missing_count']>0:
              raise SystemExit('NO_RECOVERY_CAPACITY_FOR_MISSING_MEMBERS')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RUN075_O657_RECOVERY_PLAN
          path: /tmp/run075-plan/
          retention-days: 90

  rollout:
    needs: plan
    if: needs.plan.outputs.planned_calls != '0'
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v5
        with: {ref: fix/native-private-execution-20260914, path: research, fetch-depth: 0}
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install -r research/requirements.txt httpx requests deepseek-recipe==0.1.1
      - uses: actions/download-artifact@v4
        with: {name: RUN075_O657_RECOVERY_PLAN, path: /tmp/plan}
      - name: Execute recovery shard ${{ matrix.shard }}
        id: run
        continue-on-error: true
        working-directory: research
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: |
          python scripts/run_hk_o_operational_shard_v3.py \
            --checkout ../original --cache /tmp/plan/input/O_HISTORY.json --universe /tmp/plan/input/O_UNIVERSE.json \
            --policy docs/runtime/O_UNRESOLVED_EXCLUSION_POLICY.json \
            --scope "/tmp/plan/scopes/scope-${{ matrix.shard }}.json" \
            --codes-file "/tmp/plan/codes/shard-${{ matrix.shard }}.json" \
            --out "/tmp/run075-${{ matrix.shard }}"
      - name: Sanitize recovery shard
        if: always()
        env: {RUNNER_OUTCOME: ${{ steps.run.outcome }}, SHARD_ID: ${{ matrix.shard }}}
        run: |
          mkdir -p /tmp/public
          python - <<'PY'
          import json,os
          from pathlib import Path
          sid=os.environ['SHARD_ID'];src=Path('/tmp/run075-'+sid+'/SHARD_RESULT.json')
          if src.exists(): d=json.load(open(src))
          else:
              planned=json.load(open('/tmp/plan/codes/shard-'+sid+'.json'))
              d={'schema_version':1,'run_id':'TRI-DSA-O-RECOVER-20260918-075-S'+sid,'shard_id':sid,
                 'members':[],'planned_codes':[x['code'] for x in planned],'attempted_members':0,
                 'core_accepted':0,'model_http_requests_confirmed':0,'usage_peak_estimate_cny':'0',
                 'shared_stop_reason':'SHARD_RUNNER_NO_RESULT','automatic_retry':False,
                 'real_orders':0,'simulation_writes':0,'raw_content_public':False}
          d['runner_step_outcome']=os.environ['RUNNER_OUTCOME']
          Path('/tmp/public/SHARD_RESULT_'+sid+'.json').write_text(json.dumps(d,ensure_ascii=False,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RUN075_O657_RECOVERY_SHARD_${{ matrix.shard }}
          path: /tmp/public/SHARD_RESULT_${{ matrix.shard }}.json
          retention-days: 90

  aggregate:
    needs: [plan, rollout]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.planned_calls != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
    steps:
      - uses: actions/checkout@v5
        with: {ref: fix/native-private-execution-20260914, path: research, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install pytest
      - uses: actions/download-artifact@v4
        with: {name: RUN075_O657_RECOVERY_PLAN, path: /tmp/plan}
      - uses: actions/download-artifact@v4
        with:
          pattern: RUN075_O657_RECOVERY_SHARD_*
          path: /tmp/shards
          merge-multiple: true
      - name: Reconcile recovered members and freeze ranking
        working-directory: research
        run: |
          python -m pytest --noconftest -q tests/test_aggregate_o_formal_ranking_v3.py
          python - <<'PY'
          import json,os,sys
          from decimal import Decimal
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from aggregate_o_formal_ranking_v3 import aggregate
          universe=json.load(open('/tmp/plan/input/O_UNIVERSE.json'))
          policy=json.load(open('docs/runtime/O_UNRESOLVED_EXCLUSION_POLICY.json'))
          prior=json.load(open('docs/runtime/RUN073_O657_FORMAL_RESULT.json'))
          sources=[('RUN073_PRIOR',prior)]
          shard_paths=sorted(Path('/tmp/shards').glob('SHARD_RESULT_*.json'))
          for p in shard_paths: sources.append((p.name,json.load(open(p))))
          rank=aggregate(universe,policy,sources)
          ledger=json.load(open('/tmp/plan/CLEAN_LEDGER.json'))
          frozen=ledger['frozen_upstream'];session=ledger['session']
          confirmed={x['model_call_key'] for x in ledger.get('confirmed_provider_sends') or []}
          uncertain={x['model_call_key'] for x in ledger.get('no_repeat_uncertain_claims') or []}
          wave_confirmed=wave_uncertain=0;cost=Decimal('0')
          for p in shard_paths:
              d=json.load(open(p))
              for x in d.get('members') or []:
                  code=str(x.get('code') or '');key=f'{session}:{code}:{frozen}'
                  req=int(x.get('model_http_requests_confirmed',0) or 0);poss=int(x.get('model_http_requests_possible',0) or 0)
                  claimed=bool(x.get('claim_persisted'));cost+=Decimal(str(x.get('usage_peak_estimate_cny','0') or '0'))
                  if req==1:
                      if key in confirmed or key in uncertain: raise SystemExit('DUPLICATE_MODEL_CALL_KEY:'+key)
                      ledger['confirmed_provider_sends'].append({
                        'code':code,'model_call_key':key,'source_branch':'fix/native-private-execution-20260914',
                        'source_receipt':'docs/runtime/RUN075_O657_FORMAL_RESULT.json','source_run_id':d.get('run_id'),
                        'source_workflow_run':int(os.environ['GITHUB_RUN_ID']),
                        'provider_response_sha256':x.get('provider_response_sha256'),'model_http_requests_confirmed':1,
                        'usage_peak_estimate_cny':x.get('usage_peak_estimate_cny'),
                        'strategy_core_sha256':x.get('strategy_core_sha256'),'raw_result_sha256':x.get('raw_result_sha256'),
                        'repeat_permitted':False
                      });confirmed.add(key);wave_confirmed+=1
                  elif claimed and poss>0:
                      proven_unsent=(x.get('failure_code')=='NameError' and req==0 and not x.get('provider_response_sha256'))
                      if not proven_unsent:
                          if key in confirmed or key in uncertain: raise SystemExit('DUPLICATE_UNCERTAIN_CALL_KEY:'+key)
                          ledger.setdefault('no_repeat_uncertain_claims',[]).append({
                            'code':code,'model_call_key':key,'source_run_id':d.get('run_id'),
                            'source_workflow_run':int(os.environ['GITHUB_RUN_ID']),
                            'status':x.get('status'),'failure_code':x.get('failure_code'),
                            'model_http_requests_confirmed':0,'model_http_requests_possible':poss,'repeat_permitted':False
                          });uncertain.add(key);wave_uncertain+=1
          ledger['current_confirmed_send_count']=len(ledger.get('confirmed_provider_sends') or [])
          ledger['current_uncertain_no_repeat_count']=len(ledger.get('no_repeat_uncertain_claims') or [])
          Path('/tmp/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json').write_text(json.dumps(ledger,ensure_ascii=False,indent=2)+'\n')
          plan=json.load(open('/tmp/plan/PLAN.json'))
          rank.update({
            'run_id':'TRI-DSA-O-RECOVER-20260918-075','decision_session':'2026-09-18',
            'continuation_parent':'docs/runtime/RUN073_O657_FORMAL_RESULT.json',
            'model_http_requests_this_wave':wave_confirmed,'uncertain_no_repeat_claims_this_wave':wave_uncertain,
            'usage_peak_estimate_cny_this_wave':str(cost),'deferred_for_budget_count':plan['deferred_count'],
            'automatic_retry':False,'schedule_changes':0,'main_merge':False,'raw_content_public':False
          })
          if plan['deferred_count']>0 and rank['state']=='PASS_O_FORMAL_CORE_RANKING_TOP3':
              raise SystemExit('FORMAL_PASS_WITH_DEFERRED_CODES_PROHIBITED')
          Path('/tmp/RUN075_O657_FORMAL_RESULT.json').write_text(json.dumps(rank,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'state':rank['state'],'processed':rank['processed_operational_members'],
                            'missing':rank['missing_count'],'eligible':rank['ranking_eligible_count'],
                            'additional_excluded':rank['additional_excluded_count'],
                            'top3':[[x['code'],x['sentiment_score'],x['action']] for x in rank['Top3']]}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RUN075_O657_FORMAL_SANITIZED
          path: |
            /tmp/RUN075_O657_FORMAL_RESULT.json
            /tmp/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json
            /tmp/plan/RELEASE.json
            /tmp/plan/PLAN.json
          retention-days: 90
      - name: Commit Run075 formal result and repaired ledger
        working-directory: research
        run: |
          cp /tmp/RUN075_O657_FORMAL_RESULT.json docs/runtime/RUN075_O657_FORMAL_RESULT.json
          cp /tmp/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json docs/runtime/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json
          git add docs/runtime/RUN075_O657_FORMAL_RESULT.json docs/runtime/O_CURRENT_SESSION_MODEL_LEDGER_20260918.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Rupheal@users.noreply.github.com'
          git commit -m 'dsa: recover proven-unsent O members and freeze ranking'
          git fetch origin fix/native-private-execution-20260914
          git rebase origin/fix/native-private-execution-20260914
          git push origin HEAD:fix/native-private-execution-20260914
