name: DSA Daily Formal candidate acceptance
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - scripts/dsa_daily_formal_generation_guard_v1.py
      - scripts/dsa_daily_formal_packet_v1.py
      - scripts/u_daily_risk_evidence_v1.py
      - scripts/dsa_daily_formal_trigger_v1.py
      - scripts/dsa_daily_market_snapshot_v1.py
      - scripts/dsa_daily_o_production_v1.py
      - scripts/dsa_daily_u_production_v1.py
      - scripts/dsa_production_orchestrator_v1.py
      - tests/test_dsa_daily_formal_generation_repair_v1.py
      - tests/test_dsa_daily_formal_packet_v1.py
      - tests/test_u_daily_risk_evidence_v1.py
      - .github/workflows/144-dsa-daily-o-formal-producer.yml
      - .github/workflows/145-dsa-daily-u-formal-producer.yml
      - .github/workflows/147-dsa-daily-formal-candidate-acceptance.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with: {ref: fix/native-private-execution-20260914, persist-credentials: false}
      - uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - run: python -m pip install pytest pyyaml exchange-calendars
      - name: Run deterministic repair tests
        run: python -m pytest --noconftest -q tests/test_dsa_daily_formal_generation_repair_v1.py tests/test_dsa_daily_formal_packet_v1.py tests/test_u_daily_risk_evidence_v1.py
      - name: Parse producer workflows and assert boundaries
        run: |
          python - <<'PY'
          import yaml
          from pathlib import Path
          for p in ['.github/workflows/144-dsa-daily-o-formal-producer.yml','.github/workflows/145-dsa-daily-u-formal-producer.yml']:
              raw=Path(p).read_text();yaml.safe_load(raw)
              assert "REAL_ORDERS_AUTHORIZED: 'false'" in raw
              assert 'force: true' not in raw.lower()
          print('CANDIDATE_DAILY_FORMAL_ACCEPTANCE_PASS')
          PY
