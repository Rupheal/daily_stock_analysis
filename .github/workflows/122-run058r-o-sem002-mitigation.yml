name: DSA Run058R SEM002 coverage-limitation dry acceptance

on:
  push:
    branches: [research/run058r-o-sem002-coverage-adapter-20260918]
    paths:
      - .github/workflows/122-run058r-o-sem002-mitigation.yml
      - docs/runtime/RUN058R_SCOPE.json

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-run058r-sem002-mitigation
  cancel-in-progress: false

jobs:
  dry:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'

    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deterministic dependencies
        run: pip install -r research/requirements.txt pytest requests deepseek-recipe==0.1.1

      - name: Run adapter and semantic-guard tests
        working-directory: research
        run: |
          python -m py_compile scripts/o_news_coverage_limitation.py scripts/run_hk_original_model_probe.py
          python -m pytest --noconftest -q             tests/test_o_news_coverage_limitation.py             tests/test_o_semantic_handoff_contract.py             tests/test_o_single_output_fact_check.py             tests/test_o_frozen_native_history_adapter.py             tests/test_o_native_input_contract.py             tests/test_deepseek_flash_cap010_guard.py

      - name: Verify zero-model mitigation scope
        working-directory: research
        run: |
          python - <<'PY'
          import json
          s=json.load(open('docs/runtime/RUN058R_SCOPE.json'))
          q=json.load(open('docs/runtime/RUN058Q_RESULT.json'))
          assert s['code']=='00005' and s['peer_free_gate_isolated_code']=='00006'
          assert s['model_http_requests_authorized']==0
          assert s['provider_send_authorized'] is False
          assert s['drive_writes_authorized']==0 and s['paid_data_calls_authorized']==0
          assert s['mitigation']['guard_relaxation'] is False
          assert s['mitigation']['frozen_upstream_prompt_template_changed'] is False
          assert s['mitigation']['native_scoring_changed'] is False
          assert s['mitigation']['fake_news_added'] is False
          assert q['state']=='STOP_MB003_FREE_DRY'
          r5=next(x for x in q['members'] if x['code']=='00005')
          r6=next(x for x in q['members'] if x['code']=='00006')
          assert r5['status']=='PASS_FROZEN_HISTORY_DRY'
          assert r6['preflight_failure_reason']=='TARGET_SESSION_VOLUME_OUTSIDE_CALIBRATED_BOUND'
          print('RUN058R_ZERO_MODEL_SCOPE_PASS')
          PY

      - uses: actions/download-artifact@v4
        with:
          run-id: 35224980615
          github-token: ${{ github.token }}
          name: RUN049_PUBLIC_CLOSE_AND_GATE_EVIDENCE
          path: parent

      - name: Bind exact O660 history
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN058R_SCOPE.json'))
          matches=[p for p in Path('parent').rglob('market-history.json') if hashlib.sha256(p.read_bytes()).hexdigest()==s['history_cache_sha256']]
          assert len(matches)==1
          d=json.loads(matches[0].read_text())
          assert d['target_session']=='2026-09-17' and 'hk00005' in (d.get('histories') or {})
          Path('/tmp/history-path').write_text(str(matches[0].resolve()))
          print('RUN058R_HISTORY_BIND_PASS')
          PY

      - name: Build fresh 00005 v2 preflight
        run: |
          mkdir -p /tmp/run058r
          python research/scripts/prepare_hk_pool_rollout_preflight_v2.py             --code 00005 --target 2026-09-17             --universe research/docs/runtime/run032_public_cache/O_UNIVERSE.json             --cache "$(cat /tmp/history-path)"             --plan research/docs/runtime/RUN057_O_NATIVE_PLAN.json             --out /tmp/run058r/preflight

      - name: Run adapted frozen-history dry envelope with no provider or Drive credentials
        run: |
          mkdir -p /tmp/config
          python - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/config/native-model-config.json').write_text(json.dumps({
            'model_list':[{'model_name':'openai/deepseek-flash','litellm_params':{
              'model':'openai/deepseek-flash','api_base':'https://api.deepseek.com',
              'api_key':'os.environ/LLM_DEEPSEEK_API_KEY','extra_body':{'thinking':{'type':'disabled'}}
            }}]
          }))
          PY
          set +e
          DSA_BUDGET_PROBE_ONLY=1           DSA_DEEPSEEK_V41_TOKENIZER="${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json"           DSA_INPUT_TOKEN_MARGIN=2048 DSA_EXPECT_THINKING=disabled           LITELLM_CONFIG=/tmp/config/native-model-config.json           LLM_CHANNELS=deepseek LLM_DEEPSEEK_PROTOCOL=openai LLM_DEEPSEEK_BASE_URL=https://api.deepseek.com           LLM_DEEPSEEK_MODELS=deepseek-flash LITELLM_MODEL=openai/deepseek-flash LITELLM_FALLBACK_MODELS=''           LLM_DEEPSEEK_API_KEY=dry-envelope-no-network           python research/scripts/run_hk_original_model_probe_run030.py             --symbol HK00005             --checkout original             --expected-commit 089d9d26d68f8b839ea5a74a3784e4402925f8b7             --preflight /tmp/run058r/preflight/preflight.json             --output /tmp/run058r/dry             --limit-cny 0.10 --carry-upper-cny 0             --target-boundary-adapter --frozen-native-history-adapter --news-handoff-v1             --news-coverage-limitation-v1
          echo "$?" > /tmp/run058r/dry.rc
          exit 0

      - name: Verify exact adapted evidence was consumed
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          from scripts.o_news_coverage_limitation import LIMITATION_TEXT,VERSION
          root=Path('/tmp/run058r/dry')
          rc=int(Path('/tmp/run058r/dry.rc').read_text())
          budget=json.load(open(root/'budget.json'))
          q=budget.get('requests') or []
          summary=json.load(open(root/'probe-summary.json'))
          handoff=json.load(open(root/'news-handoff-receipt.json'))
          prompt=(root/'original-formatted-prompt.txt').read_text()
          receipt=json.load(open(root/'news-prompt-consumption.json'))
          assert len(q)==1 and q[0]['status']=='dry_envelope_validated_not_sent'
          assert summary['input_validated'] is True
          assert summary['news_loader_consumed'] is True and summary['news_prompt_consumed'] is True
          assert summary['news_coverage_limitation_adapter'] is True
          assert summary['news_coverage_limitation_version']==VERSION
          assert summary['news_coverage_limitation_receipt']['applied'] is True
          assert summary['news_coverage_limitation_receipt']['news_items_added']==0
          assert handoff['coverage_limitation_adapter']['applied'] is True
          assert handoff['coverage_limitation_adapter']['native_strategy_fields_changed'] is False
          assert prompt.count(LIMITATION_TEXT)==1
          assert receipt['native_prompt_evidence_consumed'] is True
          assert receipt['news_context_sha256']==handoff['news_context_sha256']
          out={
            'schema_version':1,
            'run_id':'TRI-DSA-O-SEM002-MITIGATION-20260918-058R',
            'state':'PASS_COVERAGE_LIMITATION_DRY_READY_SENTINEL',
            'code':'00005','micro_batch_id':'O57-MB-003',
            'preflight_sha256':hashlib.sha256(Path('/tmp/run058r/preflight/preflight.json').read_bytes()).hexdigest(),
            'dry_process_exit_code':rc,
            'dry_request_status':q[0]['status'],
            'pre_send_peak_upper_cny':q[0]['pre_send_peak_upper_cny'],
            'input_validated':True,
            'frozen_native_history_adapter_count':(summary.get('frozen_native_history_adapter_receipt') or {}).get('count'),
            'news_coverage_limitation_version':VERSION,
            'coverage_limitation_applied':True,
            'coverage_limitation_exact_prompt_count':1,
            'native_prompt_evidence_consumed':True,
            'guard_relaxed':False,
            'fake_news_added':False,
            'native_scoring_changed':False,
            'frozen_upstream_prompt_template_changed':False,
            'model_http_requests':0,'provider_credentials_used':False,'drive_writes':0,'DeepSeek_API_cost_cny':0,
            'paid_data_calls':0,'real_orders':0,'simulation_writes':0,'automatic_retry':False,
            'next':'Permit one bounded sentinel provider request for 00005 only. Keep 00006 target-session isolated. If sentinel still triggers SEM-002, stop paid rollout again.'
          }
          Path('/tmp/RUN058R_RESULT.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: RUN058R_SEM002_MITIGATION_DRY
          path: /tmp/RUN058R_RESULT.json
          retention-days: 90

      - name: Commit sanitized Run058R result
        working-directory: research
        run: |
          set -euo pipefail
          cp /tmp/RUN058R_RESULT.json docs/runtime/RUN058R_RESULT.json
          git add docs/runtime/RUN058R_RESULT.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then echo no-change; else
            git commit -m 'dsa: accept Run058R SEM002 mitigation dry'
            git push
          fi
