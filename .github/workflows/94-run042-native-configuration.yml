name: DSA Run042 native nonthinking compatibility
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths: [docs/runtime/RUN042_SCOPE.json]
permissions: {contents: read, actions: read}
concurrency: {group: dsa-gatea-critical-paid-candidate, cancel-in-progress: false}
jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
    steps:
      - uses: actions/checkout@v5
        with: {path: research, persist-credentials: false}
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install -r research/requirements.txt pytest httpx deepseek-recipe==0.1.1
      - working-directory: research
        run: python -m pytest --noconftest -q tests/test_native_model_configuration.py tests/test_o_provider_completion.py tests/test_private_multipart.py tests/test_dsa_drive_recovery_regressions.py tests/test_member_history_window.py tests/test_hk_member_preflight.py tests/test_bounded_native_members.py tests/test_o_native_input_contract.py tests/test_run_hk_original_model_probe_imports.py tests/test_deepseek_flash_cap010_guard.py tests/test_o_release_quote_semantics.py tests/test_o_release_gate_contract.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 35180179743
          github-token: ${{ github.token }}
          name: RUN033_PUBLIC_HISTORY_CACHE
          path: parent
      - name: Bind exact parent history and unique new scope
        run: |
          python - <<'PY'
          import json,hashlib
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN042_SCOPE.json'))
          p=list(Path('parent').rglob('HISTORY_CACHE.json')); assert len(p)==1
          assert hashlib.sha256(p[0].read_bytes()).hexdigest()==s['history_cache_sha256']
          assert s['parent_workflow_run']==35180179743 and s['run_id']=='TRI-DSA-EXEC-20260917-042'
          assert s['closed_batch_007_reused'] is False and s['no_orders'] is True
          Path('/tmp/history-path').write_text(str(p[0].resolve()))
          PY
      - uses: actions/download-artifact@v4
        with:
          run-id: 35182844843
          github-token: ${{ github.token }}
          name: RUN037_CONT1_FREE_STORAGE_RECEIPT
          path: storage-parent
      - name: Require actual free private storage proof
        run: |
          python - <<'PYCODE'
          import json
          from pathlib import Path
          pp=list(Path('storage-parent').rglob('PRIVATE_REPLAY_RESULT.json')); ff=list(Path('storage-parent').rglob('SANITIZED_RESULT.json'))
          assert len(pp)==len(ff)==1
          p=json.loads(pp[0].read_text()); f=json.loads(ff[0].read_text())
          assert p['save_read_hash_restore'] is True and p['parts']>=2 and p['model_requests']==0
          assert f['model_http_requests_possible']==0
          assert len(f['members'])==2 and all(x['status']=='FREE_NATIVE_ENVELOPE_AND_PRIVATE_STORAGE_PASS' and x['private_persistence']['save_read_hash_restore'] for x in f['members'])
          PYCODE
      - name: Free preflight then at most one private native request per new member
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: |
          python research/scripts/run_hk_bounded_native_members.py --checkout original --cache "$(cat /tmp/history-path)" --scope research/docs/runtime/RUN042_SCOPE.json --out /tmp/run042
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RUN042_SANITIZED_RECEIPT
          path: /tmp/run042/SANITIZED_RESULT.json
          if-no-files-found: warn
          retention-days: 90
