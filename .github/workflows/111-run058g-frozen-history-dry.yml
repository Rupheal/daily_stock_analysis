name: DSA Run058G frozen-history dry acceptance
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths: [docs/runtime/RUN058G_SCOPE.json]
permissions: {contents: read, actions: read}
concurrency: {group: dsa-run058g-o-frozen-history-dry, cancel-in-progress: false}
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v5
        with: {ref: fix/native-private-execution-20260914, path: research, persist-credentials: false}
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install -r research/requirements.txt pytest deepseek-recipe==0.1.1
      - working-directory: research
        run: python -m pytest --noconftest -q tests/test_o_frozen_native_history_adapter.py tests/test_o_native_input_contract.py tests/test_deepseek_flash_cap010_guard.py tests/test_bounded_native_members_v2.py
      - uses: actions/download-artifact@v4
        with:
          run-id: 35224980615
          github-token: ${{ github.token }}
          name: RUN049_PUBLIC_CLOSE_AND_GATE_EVIDENCE
          path: parent
      - name: Bind current O660 history and build preflight
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN058G_SCOPE.json'))
          matches=[p for p in Path('parent').rglob('market-history.json') if hashlib.sha256(p.read_bytes()).hexdigest()==s['history_cache_sha256']]
          assert len(matches)==1
          Path('/tmp/history-path').write_text(str(matches[0].resolve()))
          PY
          python research/scripts/prepare_hk_pool_rollout_preflight_v2.py --code 00001 --target 2026-09-17 --universe research/docs/runtime/run032_public_cache/O_UNIVERSE.json --cache "$(cat /tmp/history-path)" --plan research/docs/runtime/RUN057_O_NATIVE_PLAN.json --out /tmp/preflight
      - name: Verify native dry reaches budget guard using frozen history
        run: |
          mkdir -p /tmp/config
          python - <<'PY'
          import json
          from pathlib import Path
          Path('/tmp/config/native-model-config.json').write_text(json.dumps({'model_list':[{'model_name':'openai/deepseek-flash','litellm_params':{'model':'openai/deepseek-flash','api_base':'https://api.deepseek.com','api_key':'os.environ/LLM_DEEPSEEK_API_KEY','extra_body':{'thinking':{'type':'disabled'}}}}]}))
          PY
          set +e
          DSA_BUDGET_PROBE_ONLY=1 \
          DSA_DEEPSEEK_V41_TOKENIZER="${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json" \
          DSA_INPUT_TOKEN_MARGIN=2048 DSA_EXPECT_THINKING=disabled \
          LITELLM_CONFIG=/tmp/config/native-model-config.json \
          LLM_CHANNELS=deepseek LLM_DEEPSEEK_PROTOCOL=openai LLM_DEEPSEEK_BASE_URL=https://api.deepseek.com \
          LLM_DEEPSEEK_MODELS=deepseek-flash LITELLM_MODEL=openai/deepseek-flash LITELLM_FALLBACK_MODELS='' \
          LLM_DEEPSEEK_API_KEY=dry-envelope-no-network \
          python research/scripts/run_hk_original_model_probe_run030.py --symbol HK00001 --checkout original --expected-commit 089d9d26d68f8b839ea5a74a3784e4402925f8b7 --preflight /tmp/preflight/preflight.json --output /tmp/dry --limit-cny 0.10 --carry-upper-cny 0 --target-boundary-adapter --frozen-native-history-adapter --news-handoff-v1
          rc=$?
          set -e
          echo $rc > /tmp/dry.rc
          python - <<'PY'
          import json,os
          from pathlib import Path
          b=json.load(open('/tmp/dry/budget.json'));q=b.get('requests') or []
          s=json.load(open('/tmp/dry/probe-summary.json'))
          assert len(q)==1 and q[0]['status']=='dry_envelope_validated_not_sent'
          assert s['input_validated'] is True
          a=s.get('frozen_native_history_adapter_receipt') or {}
          assert s.get('frozen_native_history_adapter') is True and a.get('count')==1 and a.get('rows')>=21
          assert s.get('news_loader_consumed') is True and s.get('news_prompt_consumed') is True
          out={'schema_version':1,'run_id':'TRI-DSA-O-DRY-ACCEPT-20260918-058G','state':'PASS_FROZEN_HISTORY_DRY',
               'code':'00001','input_validated':True,'dry_request_status':q[0]['status'],
               'pre_send_peak_upper_cny':q[0]['pre_send_peak_upper_cny'],
               'history_rows':a['rows'],'history_sha256':a['history_sha256'],
               'adapter_count':a['count'],'model_http_requests':0,'provider_credentials_used':False,
               'drive_writes':0,'orders':0,'next':'One bounded paid retry may use a NEW run/artifact id; no automatic retry.'}
          Path('/tmp/RUN058G_RESULT.json').write_text(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RUN058G_SANITIZED_DRY_ACCEPTANCE
          path: /tmp/RUN058G_RESULT.json
          retention-days: 90
