name: DSA Run058E fresh-preflight single O native child

on:
  push:
    branches: [research/run058e-o-single-native-20260918]
    paths:
      - .github/workflows/109-run058e-o-single-native.yml
      - scripts/run058e_single_native.py
      - docs/runtime/RUN058E_SCOPE.json

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-run058e-o-single-native
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'

    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deterministic and native dependencies
        run: pip install -r research/requirements.txt pytest httpx requests deepseek-recipe==0.1.1

      - name: Compile runner and run safety tests
        working-directory: research
        run: |
          python -m py_compile scripts/run058e_single_native.py
          python -m pytest --noconftest -q             tests/test_hk_pool_rollout_preflight_v2.py             tests/test_native_model_configuration.py             tests/test_o_provider_completion.py             tests/test_private_multipart.py             tests/test_dsa_drive_recovery_regressions.py             tests/test_bounded_native_members.py             tests/test_o_native_input_contract.py             tests/test_deepseek_flash_cap010_guard.py             tests/test_o_release_quote_semantics.py             tests/test_o_release_gate_contract.py             tests/test_run058_o_rollout_controller.py

      - name: Verify immutable single-member scope
        working-directory: research
        run: |
          python - <<'PY'
          import json
          s=json.load(open('docs/runtime/RUN058E_SCOPE.json'))
          d=json.load(open('docs/runtime/RUN058D_RESULT.json'))
          assert s['code']=='00001' and s['peer_session_isolated_code']=='00002'
          assert s['micro_batch_id']=='O57-MB-001' and s['target_session']=='2026-09-17'
          assert s['maximum_requests']==1 and s['maximum_cost_cny']=='0.10'
          assert s['provider_send_authorized'] is True and s['automatic_retry'] is False
          assert s['no_orders'] is True and s['no_signal_publish'] is True
          assert d['state']=='PASS_SELECTIVE_FAIL_CLOSED'
          assert d['ready_for_new_paid_child']==['00001']
          assert d['session_preflight_isolated']==['00002']
          print('RUN058E_SCOPE_PASS')
          PY

      - uses: actions/download-artifact@v4
        with:
          run-id: 35224980615
          github-token: ${{ github.token }}
          name: RUN049_PUBLIC_CLOSE_AND_GATE_EVIDENCE
          path: parent

      - name: Bind exact 2026-09-17 O660 history cache
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN058E_SCOPE.json'))
          matches=[]
          for p in Path('parent').rglob('market-history.json'):
              if hashlib.sha256(p.read_bytes()).hexdigest()==s['history_cache_sha256']:
                  matches.append(p)
          assert len(matches)==1
          d=json.loads(matches[0].read_text())
          assert d['target_session']=='2026-09-17'
          assert 'hk00001' in (d.get('histories') or {})
          Path('/tmp/history-path').write_text(str(matches[0].resolve()))
          print('RUN058E_HISTORY_BIND_PASS')
          PY

      - name: Execute fresh v2 preflight, Drive claim, one DeepSeek request, private save and semantic gates
        working-directory: research
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: |
          python scripts/run058e_single_native.py             --checkout ../original             --cache "$(cat /tmp/history-path)"             --scope docs/runtime/RUN058E_SCOPE.json             --plan docs/runtime/RUN057_O_NATIVE_PLAN.json             --out /tmp/run058e

      - name: Reconcile member, append rollout ledger, and select next child
        if: always()
        working-directory: research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result_path=Path('/tmp/run058e/SANITIZED_RESULT.json')
          if not result_path.exists():
              result={'members':[],'model_http_requests_confirmed':0,'model_http_requests_possible':0,'accepted_member':False}
          else:
              result=json.loads(result_path.read_text())
          member=(result.get('members') or [{}])[0]
          private_ok=(member.get('private_persistence') or {}).get('save_read_hash_restore') is True
          accepted=result.get('accepted_member') is True and private_ok and result.get('model_http_requests_confirmed')==1
          status='RAW_GATE_BLOCK' if accepted else 'STOP_TRANCHE'
          rec={
            'schema_version':1,
            'run_id':'TRI-DSA-O-NATIVE-20260918-058E',
            'state':'ACCEPTED_MEMBER_PEER_RAW_GATE_BLOCK' if accepted else 'STOP_TRANCHE',
            'micro_batch_id':'O57-MB-001',
            'codes':['00001','00002'],
            'member_outcomes':{
              '00001':{
                'status':member.get('status'),
                'fresh_preflight_status':member.get('fresh_preflight_status'),
                'model_http_requests_confirmed':member.get('model_http_requests_confirmed',0),
                'model_http_requests_possible':member.get('model_http_requests_possible',0),
                'pre_send_upper_cny':member.get('pre_send_upper_cny'),
                'usage_peak_estimate_cny':member.get('usage_peak_estimate_cny'),
                'observed_balance_change_cny':member.get('observed_balance_change_cny'),
                'private_final_roundtrip':private_ok,
                'raw_gate':member.get('raw_gate'),
                'raw_blockers':member.get('raw_blockers'),
              },
              '00002':{
                'status':'TARGET_SESSION_ISOLATED',
                'reason':'TARGET_SESSION_VOLUME_OUTSIDE_CALIBRATED_BOUND',
                'provider_request_permitted':False,
              },
            },
            'model_http_requests_confirmed':result.get('model_http_requests_confirmed',0),
            'model_http_requests_possible':result.get('model_http_requests_possible',0),
            'maximum_cost_cny':'0.10',
            'actual_attributable_charge_cny':result.get('actual_attributable_charge_cny'),
            'qualified_signals':0,'orders':0,'simulation_ledger_writes':0,
            'automatic_retry':False,
            'ledger_status':status,
            'next':'Advance controller to O57-MB-002.' if accepted else 'Hold controller; diagnose 00001 without automatic retry.',
          }
          Path('/tmp/RUN058E_RECONCILIATION.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n')

          ledger=Path('docs/runtime/RUN058_O_ROLLOUT_LEDGER.jsonl')
          rows=[]
          if ledger.exists():
              rows=[json.loads(x) for x in ledger.read_text().splitlines() if x.strip()]
          existing=[x for x in rows if x.get('micro_batch_id')=='O57-MB-001']
          newrow={
            'run_id':'TRI-DSA-O-NATIVE-20260918-058E',
            'micro_batch_id':'O57-MB-001',
            'codes':['00001','00002'],
            'status':status,
            'member_outcomes':rec['member_outcomes'],
            'model_http_requests_confirmed':rec['model_http_requests_confirmed'],
            'maximum_cost_cny':'0.10',
            'actual_attributable_charge_cny':rec['actual_attributable_charge_cny'],
            'automatic_retry':False,
          }
          if existing:
              assert existing[-1]==newrow, 'LEDGER_EXISTING_ROW_CONFLICT'
          else:
              with ledger.open('a',encoding='utf-8') as f:
                  f.write(json.dumps(newrow,ensure_ascii=False,separators=(',',':'))+'\n')
          print(json.dumps(rec,ensure_ascii=False))
          PY

          python scripts/build_run058_o_rollout_controller.py             --scope docs/runtime/RUN058_SCOPE.json             --plan docs/runtime/RUN057_O_NATIVE_PLAN.json             --ledger docs/runtime/RUN058_O_ROLLOUT_LEDGER.jsonl             --output /tmp/RUN058_NEXT_CONTROLLER.json

          python - <<'PY'
          import json
          r=json.load(open('/tmp/RUN058E_RECONCILIATION.json'))
          c=json.load(open('/tmp/RUN058_NEXT_CONTROLLER.json'))
          if r['ledger_status']=='RAW_GATE_BLOCK':
              assert c['state']=='READY_CHILD_ENVELOPE'
              assert c['selected_child']['micro_batch_id']=='O57-MB-002'
              assert c['selected_child']['codes']==['00003','00004']
              assert c['selected_child']['provider_send_authorized_by_run058'] is False
          else:
              assert c['state']=='HOLD_NO_CHILD'
          print(json.dumps({'reconciliation':r['state'],'next_state':c['state'],'next_child':c.get('selected_child')},ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RUN058E_SANITIZED_SINGLE_NATIVE
          path: |
            /tmp/run058e/SANITIZED_RESULT.json
            /tmp/RUN058E_RECONCILIATION.json
            /tmp/RUN058_NEXT_CONTROLLER.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit sanitized receipt, append-only ledger, and next controller
        if: always()
        working-directory: research
        run: |
          set -euo pipefail
          test -f /tmp/RUN058E_RECONCILIATION.json
          test -f /tmp/RUN058_NEXT_CONTROLLER.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -f /tmp/run058e/SANITIZED_RESULT.json; then
            cp /tmp/run058e/SANITIZED_RESULT.json docs/runtime/RUN058E_SANITIZED_RESULT.json
            git add docs/runtime/RUN058E_SANITIZED_RESULT.json
          fi
          cp /tmp/RUN058E_RECONCILIATION.json docs/runtime/RUN058E_RECONCILIATION.json
          cp /tmp/RUN058_NEXT_CONTROLLER.json docs/runtime/RUN058_NEXT_CONTROLLER.json
          git add docs/runtime/RUN058E_RECONCILIATION.json docs/runtime/RUN058_NEXT_CONTROLLER.json docs/runtime/RUN058_O_ROLLOUT_LEDGER.jsonl
          if git diff --cached --quiet; then echo 'No Run058E receipt changes'; else
            git commit -m 'dsa: record Run058E native child and rollout advance'
            git push
          fi
