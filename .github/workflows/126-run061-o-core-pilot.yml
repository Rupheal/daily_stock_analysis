name: DSA O strategy-core pilot from existing private samples
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - 'docs/runtime/RUN061_O_CORE_PILOT_SCOPE.json'
      - 'scripts/o_strategy_core_acceptance.py'
      - 'tests/test_o_strategy_core_acceptance.py'
      - '.github/workflows/126-run061-o-core-pilot.yml'
permissions:
  contents: write
concurrency:
  group: dsa-run061-o-core-pilot
  cancel-in-progress: false
jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
      DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
      DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
      DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/native-private-execution-20260914
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - run: pip install pytest httpx
      - name: Deterministic core acceptance tests
        run: python -m pytest --noconftest -q tests/test_o_strategy_core_acceptance.py
      - name: Restore exact private evidence for the three historical samples
        run: |
          python - <<'PY'
          import hashlib,json,os,httpx
          from pathlib import Path
          from dsa_drive_store import DriveStore,scoped_token,API,StoreError
          from dsa_private_multipart import restore
          s=json.load(open('docs/runtime/RUN061_O_CORE_PILOT_SCOPE.json'))
          root=Path('/tmp/o-core-pilot');root.mkdir()
          with httpx.Client(timeout=30,follow_redirects=False) as c:
              c.headers['Authorization']='Bearer '+scoped_token(c)
              st=DriveStore(c,os.environ['DSA_DRIVE_FOLDER_ID'])
              for item in s['samples']:
                  code=item['code']; aid=item['artifact_prefix']+'-'+code+'-INDEX'
                  q="'"+os.environ['DSA_DRIVE_FOLDER_ID']+"' in parents and trashed=false and appProperties has { key='artifact_id' and value='"+aid+"' }"
                  rows=st.request('GET',API+'/files',params={'q':q,'fields':'files(id,appProperties),nextPageToken','pageSize':100}).json()
                  files=rows.get('files') or []
                  if rows.get('nextPageToken') or len(files)!=1: raise StoreError('PRIVATE_INDEX_LOOKUP_NOT_UNIQUE:'+code)
                  props=files[0].get('appProperties') or {}
                  if props.get('sha256')!=item['private_index_sha256'] or props.get('run_id')!=item['member_run_id']:
                      raise StoreError('PRIVATE_INDEX_IDENTITY_MISMATCH:'+code)
                  idx=root/(code+'-index.json')
                  st.recover(files[0]['id'],item['private_index_sha256'],idx)
                  manifest=json.loads(idx.read_bytes());parts=[]
                  for n,row in enumerate(manifest.get('private_storage') or []):
                      p=root/(code+'-p%03d.bin'%n)
                      st.recover(row['file_id'],row['sha256'],p);parts.append(p.read_bytes())
                  restored=restore(manifest,parts)
                  dst=root/code;dst.mkdir()
                  for name,data in restored.items():
                      p=dst/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
                  provider=next(dst.rglob('native/provider-response.txt'))
                  got=hashlib.sha256(provider.read_bytes()).hexdigest()
                  if got!=item['provider_response_sha256']: raise StoreError('PROVIDER_HASH_MISMATCH:'+code)
                  print(json.dumps({'code':code,'restore':'PASS','files':len(restored),'provider_hash':'PASS'}))
          PY
      - name: Evaluate immutable strategy core without model calls
        run: |
          mkdir -p /tmp/o-core-receipts
          for code in 00001 00003 00004; do
            root="/tmp/o-core-pilot/$code"
            python scripts/o_strategy_core_acceptance.py               --preflight "$(find "$root" -path '*/preflight/preflight.json' -print -quit)"               --original-input "$(find "$root" -path '*/native/original-input.json' -print -quit)"               --result "$(find "$root" -path '*/native/pipeline-final-result.json' -print -quit)"               --out "/tmp/o-core-receipts/$code.json"
          done
      - name: Build sanitized pilot result
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          rows=[]
          for p in sorted(Path('/tmp/o-core-receipts').glob('*.json')):
              d=json.load(open(p));rows.append({
                'code':p.stem,
                'status':d['status'],
                'ranking_eligible':d['ranking_eligible'],
                'narrative_release_status':d['narrative_release_status'],
                'strategy_core':d['strategy_core'],
                'strategy_core_sha256':d['strategy_core_sha256'],
                'raw_result_sha256':d['raw_result_sha256'],
                'semantic_guards':d['semantic_guards'],
                'hard_semantic_count':len(d['hard_semantic_findings']),
                'core_semantic_count':len(d['core_semantic_findings']),
                'narrative_semantic_count':len(d['narrative_semantic_findings']),
                'blockers':d['blockers'],
              })
          out={
            'schema_version':1,
            'run_id':'TRI-DSA-O-CORE-PILOT-20260918-061',
            'state':'PASS_CORE_ARCHITECTURE_PILOT' if all(x['ranking_eligible'] for x in rows) else 'NO_GO_CORE_ARCHITECTURE_PILOT',
            'samples':rows,
            'accepted':sum(x['ranking_eligible'] for x in rows),
            'denominator':len(rows),
            'narrative_quarantined':sum(x['narrative_release_status']=='QUARANTINED' for x in rows),
            'model_http_requests':0,
            'drive_writes':0,
            'real_orders':0,
            'raw_content_public':False,
            'next':'If PASS, build current-session O operational rollout using member-level continuation and strategy-core ranking. If NO_GO, do not launch paid O657.'
          }
          Path('/tmp/RUN061_O_CORE_PILOT_RESULT.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: RUN061_O_CORE_PILOT_SANITIZED
          path: /tmp/RUN061_O_CORE_PILOT_RESULT.json
          retention-days: 90
      - name: Commit sanitized result
        run: |
          cp /tmp/RUN061_O_CORE_PILOT_RESULT.json docs/runtime/RUN061_O_CORE_PILOT_RESULT.json
          git add docs/runtime/RUN061_O_CORE_PILOT_RESULT.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'dsa: record Run061 O strategy-core pilot'
          git fetch origin fix/native-private-execution-20260914
          git rebase origin/fix/native-private-execution-20260914
          git push origin HEAD:fix/native-private-execution-20260914
