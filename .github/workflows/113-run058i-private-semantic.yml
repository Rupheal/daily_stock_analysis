name: DSA Run058I private semantic attribution
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths: [docs/runtime/RUN058I_SCOPE.json]
permissions: {contents: write}
concurrency:
  group: dsa-native-private-branch-writer
  cancel-in-progress: false
  queue: max
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
      DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
      DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
      DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with: {ref: fix/native-private-execution-20260914, fetch-depth: 0}
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - run: pip install httpx
      - name: Restore exact private multipart
        run: |
          python - <<'PY'
          import os,json,httpx,tempfile
          from pathlib import Path
          from dsa_drive_store import DriveStore,scoped_token,API,StoreError
          from dsa_private_multipart import restore
          s=json.load(open('docs/runtime/RUN058I_SCOPE.json'))
          aid=s['parent_artifact_prefix']+'-00001-INDEX'
          with httpx.Client(timeout=30,follow_redirects=False) as c:
              c.headers['Authorization']='Bearer '+scoped_token(c)
              st=DriveStore(c,os.environ['DSA_DRIVE_FOLDER_ID'])
              q="'"+os.environ['DSA_DRIVE_FOLDER_ID']+"' in parents and trashed=false and appProperties has { key='artifact_id' and value='"+aid+"' }"
              rows=st.request('GET',API+'/files',params={'q':q,'fields':'files(id,appProperties),nextPageToken','pageSize':100}).json()
              f=rows.get('files') or []
              if rows.get('nextPageToken') or len(f)!=1: raise StoreError('RUN058H_INDEX_LOOKUP_NOT_UNIQUE')
              props=f[0].get('appProperties') or {}
              if props.get('sha256')!=s['parent_private_index_sha256'] or props.get('run_id')!=s['parent_member_run_id']:
                  raise StoreError('RUN058H_INDEX_IDENTITY_MISMATCH')
              Path('/tmp/private').mkdir()
              idx=Path('/tmp/index.json');st.recover(f[0]['id'],s['parent_private_index_sha256'],idx)
              m=json.loads(idx.read_bytes());parts=[]
              for n,x in enumerate(m.get('private_storage') or []):
                  p=Path('/tmp')/('p%03d.bin'%n);st.recover(x['file_id'],x['sha256'],p);parts.append(p.read_bytes())
              files=restore(m,parts)
              for name,data in files.items():
                  p=Path('/tmp/private')/name;p.parent.mkdir(parents=True,exist_ok=True);p.write_bytes(data)
          print(json.dumps({'restore':'PASS','files':len(files),'model_requests':0}))
          PY
      - name: Attribute semantic blockers without exposing raw text
        run: python scripts/review_run058h_semantics.py --root /tmp/private --out /tmp/RUN058I_RESULT.json
      - uses: actions/upload-artifact@v4
        with:
          name: RUN058I_SANITIZED_SEMANTIC_ATTRIBUTION
          path: /tmp/RUN058I_RESULT.json
          retention-days: 90
      - name: Commit sanitized receipt
        run: |
          cp /tmp/RUN058I_RESULT.json docs/runtime/RUN058I_RESULT.json
          git add docs/runtime/RUN058I_RESULT.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Rupheal@users.noreply.github.com'
          git commit -m 'dsa: attribute Run058H semantic blockers privately'
          git fetch origin fix/native-private-execution-20260914
          git rebase origin/fix/native-private-execution-20260914
          git push origin HEAD:fix/native-private-execution-20260914
