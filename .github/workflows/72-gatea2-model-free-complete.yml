name: O Gate A2 model-free completion
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - docs/runtime/run026-gatea2-model-free-complete.json
permissions:
  contents: read
concurrency:
  group: dsa-gatea2-prep
  cancel-in-progress: false
jobs:
  complete:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
      DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
      DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
      DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts:${{ github.workspace }}/research/tests
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      BACKTEST_ENABLED: 'false'
      AGENT_MODE: 'false'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      RUN_ID: TRI-DSA-EXEC-20260916-026
      CANDIDATE_ARTIFACT_ID: ART-DSA-RUN026-GATEA2-O-SINGLE
      CANDIDATE_CLAIM_ID: ART-DSA-RUN026-GATEA2-O-SINGLE-CLAIM
    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - name: Read frozen historical CHILD2 observer source for provenance fixture
        uses: actions/checkout@v5
        with:
          ref: c75c8496410cd33a151d659add7c83ce92bdd1cd
          path: child2-observer
          sparse-checkout: scripts/run_hk_original_model_probe.py
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify zero-model scope and frozen state
        run: |
          python - <<'PY'
          import json,subprocess
          s=json.load(open('research/docs/runtime/run026-gatea2-model-free-complete.json'))
          assert s['run_id']=='TRI-DSA-EXEC-20260916-026'
          assert s['model_http_requests_authorized']==0 and s['claim_creation_permitted'] is False
          assert s['normal_route_only'] is True and s['no_gate_relaxation'] is True
          assert s['gate_b_c']=='FROZEN' and s['runtime_activated'] is False and s['real_orders_permitted'] is False
          assert s['frozen_upstream']=='089d9d26d68f8b839ea5a74a3784e4402925f8b7'
          got=subprocess.check_output(['git','rev-parse','HEAD'],cwd='original',text=True).strip(); assert got==s['frozen_upstream']
          assert not subprocess.check_output(['git','diff','--name-only','HEAD'],cwd='original',text=True).strip()
          print(json.dumps({'zero_model_scope':True,'claim_created':False,'gate_b_c':'FROZEN','frozen_upstream_verified':True}))
          PY

      - name: Install deterministic runtime dependencies
        run: pip install -r research/requirements.txt pytest httpx

      - name: Main model-free contract suite
        working-directory: research
        run: >-
          python -m pytest --noconftest -q
          tests/test_o_target_session_contract.py
          tests/test_prepare_xiaomi_acceptance_targeted.py
          tests/test_o_native_date_boundary_adapter.py
          tests/test_o_native_input_contract.py
          tests/test_hk_volume_reconciliation.py
          tests/test_o_semantic_handoff_contract.py
          tests/test_o_post_output_contract.py
          tests/test_o_single_output_fact_check.py
          tests/test_native_handoff_integration.py
          tests/test_run_hk_original_model_probe_imports.py

      - name: Frozen capture-stage provenance suite
        env:
          DSA_FROZEN_ANALYZER_SOURCE: ${{ github.workspace }}/original/src/analyzer.py
          DSA_FROZEN_PIPELINE_SOURCE: ${{ github.workspace }}/original/src/core/pipeline.py
          DSA_OBSERVER_SOURCE: ${{ github.workspace }}/child2-observer/scripts/run_hk_original_model_probe.py
        working-directory: research
        run: python -m pytest --noconftest -q tests/test_o_capture_stage_provenance.py

      - name: Resolve and freeze current completed XHKG target
        run: |
          python - <<'PY'
          import json
          from datetime import datetime,timezone
          from pathlib import Path
          from o_target_session_contract import RULE_VERSION,resolve_target_session
          r=resolve_target_session(datetime.now(timezone.utc)); t=r.target_session.isoformat()
          out={'rule_version':RULE_VERSION,'target_session':t,'target_source':'XHKG_COMPLETED_SESSION','resolved_at_utc':datetime.now(timezone.utc).isoformat(),'model_http_requests':0}
          Path('/tmp/gatea2-target').write_text(t); Path('/tmp/gatea2-target.json').write_text(json.dumps(out,indent=2)); print(json.dumps(out))
          PY

      - name: Fresh strict preflight and unchanged price gate
        run: |
          mkdir -p /tmp/gatea2
          python research/scripts/prepare_xiaomi_acceptance_targeted.py > /tmp/gatea2/preflight.stdout 2> /tmp/gatea2/preflight.stderr
          cp research/probe/preflight.json /tmp/gatea2/preflight.json
          cp research/probe/target-session-receipt.json /tmp/gatea2/target-session-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          t=Path('/tmp/gatea2-target').read_text().strip(); p=json.load(open('research/probe/preflight.json')); r=json.load(open('research/probe/target-session-receipt.json'))
          assert p.get('passed') is True and p.get('prices_passed') is True and p.get('symbol','').upper()=='HK01810'
          assert str(p.get('target'))==t==str(r.get('target_session'))==str(r.get('preflight_target')) and r.get('target_match') is True
          assert r.get('yahoo_repair_enabled') is True
          s=p.get('component_status') or {}; assert s.get('prices')=='passed'
          print(json.dumps({'fresh_preflight':'PASS','target':t,'price_gate':'PASS','yahoo_repair_is_disclosed_derived_input':True,'model_http_requests':0}))
          PY

      - name: Frozen normal-route native exact-session smoke
        run: |
          T="$(cat /tmp/gatea2-target)"
          python research/scripts/run_hk_native_data_probe.py --checkout original --universe research/docs/dsa-u-universe.json --scope O_single_stock_smoke --expected-date "$T" --expected-commit 089d9d26d68f8b839ea5a74a3784e4402925f8b7 --target-boundary-adapter --timeout 240 --output /tmp/gatea2-native > /tmp/gatea2/native-wrapper.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          t=Path('/tmp/gatea2-target').read_text().strip(); d=json.load(open('/tmp/gatea2-native/coverage.json')); rows=d.get('coverage') or []
          assert d.get('code_commit')=='089d9d26d68f8b839ea5a74a3784e4402925f8b7'
          assert d.get('native_logic_modified') is False and d.get('target_boundary_adapter') is True
          assert (d.get('target_boundary_adapter_apply_count') or 0)>=1
          assert d.get('coverage_denominator')==1 and d.get('current_valid_count')==1
          assert len(rows)==1 and str(rows[0].get('latest_date'))==t and d.get('returncode')==0
          print(json.dumps({'native_exact_session':'PASS','normal_route':True,'target':t,'adapter_apply_count':d.get('target_boundary_adapter_apply_count'),'coverage_denominator':1,'current_valid_count':1,'model_http_requests':0}))
          PY

      - name: Exact observer input receipt and deterministic opening fact
        run: |
          python - <<'PY'
          import json,sqlite3
          from pathlib import Path
          from o_native_input_contract import validate_native_input
          from o_post_output_contract import derive_open_gap
          from o_semantic_handoff_contract import CONTRACT_VERSION,canonical_hash
          p=json.load(open('research/probe/preflight.json')); t=Path('/tmp/gatea2-target').read_text().strip(); db=sqlite3.connect('/tmp/gatea2-native/native-data.db')
          rows=db.execute("SELECT date,open,high,low,close,volume FROM stock_daily WHERE code=? COLLATE NOCASE ORDER BY date DESC LIMIT 2",('hk01810',)).fetchall(); db.close(); assert len(rows)==2
          today=dict(zip(('date','open','high','low','close','volume'),rows[0])); prev=dict(zip(('date','open','high','low','close','volume'),rows[1])); v=validate_native_input(p,{'today':today}); assert v.get('validated') is True and str(v.get('target'))==t
          candidate={'context':{'code':'HK01810','today':today,'yesterday':prev},'news_context':None,'analysis_context_pack_summary':None,'capture_stage':'PRE_PROVIDER_DETERMINISTIC_RECEIPT'}
          gap=derive_open_gap(candidate); assert gap['status']=='PASS' and gap['direction'] in ('GAP_UP','GAP_DOWN','FLAT_OPEN')
          out={'target':t,'open':today['open'],'high':today['high'],'low':today['low'],'close':today['close'],'volume':today['volume'],'previous_close':prev['close'],'opening_gap':gap,'volume_status':v.get('volume_status'),'news_handoff_version':CONTRACT_VERSION,'preflight_sha256':canonical_hash(p),'candidate_input_sha256':canonical_hash(candidate),'frozen_upstream':'089d9d26d68f8b839ea5a74a3784e4402925f8b7','capture_stage':'PRE_PROVIDER_DETERMINISTIC_RECEIPT','model_http_requests':0}
          Path('/tmp/gatea2/exact-input-receipt.json').write_text(json.dumps(out,indent=2,default=str)); print(json.dumps(out,default=str))
          PY

      - name: True frozen analyzer dry route with model HTTP forbidden
        run: |
          python research/scripts/run_hk_original_input_dry_probe.py --checkout original --expected-commit 089d9d26d68f8b839ea5a74a3784e4402925f8b7 --preflight research/probe/preflight.json --output /tmp/gatea2-dry --target-boundary-adapter > /tmp/gatea2/dry.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          t=Path('/tmp/gatea2-target').read_text().strip(); d=json.load(open('/tmp/gatea2-dry/dry-input-receipt.json'))
          assert d.get('reached_original_analyzer') is True and d.get('input_validated') is True
          assert str(d.get('target'))==t and str(d.get('context_date'))==t
          assert d.get('model_http_requests')==0 and (d.get('target_boundary_adapter_apply_count') or 0)>=1
          assert d.get('original_tracked_source_unchanged') is True and d.get('analyzer_under_frozen_checkout') is True and d.get('main_under_frozen_checkout') is True
          print(json.dumps({'frozen_analyzer_dry_route':'PASS','target':t,'news_context_present':d.get('news_context_present'),'model_http_requests':0}))
          PY

      - name: News handoff and post-output fail-closed proof
        working-directory: research
        run: |
          python -m pytest --noconftest -q tests/test_native_handoff_integration.py tests/test_o_post_output_contract.py tests/test_o_semantic_handoff_contract.py tests/test_o_single_output_fact_check.py
          python - <<'PY'
          import json
          old=json.load(open('docs/runtime/O_SINGLE_NATIVE_ACCEPTANCE.json')); assert old['status']=='FAIL'
          blockers=(old.get('formal_post_output_contract') or {}).get('active_output_blockers') or []
          assert 'OPEN_GAP_DIRECTION_CONTRADICTION' in blockers
          assert old.get('decision',{}).get('repeat_model_request_permitted') is False
          print(json.dumps({'historical_child2_immutable_fail':True,'opening_contradiction_retained':True,'repeat_model_request_permitted':False,'model_http_requests':0}))
          PY

      - name: Candidate Drive absence and synthetic private save-read-hash-restore
        run: |
          python - <<'PY'
          import os,httpx
          from dsa_drive_store import DriveStore,scoped_token
          with httpx.Client(timeout=30,follow_redirects=False) as c:
              c.headers['Authorization']='Bearer '+scoped_token(c); s=DriveStore(c,os.environ['DSA_DRIVE_FOLDER_ID'])
              s.assert_absent(os.environ['CANDIDATE_ARTIFACT_ID']); s.assert_absent(os.environ['CANDIDATE_CLAIM_ID'])
          print('{"candidate_artifact_absent":true,"candidate_claim_absent":true,"model_http_requests":0}')
          PY
          printf '%s\n' '{"run_id":"TRI-DSA-EXEC-20260916-026","classification":"synthetic_no_model_content","payload":"GATEA2_FINAL_MODEL_FREE_ROUNDTRIP","runtime_activated":false}' > /tmp/gatea2-drive.json
          AID="ART-DSA-RUN026-GATEA2-PREP-COMPLETE-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python research/scripts/dsa_drive_bundle.py --source /tmp/gatea2-drive.json --run-id "$RUN_ID" --artifact-id "$AID" --receipt /tmp/gatea2/drive-roundtrip.json

      - name: Final sanitized model-free preparation receipt
        run: |
          python - <<'PY'
          import hashlib,json,os
          from datetime import datetime,timezone
          from pathlib import Path
          t=Path('/tmp/gatea2-target').read_text().strip(); p=Path('research/probe/preflight.json').read_bytes(); dr=json.load(open('/tmp/gatea2/drive-roundtrip.json')); inp=json.load(open('/tmp/gatea2/exact-input-receipt.json'))
          out={'schema_version':1,'run_id':'TRI-DSA-EXEC-20260916-026','phase':'MODEL_FREE_PREP','state':'PASS_READY_FOR_SEPARATE_CLAIM','workflow_run':int(os.environ['GITHUB_RUN_ID']),'source_commit':os.environ['GITHUB_SHA'],'target_session':t,'preflight_sha256':hashlib.sha256(p).hexdigest(),'candidate_input_sha256':inp.get('candidate_input_sha256'),'opening_gap':inp.get('opening_gap'),'price_gate':'PASS','native_exact_session':'PASS','observer_input_contract':'PASS','frozen_analyzer_dry_route':'PASS','capture_provenance':'PASS','news_handoff_contract':'PASS','post_output_fail_closed':'PASS','drive_candidate_absence':'PASS','drive_synthetic_roundtrip':'PASS','drive_roundtrip_sha256':dr.get('sha256'),'model_http_requests':0,'claim_created':False,'runtime_activated':False,'real_orders':0,'gate_b_c':'FROZEN','completed_at_utc':datetime.now(timezone.utc).isoformat()}
          Path('/tmp/gatea2-model-free-complete.json').write_text(json.dumps(out,indent=2,default=str)); print(json.dumps(out,default=str))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: gatea2-model-free-complete-${{ github.run_id }}
          path: /tmp/gatea2-model-free-complete.json
          if-no-files-found: error
          retention-days: 14
