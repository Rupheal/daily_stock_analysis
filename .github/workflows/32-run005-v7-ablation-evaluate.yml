name: Run005 V7 ablation evaluation

on:
  push:
    branches: [trident/run004-fullpool-pit]
    paths: [run005_v7_eval_trigger.json]

permissions:
  contents: read
  actions: read

jobs:
  evaluate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify zero-model evaluation trigger
        run: |
          python - <<'PY'
          import json,os
          if os.environ.get('GITHUB_RUN_ATTEMPT')!='1': raise SystemExit('rerun prohibited')
          t=json.load(open('run005_v7_eval_trigger.json'))
          assert t['run_id']=='TRI-DSA-VAL-20260913-005-V7-EVAL-R1'
          assert t['ablation_run_id']==34788818461
          assert t['outcome_run_id']==34788108594
          assert t['outcome_artifact_id']==10326983504
          assert t['outcome_artifact_digest']=='sha256:cd378ecf8bd8354e0832ad347888b229eefceba8582997c5900773009c07c103'
          assert t['model_calls_authorized'] is False
          print('RUN005_V7_EVAL_TRIGGER_OK')
          PY
      - name: Install deterministic test dependencies
        run: python -m pip install pytest anyio fastapi httpx starlette
      - name: Test evaluator
        run: python -m pytest -q tests/test_run005_v7_evaluate_ablation.py
      - name: Download frozen ablation predictions
        uses: actions/download-artifact@v4
        with:
          name: run005-v7-ablation-predictions-r1
          path: input/ablation
          run-id: 34788818461
          github-token: ${{ github.token }}
      - name: Download frozen champion outcomes
        uses: actions/download-artifact@v4
        with:
          name: run005-v1-outcomes-20260907-r3
          path: input/outcome
          run-id: 34788108594
          github-token: ${{ github.token }}
      - name: Verify ablation source boundary
        run: |
          python - <<'PY'
          import json,pathlib
          t=json.load(open('run005_v7_eval_trigger.json'))
          p=pathlib.Path('input/ablation/v7-ablation-predictions.json')
          x=json.loads(p.read_text())
          assert x['status']=='RUN005_V7_ABLATION_PREDICTIONS_FROZEN'
          assert x['outcome_data_read'] is False and x['original_denominator']==54
          assert len(x['variants'])==5
          assert x['model_http_requests']<=270 and x['cost']['estimated_peak_cny']<=5.0
          print('RUN005_V7_ABLATION_SOURCE_VERIFIED')
          PY
      - name: Evaluate A1-A6 against same frozen outcomes
        run: |
          python scripts/run005_v7_evaluate_ablation.py \
            --ablation input/ablation/v7-ablation-predictions.json \
            --outcomes input/outcome/run005-anchor-outcomes.json \
            --output reports/run005-v7/ablation-evaluation.json
      - name: Verify evaluation denominator
        run: |
          python - <<'PY'
          import json
          x=json.load(open('reports/run005-v7/ablation-evaluation.json'))
          assert x['original_denominator']==54
          assert set(x['horizons'])=={'1','3','5'}
          for h,v in x['horizons'].items():
              assert len(v['variants'])==5
              assert v['A6_DETERMINISTIC_MOMENTUM_CONTROL']['model_http_requests']==0
              for name,r in v['variants'].items():
                  assert r['ranked_count']+r['isolated_count']==54
          print('RUN005_V7_EVALUATION_VERIFIED')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: run005-v7-ablation-evaluation-r1
          path: reports/run005-v7/
          if-no-files-found: error
          retention-days: 14
