name: DSA Run058A first O native paid micro-batch

on:
  push:
    branches: [research/run058a-o-native-child-20260918]
    paths:
      - .github/workflows/105-run058a-o-native-child.yml
      - docs/runtime/RUN058A_SCOPE.json

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-run058a-o-native-child
  cancel-in-progress: false

jobs:
  native-child:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'

    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deterministic and native dependencies
        run: pip install -r research/requirements.txt pytest httpx deepseek-recipe==0.1.1

      - name: Run bounded native safety tests
        working-directory: research
        run: |
          python -m pytest --noconftest -q \
            tests/test_native_model_configuration.py \
            tests/test_o_provider_completion.py \
            tests/test_private_multipart.py \
            tests/test_dsa_drive_recovery_regressions.py \
            tests/test_member_history_window.py \
            tests/test_hk_member_preflight.py \
            tests/test_bounded_native_members.py \
            tests/test_o_native_input_contract.py \
            tests/test_run_hk_original_model_probe_imports.py \
            tests/test_deepseek_flash_cap010_guard.py \
            tests/test_o_release_quote_semantics.py \
            tests/test_o_release_gate_contract.py

      - name: Verify immutable child scope and controller selection
        run: |
          python - <<'PY'
          import json
          s=json.load(open('research/docs/runtime/RUN058A_SCOPE.json'))
          c=json.load(open('research/docs/runtime/RUN058_O_ROLLOUT_CONTROLLER.json'))
          assert s['run_id']=='TRI-DSA-O-NATIVE-20260917-058A'
          assert s['micro_batch_id']=='O57-MB-001'
          assert s['tranche_id']=='O57-TR-01'
          assert s['codes']==['00001','00002']
          assert s['codes']==c['selected_child']['codes']
          assert c['selected_child']['micro_batch_id']=='O57-MB-001'
          assert s['maximum_requests']==2
          assert s['maximum_cost_cny']=='0.20'
          assert s['per_member_cap_cny']=='0.10'
          assert s['provider_send_authorized'] is True
          assert s['automatic_retry'] is False
          assert s['no_orders'] is True and s['no_signal_publish'] is True
          assert set(s['codes']).isdisjoint(set(s['no_repeat_codes']))
          print('RUN058A_SCOPE_PASS')
          PY

      - uses: actions/download-artifact@v4
        with:
          run-id: 35224980615
          github-token: ${{ github.token }}
          name: RUN049_PUBLIC_CLOSE_AND_GATE_EVIDENCE
          path: parent

      - name: Bind exact 2026-09-17 O660 history cache
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN058A_SCOPE.json'))
          matches=[]
          for p in Path('parent').rglob('market-history.json'):
              h=hashlib.sha256(p.read_bytes()).hexdigest()
              if h==s['history_cache_sha256']:
                  matches.append(p)
          assert len(matches)==1, (len(matches), [str(x) for x in matches])
          p=matches[0]
          d=json.loads(p.read_text())
          histories=d.get('histories') or {}
          assert '00001' in histories or 'hk00001' in histories
          assert '00002' in histories or 'hk00002' in histories
          Path('/tmp/history-path').write_text(str(p.resolve()))
          print(json.dumps({'history_cache_sha256':s['history_cache_sha256'],'history_path':str(p)}))
          PY

      - name: Execute at most one provider request per selected member
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: |
          python research/scripts/run_hk_bounded_native_members.py \
            --checkout original \
            --cache "$(cat /tmp/history-path)" \
            --scope research/docs/runtime/RUN058A_SCOPE.json \
            --out /tmp/run058a

      - name: Reconcile child result fail-closed
        if: always()
        run: |
          python - <<'PY'
          import json
          from decimal import Decimal
          from pathlib import Path
          out=Path('/tmp/run058a')
          p=out/'SANITIZED_RESULT.json'
          if not p.exists():
              rec={
                'schema_version':1,
                'run_id':'TRI-DSA-O-NATIVE-20260917-058A',
                'state':'STOP_TRANCHE',
                'reason':'SANITIZED_RESULT_MISSING',
                'codes':['00001','00002'],
                'qualified_signals':0,
                'orders':0,
                'automatic_retry':False,
              }
          else:
              d=json.loads(p.read_text())
              members=d.get('members') or []
              assert [x.get('code') for x in members]==['00001','00002'][:len(members)]
              assert d.get('model_http_requests_confirmed',0)<=2
              assert d.get('model_http_requests_possible',0)<=2
              assert d.get('qualified_signals')==0
              assert d.get('formal_pool_top3_generated') is False
              assert d.get('simulation_ledger_writes')==0
              assert Decimal(d['maximum_cost_cny'])==Decimal('0.20')
              accepted={
                'PASS_NATIVE_AUTOMATED_PENDING_MANUAL_REVIEW',
                'PASS_WITH_VERSIONED_RELEASE_ADAPTER_PENDING_MANUAL_REVIEW',
              }
              full_two=len(members)==2
              all_private=full_two and all((x.get('private_persistence') or {}).get('save_read_hash_restore') for x in members)
              all_accepted=full_two and all(x.get('status') in accepted for x in members)
              state='ACCEPTED_NATIVE' if (all_private and all_accepted) else 'STOP_TRANCHE'
              rec={
                'schema_version':1,
                'run_id':'TRI-DSA-O-NATIVE-20260917-058A',
                'state':state,
                'codes':['00001','00002'],
                'attempted_members':len(members),
                'member_statuses':[{k:x.get(k) for k in ('code','status','raw_gate','raw_blockers','model_http_requests_confirmed','model_http_requests_possible','usage_peak_estimate_cny','observed_balance_change_cny')} for x in members],
                'model_http_requests_confirmed':d.get('model_http_requests_confirmed',0),
                'model_http_requests_possible':d.get('model_http_requests_possible',0),
                'maximum_cost_cny':'0.20',
                'actual_attributable_charge_cny':d.get('actual_attributable_charge_cny'),
                'private_final_roundtrip_all':all_private,
                'formal_pool_top3_generated':False,
                'qualified_signals':0,
                'orders':0,
                'simulation_ledger_writes':0,
                'manual_review_required':True,
                'automatic_retry':False,
                'next':'Advance controller only after this child is recorded and reconciled.' if state=='ACCEPTED_NATIVE' else 'Freeze tranche; diagnose this child without automatic retry.',
              }
          Path('/tmp/RUN058A_CHILD_RECONCILIATION.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(rec,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RUN058A_SANITIZED_CHILD
          path: |
            /tmp/run058a/SANITIZED_RESULT.json
            /tmp/RUN058A_CHILD_RECONCILIATION.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit only sanitized child reconciliation
        if: always()
        working-directory: research
        run: |
          set -euo pipefail
          test -f /tmp/RUN058A_CHILD_RECONCILIATION.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          cp /tmp/RUN058A_CHILD_RECONCILIATION.json docs/runtime/RUN058A_CHILD_RECONCILIATION.json
          if test -f /tmp/run058a/SANITIZED_RESULT.json; then
            cp /tmp/run058a/SANITIZED_RESULT.json docs/runtime/RUN058A_SANITIZED_RESULT.json
            git add docs/runtime/RUN058A_SANITIZED_RESULT.json
          fi
          git add docs/runtime/RUN058A_CHILD_RECONCILIATION.json
          if git diff --cached --quiet; then
            echo 'No Run058A receipt changes'
          else
            git commit -m 'dsa: record Run058A first O native micro-batch'
            git push
          fi
