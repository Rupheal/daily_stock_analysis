name: DSA Run058D zero-model target-session O preflight

on:
  push:
    branches: [research/run058d-o-target-preflight-20260918]
    paths:
      - .github/workflows/108-run058d-o-target-preflight.yml
      - scripts/prepare_hk_pool_rollout_preflight_v2.py
      - tests/test_hk_pool_rollout_preflight_v2.py
      - docs/runtime/RUN058D_SCOPE.json

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-run058d-o-target-preflight
  cancel-in-progress: false

jobs:
  target-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install deterministic dependencies
        run: pip install -r research/requirements.txt pytest requests

      - name: Run v2 target-session preflight tests
        working-directory: research
        run: python -m pytest --noconftest -q tests/test_hk_pool_rollout_preflight_v2.py

      - name: Verify zero-model scope
        run: |
          python - <<'PY'
          import json
          s=json.load(open('research/docs/runtime/RUN058D_SCOPE.json'))
          assert s['model_http_requests']==0 and s['provider_send_authorized'] is False
          assert s['DeepSeek_API_cost_cny']==0 and s['automatic_retry'] is False
          assert s['codes']==['00001','00002']
          print('RUN058D_ZERO_MODEL_SCOPE_PASS')
          PY

      - uses: actions/download-artifact@v4
        with:
          run-id: 35224980615
          github-token: ${{ github.token }}
          name: RUN049_PUBLIC_CLOSE_AND_GATE_EVIDENCE
          path: parent

      - name: Bind exact Run049 O660 history
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN058D_SCOPE.json'))
          matches=[]
          for p in Path('parent').rglob('market-history.json'):
              if hashlib.sha256(p.read_bytes()).hexdigest()==s['native_history_sha256']: matches.append(p)
          assert len(matches)==1
          d=json.loads(matches[0].read_text())
          assert d['schema']=='DSA_PUBLIC_MARKET_HISTORY_v1' and d['target_session']=='2026-09-17'
          Path('/tmp/o-history').write_text(str(matches[0].resolve()))
          PY

      - name: Run free v2 target-session preflights
        run: |
          set +e
          mkdir -p /tmp/run058d
          python research/scripts/prepare_hk_pool_rollout_preflight_v2.py \
            --code 00001 --target 2026-09-17 \
            --universe research/docs/runtime/run032_public_cache/O_UNIVERSE.json \
            --cache "$(cat /tmp/o-history)" \
            --plan research/docs/runtime/RUN057_O_NATIVE_PLAN.json \
            --out /tmp/run058d/00001
          rc1=$?
          python research/scripts/prepare_hk_pool_rollout_preflight_v2.py \
            --code 00002 --target 2026-09-17 \
            --universe research/docs/runtime/run032_public_cache/O_UNIVERSE.json \
            --cache "$(cat /tmp/o-history)" \
            --plan research/docs/runtime/RUN057_O_NATIVE_PLAN.json \
            --out /tmp/run058d/00002
          rc2=$?
          printf '%s %s\n' "$rc1" "$rc2" > /tmp/run058d/rc.txt
          exit 0

      - name: Build selective fail-closed receipt
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          root=Path('/tmp/run058d');rcs=[int(x) for x in (root/'rc.txt').read_text().split()]
          rows=[]
          for code,rc in zip(['00001','00002'],rcs):
              p=root/code/'preflight.json';f=root/code/'FREE_PREFLIGHT_STATUS.json'
              if rc==0 and p.exists():
                  d=json.loads(p.read_text())
                  rows.append({
                    'code':code,'status':'PASS_POOL_TARGET_PREFLIGHT_V2',
                    'preflight_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
                    'target':d['target'],
                    'native_history_count':d['native_history_window']['count'],
                    'historical_mismatch_sessions':d['price_reconciliation']['historical_cross_provider_diagnostic']['ohlc_mismatch_sessions'],
                    'target_volume_status':d['price_reconciliation']['fresh_target_session']['volume']['latest_status'],
                    'news_search_performed':d['news_search_performed'],
                  })
              else:
                  reason='UNKNOWN_FREE_PREFLIGHT_FAILURE'
                  if f.exists(): reason=json.loads(f.read_text()).get('reason') or reason
                  rows.append({'code':code,'status':'FAIL_POOL_TARGET_PREFLIGHT_V2','reason':reason})
          c1=next(x for x in rows if x['code']=='00001')
          c2=next(x for x in rows if x['code']=='00002')
          expected=(c1['status']=='PASS_POOL_TARGET_PREFLIGHT_V2' and c2.get('reason')=='TARGET_SESSION_VOLUME_OUTSIDE_CALIBRATED_BOUND')
          out={
            'schema_version':1,
            'run_id':'TRI-DSA-O-TARGET-PREFLIGHT-20260918-058D',
            'state':'PASS_SELECTIVE_FAIL_CLOSED' if expected else 'STOP_TRANCHE_UNEXPECTED_PREFLIGHT_RESULT',
            'members':rows,
            'ready_for_new_paid_child':['00001'] if expected else [],
            'session_preflight_isolated':['00002'] if expected else ['00001','00002'],
            'model_http_requests':0,'DeepSeek_API_cost_cny':0,'paid_data_calls':0,
            'real_orders':0,'simulation_writes':0,'automatic_retry':False,
            'next':'Create one immutable paid child for 00001 only; never retry 00002 for this target session.' if expected else 'Keep tranche frozen and inspect unexpected free-preflight result.',
          }
          Path('/tmp/RUN058D_RESULT.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: RUN058D_TARGET_PREFLIGHT
          path: |
            /tmp/RUN058D_RESULT.json
            /tmp/run058d/00001/preflight.json
            /tmp/run058d/00001/FREE_PREFLIGHT_STATUS.json
            /tmp/run058d/00002/preflight.json
            /tmp/run058d/00002/FREE_PREFLIGHT_STATUS.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit sanitized Run058D receipt
        working-directory: research
        run: |
          set -euo pipefail
          cp /tmp/RUN058D_RESULT.json docs/runtime/RUN058D_RESULT.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime/RUN058D_RESULT.json
          if git diff --cached --quiet; then echo 'No Run058D changes'; else
            git commit -m 'dsa: record Run058D target-session preflight'
            git push
          fi
