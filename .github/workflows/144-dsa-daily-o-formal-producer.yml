name: DSA Daily O Formal Producer

on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - docs/runtime/DSA_DAILY_FORMAL_TRIGGER.json
  workflow_dispatch:
    inputs:
      target_session:
        description: XHKG target session YYYY-MM-DD
        required: true
        type: string
      dry_run:
        description: Model-free preflight only
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-daily-o-formal-producer
  cancel-in-progress: false

jobs:
  produce:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    env:
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      REAL_ORDERS_AUTHORIZED: 'false'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
      DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
      DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
      DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
      DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
      DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/native-private-execution-20260914
          path: research
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}
      - name: Install bounded runtime
        run: pip install -r research/requirements.txt pytest openpyxl requests httpx exchange-calendars deepseek-recipe==0.1.1
      - name: Resolve trigger
        id: trigger
        working-directory: research
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TARGET: ${{ inputs.target_session }}
          INPUT_DRY: ${{ inputs.dry_run }}
        run: |
          python - <<'PY'
          import json,os,subprocess,sys
          from pathlib import Path
          if os.environ['EVENT_NAME']=='push':
              t=json.load(open('docs/runtime/DSA_DAILY_FORMAL_TRIGGER.json'))
              target=t['target_session'];dry=bool(t.get('dry_run',False));enabled=bool(t.get('O_enabled',True))
          else:
              target=os.environ['INPUT_TARGET'];dry=str(os.environ.get('INPUT_DRY','true')).lower()=='true';enabled=True
              t={'schema_version':1,'arm_token':'DSA_DAILY_FORMAL_v1','armed':True,'target_session':target,'nonce':'manual-'+target}
          Path('/tmp/trigger.json').write_text(json.dumps(t))
          if enabled:
              subprocess.check_call([sys.executable,'scripts/dsa_daily_formal_trigger_v1.py','--trigger','/tmp/trigger.json','--out','/tmp/trigger-validated.json'])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('target='+target+'\n');f.write('dry='+str(dry).lower()+'\n');f.write('enabled='+str(enabled).lower()+'\n')
          PY
      - name: Build current official snapshot
        if: steps.trigger.outputs.enabled == 'true'
        working-directory: research
        run: python scripts/dsa_daily_market_snapshot_v1.py --session "${{ steps.trigger.outputs.target }}" --u-universe docs/dsa-u-universe.json --out /tmp/daily-snapshot
      - name: Run O daily producer
        if: steps.trigger.outputs.enabled == 'true'
        working-directory: research
        run: |
          DRY=""
          if [ "${{ steps.trigger.outputs.dry }}" = "true" ]; then DRY="--dry-run"; fi
          python scripts/dsa_daily_o_production_v1.py --research-root . --original-root ../original --target-session "${{ steps.trigger.outputs.target }}" --snapshot-dir /tmp/daily-snapshot --out /tmp/daily-o $DRY
      - name: Persist sanitized O status/formal receipt
        if: always() && steps.trigger.outputs.enabled == 'true'
        working-directory: research
        run: |
          set -euo pipefail
          test -f /tmp/daily-o/STATUS.json || exit 1
          cp /tmp/daily-o/STATUS.json docs/runtime/O_DAILY_GENERATION_STATUS_LATEST.json
          python - <<'PY'
          import json,shutil
          from pathlib import Path
          p=Path('/tmp/daily-o/O_FORMAL.json')
          if p.exists():
              d=json.load(open(p))
              if d.get('status')=='ACCEPTED_O_FORMAL_TOP3':
                  shutil.copy(p,'docs/runtime/O_PRODUCTION_FORMAL_LATEST.json')
          PY
          git add docs/runtime/O_DAILY_GENERATION_STATUS_LATEST.json docs/runtime/O_PRODUCTION_FORMAL_LATEST.json 2>/dev/null || true
          git config user.name 'dsa-daily-o'
          git config user.email 'dsa-daily-o@users.noreply.github.com'
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "dsa: daily O formal status ${{ steps.trigger.outputs.target }}"
          git pull --rebase origin fix/native-private-execution-20260914
          git push origin HEAD:fix/native-private-execution-20260914
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: DSA_DAILY_O_FORMAL_${{ github.run_id }}
          path: /tmp/daily-o/
          if-no-files-found: warn
          retention-days: 30
