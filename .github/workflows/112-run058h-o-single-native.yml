name: DSA Run058H single O native provider child

on:
  push:
    branches: [research/run058h-o-single-native-20260918]
    paths:
      - .github/workflows/112-run058h-o-single-native.yml
      - docs/runtime/RUN058H_SCOPE.json
      - scripts/run058h_single_native.py
      - scripts/build_run058_o_rollout_controller_v2.py
      - tests/test_run058_o_rollout_controller_v2.py

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-run058h-o-single-native-paid
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'

    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          fetch-depth: 0

      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false

      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - uses: actions/setup-python@v6
        with: {python-version: '3.11'}

      - name: Install deterministic and native dependencies
        run: pip install -r research/requirements.txt pytest httpx requests deepseek-recipe==0.1.1

      - name: Compile and run fail-closed tests
        working-directory: research
        run: |
          python -m py_compile scripts/run058h_single_native.py scripts/build_run058_o_rollout_controller_v2.py scripts/o_frozen_history_retrieval_adapter.py scripts/run_hk_original_model_probe_run058g.py
          python -m pytest --noconftest -q             tests/test_run058_o_rollout_controller_v2.py             tests/test_hk_pool_rollout_preflight_v2.py             tests/test_native_model_configuration.py             tests/test_o_provider_completion.py             tests/test_private_multipart.py             tests/test_dsa_drive_recovery_regressions.py             tests/test_bounded_native_members.py             tests/test_o_native_input_contract.py             tests/test_deepseek_flash_cap010_guard.py             tests/test_o_release_quote_semantics.py             tests/test_o_release_gate_contract.py

      - name: Bind Run058G dry acceptance and immutable paid scope
        working-directory: research
        run: |
          python - <<'PY'
          import json
          s=json.load(open('docs/runtime/RUN058H_SCOPE.json'))
          g=json.load(open('docs/runtime/RUN058G_RESULT.json'))
          d=json.load(open('docs/runtime/RUN058D_RESULT.json'))
          assert s['run_id']=='TRI-DSA-O-NATIVE-20260918-058H'
          assert s['code']=='00001' and s['peer_session_isolated_code']=='00002'
          assert s['maximum_requests']==1 and s['maximum_cost_cny']=='0.10'
          assert s['provider_send_authorized'] is True and s['automatic_retry'] is False
          assert s['no_orders'] is True and s['no_signal_publish'] is True
          assert g['exact_history_contract_pass'] is True
          assert g['model_http_requests']==0 and g['drive_claims']==0 and g['DeepSeek_API_cost_cny']==0
          assert g['frozen_history_audit']['rows_replayed']==44
          assert d['ready_for_new_paid_child']==['00001']
          assert d['session_preflight_isolated']==['00002']
          print('RUN058H_PREAUTH_PASS')
          PY

      - uses: actions/download-artifact@v4
        with:
          run-id: 35224980615
          github-token: ${{ github.token }}
          name: RUN049_PUBLIC_CLOSE_AND_GATE_EVIDENCE
          path: parent

      - name: Bind exact 2026-09-17 O660 history cache
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN058H_SCOPE.json'))
          m=[p for p in Path('parent').rglob('market-history.json') if hashlib.sha256(p.read_bytes()).hexdigest()==s['history_cache_sha256']]
          assert len(m)==1
          d=json.loads(m[0].read_text())
          assert d['target_session']=='2026-09-17' and 'hk00001' in (d.get('histories') or {})
          Path('/tmp/history-path').write_text(str(m[0].resolve()))
          print('RUN058H_HISTORY_BIND_PASS')
          PY

      - name: Execute one authorized provider slot with Drive claim and private persistence
        working-directory: research
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: |
          python scripts/run058h_single_native.py             --checkout ../original             --cache "$(cat /tmp/history-path)"             --scope docs/runtime/RUN058H_SCOPE.json             --plan docs/runtime/RUN057_O_NATIVE_PLAN.json             --out /tmp/run058h

      - name: Reconcile append-only MB-001 and run controller v2
        if: always()
        working-directory: research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/run058h/SANITIZED_RESULT.json')
          result=json.loads(p.read_text()) if p.exists() else {'members':[],'accepted_member':False,'model_http_requests_confirmed':0,'model_http_requests_possible':0}
          member=(result.get('members') or [{}])[0]
          accepted=result.get('accepted_member') is True
          row={
            'run_id':'TRI-DSA-O-NATIVE-20260918-058H',
            'micro_batch_id':'O57-MB-001',
            'codes':['00001','00002'],
            'status':'STOP_TRANCHE',
            'member_outcomes':{
              '00001':{
                'status':member.get('status'),
                'fresh_preflight_status':member.get('fresh_preflight_status'),
                'model_http_requests_confirmed':member.get('model_http_requests_confirmed',0),
                'model_http_requests_possible':member.get('model_http_requests_possible',0),
                'claim_persisted':member.get('claim_persisted',False),
                'pre_send_upper_cny':member.get('pre_send_upper_cny'),
                'usage_peak_estimate_cny':member.get('usage_peak_estimate_cny'),
                'observed_balance_change_cny':member.get('observed_balance_change_cny'),
                'pre_send_private_roundtrip':(member.get('pre_send_private_persistence') or {}).get('save_read_hash_restore') is True,
                'private_final_roundtrip':(member.get('private_persistence') or {}).get('save_read_hash_restore') is True,
                'provider_completion':member.get('provider_completion'),
                'raw_gate':member.get('raw_gate'),'raw_blockers':member.get('raw_blockers'),
                'failure_class':member.get('failure_class'),'failure_code':member.get('failure_code')
              },
              '00002':{'status':'TARGET_SESSION_ISOLATED','reason':'TARGET_SESSION_VOLUME_OUTSIDE_CALIBRATED_BOUND','provider_request_permitted':False}
            },
            'model_http_requests_confirmed':result.get('model_http_requests_confirmed',0),
            'model_http_requests_possible':result.get('model_http_requests_possible',0),
            'maximum_cost_cny':'0.10','actual_attributable_charge_cny':result.get('actual_attributable_charge_cny'),
            'automatic_retry':False
          }
          if accepted:
            row.update({'resolution_status':'RAW_GATE_BLOCK','resolution_verified':True,'resolution_run_id':'TRI-DSA-O-NATIVE-20260918-058H'})
          ledger=Path('docs/runtime/RUN058_O_ROLLOUT_LEDGER.jsonl')
          with ledger.open('a',encoding='utf-8') as f:f.write(json.dumps(row,ensure_ascii=False,separators=(',',':'))+'\n')
          rec={'schema_version':2,'run_id':'TRI-DSA-O-NATIVE-20260918-058H',
               'state':'RESOLVED_APPEND_ONLY' if accepted else 'STOP_TRANCHE',
               'accepted_member':accepted,'ledger_row':row,
               'orders':0,'simulation_ledger_writes':0,'automatic_retry':False}
          Path('/tmp/RUN058H_RECONCILIATION.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(rec,ensure_ascii=False))
          PY

          python scripts/build_run058_o_rollout_controller_v2.py             --scope docs/runtime/RUN058_SCOPE.json             --plan docs/runtime/RUN057_O_NATIVE_PLAN.json             --ledger docs/runtime/RUN058_O_ROLLOUT_LEDGER.jsonl             --output /tmp/RUN058_NEXT_CONTROLLER_V2.json

          python - <<'PY'
          import json
          r=json.load(open('/tmp/RUN058H_RECONCILIATION.json'))
          c=json.load(open('/tmp/RUN058_NEXT_CONTROLLER_V2.json'))
          if r['accepted_member']:
              assert c['state']=='READY_CHILD_ENVELOPE'
              assert c['selected_child']['micro_batch_id']=='O57-MB-002'
              assert c['selected_child']['codes']==['00003','00004']
              assert c['selected_child']['provider_send_authorized_by_run058'] is False
          else:
              assert c['state']=='HOLD_NO_CHILD'
          print(json.dumps({'accepted_member':r['accepted_member'],'next_state':c['state'],'selected_child':c.get('selected_child')},ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RUN058H_SANITIZED_NATIVE_AND_CONTROLLER
          path: |
            /tmp/run058h/SANITIZED_RESULT.json
            /tmp/RUN058H_RECONCILIATION.json
            /tmp/RUN058_NEXT_CONTROLLER_V2.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit sanitized Run058H receipt, append-only ledger, and next controller
        if: always()
        working-directory: research
        run: |
          set -euo pipefail
          test -f /tmp/RUN058H_RECONCILIATION.json
          test -f /tmp/RUN058_NEXT_CONTROLLER_V2.json
          if test -f /tmp/run058h/SANITIZED_RESULT.json; then cp /tmp/run058h/SANITIZED_RESULT.json docs/runtime/RUN058H_SANITIZED_RESULT.json; fi
          cp /tmp/RUN058H_RECONCILIATION.json docs/runtime/RUN058H_RECONCILIATION.json
          cp /tmp/RUN058_NEXT_CONTROLLER_V2.json docs/runtime/RUN058_NEXT_CONTROLLER_V2.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/runtime/RUN058H_RECONCILIATION.json docs/runtime/RUN058_NEXT_CONTROLLER_V2.json docs/runtime/RUN058_O_ROLLOUT_LEDGER.jsonl
          test ! -f docs/runtime/RUN058H_SANITIZED_RESULT.json || git add docs/runtime/RUN058H_SANITIZED_RESULT.json
          if git diff --cached --quiet; then echo no-change; else git commit -m 'dsa: record Run058H native receipt and controller v2'; git push; fi
