name: DSA Run058N single O native paid child 00004

on:
  push:
    branches: [research/run058n-o-00004-native-20260918]
    paths:
      - .github/workflows/118-run058n-o-00004-native.yml
      - docs/runtime/RUN058N_SCOPE.json

permissions:
  contents: write
  actions: read

concurrency:
  group: dsa-run058n-o-00004-native
  cancel-in-progress: false

jobs:
  native:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: ${{ github.workspace }}/research:${{ github.workspace }}/research/scripts
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      BACKTEST_ENABLED: 'false'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      AGENT_MODE: 'false'
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          fetch-depth: 0
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-recipe
          ref: 8cadfede7063c896b944e7bae05daa3549ae97ea
          path: deepseek-recipe
          sparse-checkout: static/tokenizers/v41/tokenizer.json
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies and verify scope
        run: pip install -r research/requirements.txt pytest httpx requests deepseek-recipe==0.1.1

      - name: Run safety tests and bind dry acceptance
        working-directory: research
        run: |
          python -m pytest --noconftest -q             tests/test_o_frozen_native_history_adapter.py             tests/test_o_native_input_contract.py             tests/test_bounded_native_members.py             tests/test_bounded_native_members_v2.py             tests/test_deepseek_flash_cap010_guard.py             tests/test_o_provider_completion.py             tests/test_private_multipart.py             tests/test_dsa_drive_recovery_regressions.py             tests/test_o_release_gate_contract.py
          python - <<'PY'
          import json
          s=json.load(open('docs/runtime/RUN058N_SCOPE.json'))
          m=json.load(open('docs/runtime/RUN058M_RESULT.json'))
          k=json.load(open('docs/runtime/RUN058K_RESULT.json'))
          assert s['codes']==['00004'] and s['maximum_requests']==1 and s['maximum_cost_cny']=='0.10'
          assert s['frozen_native_history_adapter'] is True
          assert s['prior_model_http_requests_confirmed_for_code']==0
          assert s['automatic_retry'] is False and s['no_orders'] is True
          assert m['code']=='00003' and m['disposition']=='PERMANENT_ISOLATE_NO_RETRY'
          row=next(x for x in k['members'] if x['code']=='00004')
          assert row['status']=='PASS_FROZEN_HISTORY_DRY'
          assert row['pre_send_peak_upper_cny']=='0.079806'
          print('RUN058N_SCOPE_PASS')
          PY

      - uses: actions/download-artifact@v4
        with:
          run-id: 35224980615
          github-token: ${{ github.token }}
          name: RUN049_PUBLIC_CLOSE_AND_GATE_EVIDENCE
          path: parent

      - name: Bind exact O660 history
        run: |
          python - <<'PY'
          import hashlib,json
          from pathlib import Path
          s=json.load(open('research/docs/runtime/RUN058N_SCOPE.json'))
          matches=[p for p in Path('parent').rglob('market-history.json') if hashlib.sha256(p.read_bytes()).hexdigest()==s['history_cache_sha256']]
          assert len(matches)==1
          d=json.loads(matches[0].read_text())
          assert d['target_session']==s['target_session'] and 'hk00004' in (d.get('histories') or {})
          Path('/tmp/history-path').write_text(str(matches[0].resolve()))
          print('RUN058N_HISTORY_BIND_PASS')
          PY

      - name: Execute one bounded provider request for 00004
        working-directory: research
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
          DSA_DEEPSEEK_V41_TOKENIZER: ${{ github.workspace }}/deepseek-recipe/static/tokenizers/v41/tokenizer.json
        run: |
          python scripts/run_hk_bounded_native_members.py             --checkout ../original             --cache "$(cat /tmp/history-path)"             --scope docs/runtime/RUN058N_SCOPE.json             --out /tmp/run058n

      - name: Build sanitized reconciliation
        if: always()
        working-directory: research
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('/tmp/run058n/SANITIZED_RESULT.json')
          if not p.exists():
              rec={'schema_version':1,'run_id':'TRI-DSA-O-NATIVE-20260918-058N','state':'STOP_MEMBER','code':'00004',
                   'model_http_requests_confirmed':0,'model_http_requests_possible':0,'automatic_retry':False,'rollout_ledger_advanced':False}
          else:
              d=json.loads(p.read_text());m=d.get('members') or []
              assert len(m)<=1 and [x.get('code') for x in m]==['00004'][:len(m)]
              assert d.get('model_http_requests_confirmed',0)<=1 and d.get('model_http_requests_possible',0)<=1
              x=m[0] if m else {}
              priv=bool((x.get('private_persistence') or {}).get('save_read_hash_restore'))
              sent=x.get('model_http_requests_confirmed')==1
              rec={'schema_version':1,'run_id':'TRI-DSA-O-NATIVE-20260918-058N',
                   'state':'PENDING_PRIVATE_SEMANTIC_REVIEW' if sent and priv else 'STOP_MEMBER',
                   'code':'00004','member_status':{k:x.get(k) for k in (
                     'status','raw_gate','raw_blockers','model_http_requests_confirmed','model_http_requests_possible',
                     'usage_peak_estimate_cny','observed_balance_change_cny','preflight_sha256','frozen_native_history_adapter'
                   )},
                   'model_http_requests_confirmed':d.get('model_http_requests_confirmed',0),
                   'model_http_requests_possible':d.get('model_http_requests_possible',0),
                   'maximum_cost_cny':'0.10','actual_attributable_charge_cny':d.get('actual_attributable_charge_cny'),
                   'private_final_roundtrip':priv,'qualified_signals':0,'orders':0,'simulation_ledger_writes':0,
                   'automatic_retry':False,'rollout_ledger_advanced':False,
                   'next':'Private semantic review; never retry this sent member.' if sent else 'Diagnose before any provider send.'
              }
          Path('/tmp/RUN058N_RECONCILIATION.json').write_text(json.dumps(rec,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(rec,ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: RUN058N_SANITIZED_00004_CHILD
          path: |
            /tmp/run058n/SANITIZED_RESULT.json
            /tmp/RUN058N_RECONCILIATION.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit sanitized receipts
        if: always()
        working-directory: research
        run: |
          set -euo pipefail
          cp /tmp/RUN058N_RECONCILIATION.json docs/runtime/RUN058N_RECONCILIATION.json
          git add docs/runtime/RUN058N_RECONCILIATION.json
          if test -f /tmp/run058n/SANITIZED_RESULT.json; then
            cp /tmp/run058n/SANITIZED_RESULT.json docs/runtime/RUN058N_SANITIZED_RESULT.json
            git add docs/runtime/RUN058N_SANITIZED_RESULT.json
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --cached --quiet; then echo no-change; else
            git commit -m 'dsa: record Run058N 00004 paid child'
            git push
          fi
