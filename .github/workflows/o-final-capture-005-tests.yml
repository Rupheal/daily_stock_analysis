name: O final capture 005 model-free acceptance
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - scripts/run_hk_original_model_probe.py
      - scripts/o_post_output_contract.py
      - scripts/o_semantic_handoff_contract.py
      - scripts/o_capture_stage_provenance.py
      - tests/test_o_final_capture_observer_integration.py
      - .github/workflows/o-final-capture-005-tests.yml
permissions:
  contents: read
jobs:
  final-capture:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install deterministic test dependency only
        run: pip install pytest
      - name: Assert no model credentials are exposed
        run: |
          python - <<'PY'
          import os
          forbidden=[k for k in os.environ if k.startswith('LLM_') or 'DEEPSEEK' in k or 'OPENAI_API_KEY' in k or 'DSA_DRIVE_' in k]
          assert not forbidden, forbidden
          print('{"model_credentials_present":false,"model_requests":0,"runtime_activated":false}')
          PY
      - name: Prove actual observer final-pipeline capture
        run: python -m pytest --noconftest -q tests/test_o_final_capture_observer_integration.py
