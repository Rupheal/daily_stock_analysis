name: DSA Run076 retired final O657 accepted
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - '.github/workflows/134-run076-o657-final-acceptance.yml'

permissions:
  contents: read

concurrency:
  group: dsa-run076-o657-final-acceptance
  cancel-in-progress: true

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Final acceptance already frozen
        run: |
          echo "RUN076_RETIRED=1"
          echo "FINAL_O657_ACCEPTED=1"
          echo "MODEL_HTTP_REQUESTS_ADDED=0"
          echo "PROVIDER_CALLS_ADDED=0"
          echo "REAL_ORDERS=0"
          echo "SIMULATION_WRITES=0"
