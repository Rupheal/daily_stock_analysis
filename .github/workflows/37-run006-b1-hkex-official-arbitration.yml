name: Run006 B1 official HKEX arbitration

on:
  push:
    branches: [trident/run004-fullpool-pit]
    paths: [run006_b1_hkex_arbitration_trigger.json]

permissions:
  contents: read
  actions: read

jobs:
  arbitrate-official:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify free trigger and syntax
        run: |
          python - <<'PY'
          import json,os,py_compile
          if os.environ.get('GITHUB_RUN_ATTEMPT')!='1': raise SystemExit('rerun prohibited')
          t=json.load(open('run006_b1_hkex_arbitration_trigger.json'))
          assert t['run_id']=='TRI-DSA-DAT-20260914-006-R3-HKEX-ARBITRATION'
          assert t['paid_resources'] is False and t['model_calls_authorized'] is False
          assert t['track_denominator']==246 and t['frozen_recovery_denominator']==253
          assert t['official_session_count']==21
          py_compile.compile('scripts/run006_hkex_official_arbitration.py',doraise=True)
          print('RUN006_HKEX_TRIGGER_OK')
          PY
      - run: pip install yfinance
      - uses: actions/download-artifact@v4
        with:
          run-id: 34709328183
          name: public-pool-price-checks
          github-token: ${{ github.token }}
          path: input/integrity
      - name: Run official arbitration diagnostic
        run: |
          python scripts/run006_hkex_official_arbitration.py \
            --integrity input/integrity/O-integrity.json \
            --output reports/run006-b1/hkex-arbitration.json \
            --raw-dir reports/run006-b1/hkex-pages \
            --workers 8
      - name: Verify denominator and official-page accounting
        run: |
          python - <<'PY'
          import json
          x=json.load(open('reports/run006-b1/hkex-arbitration.json'))
          assert x['track_denominator']==246 and len(x['rows'])==246
          assert x['summary']['ok']+x['summary']['errors']==246
          assert len(x['official_page_receipts'])==21
          assert x['model_http_requests']==0 and x['paid_data_used'] is False
          for d,r in x['official_page_receipts'].items():
              assert r['parsed_count']>=500 and len(r['sha256'])==64
          print('RUN006_HKEX_ACCOUNTING_OK',x['summary'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: run006-b1-hkex-official-arbitration
          path: reports/run006-b1/
          if-no-files-found: error
          retention-days: 30
