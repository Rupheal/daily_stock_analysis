name: U45 multisource public-news retrieval
on:
  workflow_dispatch:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - 'scripts/probe_u45_news_multisource.py'
      - 'tests/test_u45_news_readiness.py'
      - '.github/workflows/57-u45-news-multisource.yml'
permissions:
  contents: read
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      TZ: Asia/Hong_Kong
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install minimal public-data dependency
        run: pip install requests
      - name: Deterministic readiness and dedupe tests
        run: python -m unittest discover -s tests -p 'test_u45_news_readiness.py' -v
      - name: Probe Yahoo and Google News without model or paid data
        run: |
          python scripts/probe_u45_news_multisource.py --universe docs/dsa-u-universe.json --out /tmp/U45_NEWS_MULTISOURCE.json --workers 4 --timeout 18
          python - <<'PY'
          import json
          d=json.load(open('/tmp/U45_NEWS_MULTISOURCE.json'))
          assert d['schema_version']=='U45_NEWS_MULTISOURCE_v1_2'
          assert d['universe_denominator']==45
          assert d['execution_eligible_denominator']==44
          assert d['formal_u_acceptance_added']==0
          assert d['model_http_requests']==0 and d['paid_data_calls']==0
          assert d['members_with_any_provider_parseable']==44
          assert d['retrieval_quality_proven'] is True
          assert d['members_retrieval_ready']==d['members_with_items']
          assert d['members_relevance_ready']==d['members_with_recent_issuer_title_hits']
          assert d['members_event_ready']==0
          assert d['members_formal_news_ready']==0
          assert all(r['event_ready'] is False and r['formal_news_ready'] is False for r in d['rows'])
          assert all(r['retrieval_ready']==r['retrieval_positive'] for r in d['rows'])
          print(json.dumps({k:d[k] for k in ('members_with_any_provider_parseable','members_retrieval_ready','members_relevance_ready','members_event_ready','members_formal_news_ready','duplicate_recent_relevant_items_removed','model_http_requests')}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: U45_NEWS_MULTISOURCE
          path: /tmp/U45_NEWS_MULTISOURCE.json
          if-no-files-found: error
          retention-days: 14
