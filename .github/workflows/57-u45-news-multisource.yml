name: U45 multisource public-news retrieval
on:
  workflow_dispatch:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - 'scripts/probe_u45_news_multisource.py'
      - '.github/workflows/57-u45-news-multisource.yml'
permissions:
  contents: read
jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: '1'
      TZ: Asia/Hong_Kong
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Install minimal public-data dependency
        run: pip install requests
      - name: Probe Yahoo and Google News without model or paid data
        run: |
          python scripts/probe_u45_news_multisource.py --universe docs/dsa-u-universe.json --out /tmp/U45_NEWS_MULTISOURCE.json --workers 4 --timeout 18
          python - <<'PY'
          import json
          d=json.load(open('/tmp/U45_NEWS_MULTISOURCE.json'))
          assert d['universe_denominator']==45
          assert d['execution_eligible_denominator']==44
          assert d['formal_u_acceptance_added']==0
          assert d['model_http_requests']==0 and d['paid_data_calls']==0
          assert d['members_with_any_provider_parseable']==44
          assert d['retrieval_quality_proven'] is True
          print(json.dumps({k:d[k] for k in ('members_with_any_provider_parseable','members_with_both_providers_parseable','members_with_items','yahoo_members_with_items','google_members_with_items','model_http_requests')}))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: U45_NEWS_MULTISOURCE
          path: /tmp/U45_NEWS_MULTISOURCE.json
          if-no-files-found: error
          retention-days: 14
