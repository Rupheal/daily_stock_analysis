name: Dual account deterministic runtime acceptance
on:
  push:
    branches: [fix/dual-account-runtime-20260914]
    paths:
      - src/services/dsa_simulation_ledger.py
      - scripts/dsa_simulation_runtime.py
      - tests/test_dsa_simulation_ledger.py
      - .github/workflows/40-dual-account-runtime.yml
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Synthetic fixture tests only; no secrets or model calls
        run: python -m pytest --noconftest -q tests/test_dsa_simulation_ledger.py tests/test_dsa_prediction_ledger.py
