name: DSA Production Orchestrator v1 simulation runtime

on:
  schedule:
    - cron: '0 1 * * 1-5'    # 09:00 HKT status/readiness
    - cron: '30 8 * * 1-5'   # 16:30 HKT post-close status/readiness
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - 'docs/runtime/DSA_PRODUCTION_RUNTIME_TRIGGER.json'
  workflow_dispatch:
    inputs:
      at_hkt:
        description: 'Evaluation time in HKT ISO8601; leave blank to use runner current time'
        required: false
        type: string
      target_mode:
        description: 'Production cycle'
        required: true
        default: preopen
        type: choice
        options:
          - preopen
          - postclose

permissions:
  contents: write

concurrency:
  group: dsa-production-orchestrator-v1-runtime
  cancel-in-progress: false

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/scripts
      TZ: Asia/Hong_Kong
      DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
      DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
      DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
      DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: fix/native-private-execution-20260914
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install production runtime dependencies
        run: pip install httpx exchange-calendars

      - name: Resolve evaluation time
        id: clock
        env:
          INPUT_AT: ${{ inputs.at_hkt }}
          MODE: ${{ inputs.target_mode }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo
          at=os.environ.get('INPUT_AT','').strip()
          mode=os.environ.get('MODE','').strip()
          from pathlib import Path
          trigger=Path('docs/runtime/DSA_PRODUCTION_RUNTIME_TRIGGER.json')
          if not at and os.environ.get('EVENT_NAME')=='push' and trigger.exists():
              import json
              t=json.loads(trigger.read_text())
              at=str(t.get('at_hkt') or '').strip()
              mode=str(t.get('target_mode') or mode).strip()
          if not at:
              now=datetime.now(ZoneInfo('Asia/Hong_Kong'))
              if not mode:
                  mode='preopen' if now.hour<12 else 'postclose'
              if mode=='preopen': now=now.replace(hour=9,minute=0,second=0,microsecond=0)
              else: now=now.replace(hour=16,minute=30,second=0,microsecond=0)
              at=now.isoformat()
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('at='+at+'\n')
          print('EVALUATION_AT',at)
          PY

      - name: Resolve target session
        id: target
        run: |
          python - <<'PY'
          import os
          from datetime import datetime
          from scripts.o_target_session_contract import resolve_target_session
          from scripts.dsa_production_session_driver_v1 import next_session_after
          at=datetime.fromisoformat("${{ steps.clock.outputs.at }}".replace("Z","+00:00"))
          target=resolve_target_session(at).target_session.isoformat()
          nxt=next_session_after(target)
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('target='+target+'\n')
              f.write('next='+nxt+'\n')
          print('TARGET_SESSION',target,'NEXT_SESSION',nxt)
          PY

      - name: Resolve exact-session formal receipts
        id: receipts
        run: |
          python scripts/dsa_formal_receipt_resolver_v1.py \
            --root . --target-session "${{ steps.target.outputs.target }}" \
            --out /tmp/formal-resolver.json
          python - <<'PY'
          import json,os
          r=json.load(open('/tmp/formal-resolver.json'))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('resolver_state='+r['state']+'\n')
              f.write('o_path='+(r['O']['path'] or '')+'\n')
              f.write('u_path='+(r['U']['path'] or '')+'\n')
          print('FORMAL_RESOLVER',r['state'],r['O']['path'],r['U']['path'])
          PY

      - name: Resolve production session freshness
        if: steps.receipts.outputs.resolver_state == 'READY'
        run: |
          python scripts/dsa_production_session_driver_v1.py \
            --at "${{ steps.clock.outputs.at }}" \
            --o "${{ steps.receipts.outputs.o_path }}" \
            --u "${{ steps.receipts.outputs.u_path }}" \
            --out /tmp/session-route.json

      - name: Load authoritative private simulation journal
        id: journal
        continue-on-error: true
        run: |
          set +e
          python scripts/dsa_simulation_journal_drive.py load --out /tmp/journal.json > /tmp/journal-load.txt
          rc=$?
          set -e
          cat /tmp/journal-load.txt
          python - <<'PY'
          import json,os
          from pathlib import Path
          r=json.loads(Path('/tmp/journal-load.txt').read_text().strip().splitlines()[-1])
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:
              f.write('status='+str(r.get('status'))+'\n')
              f.write('parent_hash='+str(r.get('canonical_hash') or '')+'\n')
          if r.get('status') not in {'JOURNAL_LOADED','JOURNAL_UNCONFIGURED'}:
              raise SystemExit('PRIVATE_JOURNAL_LOAD_FAILED')
          PY

      - name: Build read-only production orchestration status
        run: |
          python - <<'PY'
          import json,subprocess,sys
          from pathlib import Path
          resolver=json.load(open('/tmp/formal-resolver.json'))
          if resolver['state']!='READY':
              out={'schema_version':1,'resolver':resolver,'simulation_write_performed':False,'real_orders':0,
                   'state':'WAIT_FORMAL_RECEIPT_MISSING','reason':'NO_EXACT_SESSION_O_U_RECEIPT'}
          else:
              route=json.load(open('/tmp/session-route.json'))
              out={'schema_version':1,'route':route,'formal_resolver':resolver,
                   'simulation_write_performed':False,'real_orders':0,'runtime_mode':'STATUS_ONLY'}
              if route['state']!='READY_FOR_ORCHESTRATOR':
                  out['state']='WAIT_FORMAL_REFRESH'
                  out['reason']='CURRENT_O_U_FORMAL_RECEIPTS_NOT_BOTH_FRESH'
              else:
                  cmd=[sys.executable,'scripts/dsa_production_orchestrator_v1.py',
                       '--o',resolver['O']['path'],'--u',resolver['U']['path'],
                       '--target-session',route['target_session'],'--now',route['evaluation_time_hkt'],
                       '--next-session',route['next_session'],
                       '--cycle','preopen' if route['window']=='PREOPEN' else 'postclose',
                       '--journal-configured','--out','/tmp/orchestrator.json']
                  subprocess.check_call(cmd)
                  out['orchestrator']=json.load(open('/tmp/orchestrator.json'))
                  out['state']='STATUS_READY_NO_LEDGER_WRITE'
              out['single_writer']='139-dsa-production-entry-v1.yml'
          Path('/tmp/production-runtime-result.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps(out,ensure_ascii=False))
          PY

      - name: Assert status workflow is read-only
        run: |
          echo SIMULATION_WRITES=0
          echo SINGLE_LEDGER_WRITER=139-dsa-production-entry-v1.yml

      - uses: actions/upload-artifact@v4
        with:
          name: DSA_PRODUCTION_ORCHESTRATOR_V1_RUNTIME_SANITIZED
          path: |
            /tmp/session-route.json
            /tmp/production-runtime-result.json
          retention-days: 90

      - name: Publish sanitized runtime receipt
        run: |
          cp /tmp/production-runtime-result.json docs/runtime/DSA_PRODUCTION_ORCHESTRATOR_V1_LAST_RUN.json
          git add docs/runtime/DSA_PRODUCTION_ORCHESTRATOR_V1_LAST_RUN.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+Rupheal@users.noreply.github.com'
          if git diff --cached --quiet; then echo no-change; else
            git commit -m 'dsa: record Production Orchestrator v1 runtime receipt'
            git fetch origin fix/native-private-execution-20260914
            git rebase origin/fix/native-private-execution-20260914
            git push origin HEAD:fix/native-private-execution-20260914
          fi

      - name: Assert simulation-only boundary
        run: |
          echo "REAL_ORDERS=0"
          echo "BROKER_API_CALLS=0"
          echo "AUTO_RECHARGE=0"
