name: Run006 B1 Yahoo raw-vs-adjusted geometry probe

on:
  push:
    branches: [trident/run004-fullpool-pit]
    paths: [run006_b1_geometry_probe_trigger.json]

permissions:
  contents: read
  actions: read

concurrency:
  group: run006-b1-geometry-probe
  cancel-in-progress: false

jobs:
  geometry-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Verify free one-shot trigger and script
        run: |
          python - <<'PY'
          import json, os, py_compile
          if os.environ.get('GITHUB_RUN_ATTEMPT') != '1': raise SystemExit('rerun prohibited; require new reviewed trigger')
          t=json.load(open('run006_b1_geometry_probe_trigger.json'))
          assert t['run_id']=='TRI-DSA-DAT-20260914-006-R1-GEOMETRY-PROBE'
          assert t['paid_resources'] is False and t['model_calls_authorized'] is False
          assert t['frozen_recovery_denominator']==253 and t['geometry_denominator']==114
          py_compile.compile('scripts/run006_probe_yahoo_geometry.py', doraise=True)
          print('RUN006_GEOMETRY_TRIGGER_OK')
          PY
      - run: pip install yfinance
      - name: Download frozen O660 native DB
        uses: actions/download-artifact@v4
        with:
          run-id: 34705950297
          name: original-official-pool-data-and-replay
          github-token: ${{ github.token }}
          path: input/native
      - name: Download frozen independent integrity report
        uses: actions/download-artifact@v4
        with:
          run-id: 34709328183
          name: public-pool-price-checks
          github-token: ${{ github.token }}
          path: input/integrity
      - name: Reverify frozen denominator before network probe
        run: |
          python - <<'PY'
          import json,hashlib,pathlib
          db=pathlib.Path('input/native/O-full/native-data.db')
          if hashlib.sha256(db.read_bytes()).hexdigest()!='f1b50fa459e229455fddadb6fbd23823199ec5ea4927d289f54ad683ed9a045b': raise SystemExit('native DB hash mismatch')
          p=pathlib.Path('input/integrity/O-integrity.json')
          x=json.loads(p.read_text())
          assert x['denominator']==660 and x['passed']==407 and x['isolated']==253
          assert x['reasons']=={'independent_daily_disagreement':132,'ValueError:invalid_daily_geometry':114,'ValueError:missing_latest_session_or_21_bar_history':7}
          print('RUN006_FROZEN_DENOMINATOR_OK')
          PY
      - name: Probe all 114 Yahoo geometry isolates, raw versus auto-adjusted
        run: |
          python scripts/run006_probe_yahoo_geometry.py \
            --integrity input/integrity/O-integrity.json \
            --db input/native/O-full/native-data.db \
            --output reports/run006-b1/geometry-probe.json \
            --workers 6
      - name: Verify diagnostic accounting
        run: |
          python - <<'PY'
          import json
          x=json.load(open('reports/run006-b1/geometry-probe.json'))
          assert x['track_denominator']==114 and len(x['rows'])==114
          assert sum(x['classification_counts'].values())==114
          assert x['model_http_requests']==0 and x['paid_data_used'] is False
          print('RUN006_GEOMETRY_ACCOUNTING_OK',x['classification_counts'])
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: run006-b1-geometry-probe
          path: reports/run006-b1/
          if-no-files-found: error
          retention-days: 30
