name: Drive evidence readiness and synthetic restore
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - scripts/dsa_drive_*.py
      - tests/test_dsa_drive_*.py
      - scripts/dsa_u_restore_audit.py
      - tests/test_dsa_u_restore_audit.py
      - tests/test_dsa_private_workflow_gates.py
      - .github/workflows/44-drive-storage-readiness.yml
permissions:
  contents: read
concurrency:
  group: dsa-drive-evidence-writer
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: python -m pip install pytest httpx pyyaml
      - run: python -m pytest --noconftest -q tests/test_dsa_drive_store.py tests/test_dsa_drive_recovery_regressions.py tests/test_dsa_u_restore_audit.py tests/test_dsa_private_workflow_gates.py
      - name: Credential presence only; zero model requests
        id: configuration
        env:
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
        run: |
          python - <<'PY'
          import json,os
          names=['DSA_DRIVE_FOLDER_ID','DSA_DRIVE_CLIENT_ID','DSA_DRIVE_CLIENT_SECRET','DSA_DRIVE_REFRESH_TOKEN']
          missing=[k for k in names if not os.environ.get(k)]
          ready=not missing
          print(json.dumps({'run_id':'TRI-DSA-EXEC-20260915-016','missing_configuration_names':missing,'model_requests':0,'runner_roundtrip':'NOT_YET_TESTED'}))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('ready='+str(ready).lower()+'\n')
          PY
      - name: Read-only diagnosis of historical storage artifacts
        if: steps.configuration.outputs.ready == 'true'
        env:
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
        run: |
          PYTHONPATH=scripts python - <<'PY'
          import hashlib,json,os,httpx
          from dsa_drive_store import DriveStore,scoped_token,API
          artifacts=['ART-DSA-RUN013-PROBE','ART-DSA-RUN013-RESTORE','ART-DSA-STORAGE-34978665852-1']
          with httpx.Client(timeout=30,follow_redirects=False) as c:
              c.headers['Authorization']='Bearer '+scoped_token(c)
              store=DriveStore(c,os.environ['DSA_DRIVE_FOLDER_ID'])
              for artifact in artifacts:
                  q=("'"+store.folder+"' in parents and trashed=false and appProperties has { key='artifact_id' and value='"+artifact+"' }")
                  page=store.request('GET',API+'/files',params={'q':q,'fields':'files(id,size,version,appProperties),nextPageToken','pageSize':100}).json()
                  rows=page.get('files',[])
                  out={'artifact_id':artifact,'count':len(rows),'next_page':bool(page.get('nextPageToken')),'model_requests':0}
                  if len(rows)==1 and not page.get('nextPageToken'):
                      row=rows[0]
                      before=store.private_meta(row['id'])
                      expected=row.get('appProperties',{}).get('sha256')
                      r=c.get(API+'/files/'+row['id'],params={'alt':'media'})
                      actual=hashlib.sha256(r.content).hexdigest() if r.status_code==200 else None
                      after=store.private_meta(row['id'])
                      out.update(http_status=r.status_code,
                                 expected_hash_present=bool(expected),
                                 hash_match=bool(expected and actual==expected),
                                 version_before=before.get('version'),
                                 version_after=after.get('version'),
                                 version_same=before.get('version')==after.get('version'),
                                 metadata_size=row.get('size'),
                                 downloaded_bytes=(len(r.content) if r.status_code==200 else None))
                  print(json.dumps(out,sort_keys=True))
          PY
      - name: Fresh unique runner save, independent read and restore
        if: steps.configuration.outputs.ready == 'true'
        env:
          DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
          DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
          DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
          DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
        run: |
          mkdir -p /tmp/dsa-synthetic
          python - <<'PY'
          from pathlib import Path
          Path('/tmp/dsa-synthetic/probe.json').write_bytes(b'{"synthetic":true}\r\n')
          Path('/tmp/dsa-synthetic/probe.bin').write_bytes(bytes(range(256)))
          PY
          ARTIFACT_ID="ART-DSA-STORAGE-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python scripts/dsa_drive_bundle.py --source /tmp/dsa-synthetic --run-id TRI-DSA-EXEC-20260915-016 --artifact-id "$ARTIFACT_ID" --receipt /tmp/dsa-drive-receipt.json
      - name: No acceptance on missing configuration
        if: steps.configuration.outputs.ready != 'true'
        run: echo 'DRIVE_RUNNER_RESTORE_BLOCKED_CONFIGURATION; offline tests are not live acceptance'
