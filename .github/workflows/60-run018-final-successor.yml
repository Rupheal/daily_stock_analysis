name: O Run018 final bounded successor
on:
  push:
    branches: [fix/native-private-execution-20260914]
    paths:
      - .github/workflows/60-run018-final-successor.yml
permissions:
  contents: read
concurrency:
  group: dsa-drive-evidence-writer
  cancel-in-progress: false
jobs:
  final-successor:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DSA_DRIVE_FOLDER_ID: ${{ secrets.DSA_DRIVE_FOLDER_ID }}
      DSA_DRIVE_CLIENT_ID: ${{ secrets.DSA_DRIVE_CLIENT_ID }}
      DSA_DRIVE_CLIENT_SECRET: ${{ secrets.DSA_DRIVE_CLIENT_SECRET }}
      DSA_DRIVE_REFRESH_TOKEN: ${{ secrets.DSA_DRIVE_REFRESH_TOKEN }}
      ENV_FILE: /dev/null
      TZ: Asia/Hong_Kong
      PYTHONUNBUFFERED: '1'
      PYTHONPATH: research
      LITELLM_LOCAL_MODEL_COST_MAP: 'true'
      BACKTEST_ENABLED: 'false'
      AGENT_MODE: 'false'
      REPORT_INTEGRITY_RETRY: '0'
      MAX_WORKERS: '1'
      NEWS_INTEL_AUTO_FETCH_ENABLED: 'false'
      ENABLE_REALTIME_QUOTE: 'false'
      ENABLE_REALTIME_TECHNICAL_INDICATORS: 'false'
      PREFETCH_REALTIME_QUOTES: 'false'
      RECOVERY_RUN_ID: TRI-DSA-EXEC-20260915-018
      RECOVERY_CHILD_ID: ART-DSA-RUN018-ZEROHTTP-RECOVERY-CHILD1
    steps:
      - uses: actions/checkout@v5
        with:
          path: research
          persist-credentials: false
      - uses: actions/checkout@v5
        with:
          repository: ZhuLinsen/daily_stock_analysis
          ref: 089d9d26d68f8b839ea5a74a3784e4402925f8b7
          path: original
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Verify inherited Owner authorization and unused request slot
        run: |
          python - <<'PY'
          import json, os, subprocess
          a=json.load(open('research/docs/runtime/run018-final-successor-authorization.json'))
          base=json.load(open('research/docs/runtime/run018-zero-http-recovery-authorization.json'))
          arm=json.load(open('research/docs/runtime/run012-private-native-arm.json'))
          assert a['owner_authorization_inherited'] is True
          assert base['authorized'] is True
          assert a['prior_successor_model_http_requests']==0
          assert a['remaining_provider_request_slots']==1
          assert a['maximum_requests_in_this_workflow']==1
          assert a['date_boundary_repair']['permitted'] is True
          assert a['date_boundary_repair']['native_model_logic_change_permitted'] is False
          assert a['fallback_model_permitted'] is False
          assert a['automatic_recharge_permitted'] is False
          assert a['runtime_activated'] is False and a['real_orders_permitted'] is False
          assert arm.get('armed') is False
          got=subprocess.check_output(['git','rev-parse','HEAD'],cwd='original',text=True).strip()
          assert got==a['frozen_upstream']=='089d9d26d68f8b839ea5a74a3784e4402925f8b7'
          assert not subprocess.check_output(['git','diff','--name-only','HEAD'],cwd='original',text=True).strip()
          assert os.environ.get('GITHUB_RUN_ATTEMPT')=='1'
          print(json.dumps({'owner_authorized':True,'unused_request_slot':1,'frozen_upstream_verified':True,'model_requests':0}))
          PY

      - name: Install deterministic and frozen runtime dependencies
        run: pip install -r research/requirements.txt pytest httpx

      - name: Resolve immutable target session
        run: |
          PYTHONPATH=research/scripts python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from o_target_session_contract import RULE_VERSION, resolve_target_session
          a=json.load(open('research/docs/runtime/run018-final-successor-authorization.json'))
          target=resolve_target_session(datetime.now(timezone.utc)).target_session.isoformat()
          assert RULE_VERSION==a['target_rule_version']
          assert target==a['claimed_target_session'], 'RECOVERY_TARGET_EXPIRED_NEW_COMPLETED_SESSION'
          Path('/tmp/o-frozen-target-session').write_text(target)
          print(json.dumps({'target_session':target,'rule_version':RULE_VERSION,'model_requests':0}))
          PY

      - name: Run recovery and adapter regressions
        working-directory: research
        run: python -m pytest --noconftest -q tests/test_o_native_input_contract.py tests/test_hk_volume_reconciliation.py tests/test_o_zero_http_recovery_policy.py tests/test_o_target_session_contract.py tests/test_prepare_xiaomi_acceptance_targeted.py tests/test_o_native_date_boundary_adapter.py

      - name: Reconcile canonical private evidence
        run: |
          PYTHONPATH=research/scripts python research/scripts/reconcile_o_native_private.py > /tmp/canonical-reconciliation.json
          PYTHONPATH=research/scripts python - <<'PY'
          import json
          from o_zero_http_recovery_policy import classify_zero_http_recovery
          r=json.load(open('/tmp/canonical-reconciliation.json'))
          p=classify_zero_http_recovery(r,owner_authorized=True)
          assert p['state']=='AUTHORIZED_ONE_SUCCESSOR_ATTEMPT'
          assert p['request_authorized'] is True
          assert r.get('model_http_requests')==0
          assert r.get('archive_sha_verified') is True
          assert r.get('bundle_manifest_restore_verified') is True
          print(json.dumps({'canonical_reconciliation':True,'canonical_model_http_requests':0,'model_requests':0}))
          PY

      - name: Fresh Drive save read SHA restore gate
        run: |
          printf '%s\n' '{"run_id":"TRI-DSA-EXEC-20260915-018","classification":"synthetic_no_model_content","payload":"RUN018_FINAL_SUCCESSOR_DRIVE_PROBE"}' > /tmp/run018-final-drive-probe.json
          PROBE_ID="ART-DSA-RUN018-FINAL-PROBE-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python research/scripts/dsa_drive_bundle.py \
            --source /tmp/run018-final-drive-probe.json \
            --run-id "$RECOVERY_RUN_ID" \
            --artifact-id "$PROBE_ID" \
            --receipt /tmp/run018-final-drive-probe-receipt.json

      - name: Fresh Xiaomi preflight bound to frozen target
        run: |
          mkdir -p /tmp/recovery-evidence
          python research/scripts/prepare_xiaomi_acceptance_targeted.py > /tmp/recovery-evidence/preflight-stdout.log 2> /tmp/recovery-evidence/preflight-stderr.log
          cp research/probe/preflight.json /tmp/recovery-evidence/preflight.json
          cp research/probe/target-session-receipt.json /tmp/recovery-evidence/target-session-receipt.json
          python - <<'PY'
          import json
          from pathlib import Path
          d=json.load(open('research/probe/preflight.json'))
          tr=json.load(open('research/probe/target-session-receipt.json'))
          target=Path('/tmp/o-frozen-target-session').read_text().strip()
          assert d.get('passed') is True and d.get('prices_passed') is True
          assert d.get('symbol','').upper()=='HK01810'
          assert str(d.get('target'))==target==str(tr.get('target_session'))==str(tr.get('preflight_target'))
          assert tr.get('target_match') is True
          s=d.get('component_status') or {}
          assert s.get('prices')=='passed'
          assert s.get('news')=='passed_limited_coverage'
          assert s.get('issuer')=='listing_passed_body_incomplete'
          print(json.dumps({'preflight_passed':True,'target':target,'model_requests':0}))
          PY

      - name: Frozen native data smoke with bounded Yahoo boundary adapter
        run: |
          TARGET_SESSION="$(cat /tmp/o-frozen-target-session)"
          python research/scripts/run_hk_native_data_probe.py \
            --checkout original \
            --universe research/docs/dsa-u-universe.json \
            --scope O_single_stock_smoke \
            --expected-date "$TARGET_SESSION" \
            --expected-commit 089d9d26d68f8b839ea5a74a3784e4402925f8b7 \
            --target-boundary-adapter \
            --timeout 240 \
            --output /tmp/run018-native-data \
            > /tmp/run018-native-data-private.log 2>&1
          python - <<'PY'
          import json
          from pathlib import Path
          target=Path('/tmp/o-frozen-target-session').read_text().strip()
          d=json.load(open('/tmp/run018-native-data/coverage.json'))
          rows=d.get('coverage') or []
          assert d.get('code_commit')=='089d9d26d68f8b839ea5a74a3784e4402925f8b7'
          assert d.get('target_boundary_adapter') is True
          assert d.get('native_logic_modified') is False
          assert d.get('coverage_denominator')==1 and d.get('current_valid_count')==1
          assert len(rows)==1 and str(rows[0].get('latest_date'))==target
          assert d.get('returncode')==0
          print(json.dumps({'native_data_smoke_passed':True,'target':target,'adapter_apply_count':d.get('target_boundary_adapter_apply_count',0),'model_requests':0}))
          PY

      - name: Observer exact-session OHLC volume contract
        run: |
          PYTHONPATH=research python - <<'PY'
          import json, sqlite3, sys
          from pathlib import Path
          sys.path.insert(0,'research/scripts')
          from o_native_input_contract import validate_native_input
          p=json.load(open('research/probe/preflight.json'))
          target=Path('/tmp/o-frozen-target-session').read_text().strip()
          db=sqlite3.connect('/tmp/run018-native-data/native-data.db')
          row=db.execute("SELECT date,open,high,low,close,volume FROM stock_daily WHERE code=? COLLATE NOCASE ORDER BY date DESC LIMIT 1",('hk01810',)).fetchone()
          db.close()
          assert row
          receipt=validate_native_input(p,{'today':dict(zip(('date','open','high','low','close','volume'),row))})
          assert receipt.get('validated') is True and str(receipt.get('target'))==target
          print(json.dumps({'observer_contract_passed':True,'target':target,'volume_status':receipt.get('volume_status'),'model_requests':0}))
          PY

      - name: Require append-only child and claim absent
        run: |
          PYTHONPATH=research/scripts python - <<'PY'
          import os,httpx
          from dsa_drive_store import DriveStore,scoped_token
          with httpx.Client(timeout=30,follow_redirects=False) as c:
              c.headers['Authorization']='Bearer '+scoped_token(c)
              s=DriveStore(c,os.environ['DSA_DRIVE_FOLDER_ID'])
              s.assert_absent(os.environ['RECOVERY_CHILD_ID'])
              s.assert_absent(os.environ['RECOVERY_CHILD_ID']+'-CLAIM')
          print('{"successor_child_absent":true,"successor_claim_absent":true,"model_requests":0}')
          PY

      - name: Require current DeepSeek affordability
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from decimal import Decimal
          import json,os
          req=Request('https://api.deepseek.com/user/balance',headers={'Authorization':'Bearer '+os.environ['DEEPSEEK_API_KEY']})
          with urlopen(req,timeout=20) as r: raw=json.load(r)
          rows=[x for x in raw.get('balance_infos',[]) if x.get('currency')=='CNY']
          total=Decimal(rows[0]['total_balance']) if rows else Decimal('-1')
          report={'run_id':os.environ['RECOVERY_RUN_ID'],'currency':'CNY','total_balance':str(total),'single_stock_cap_cny':'2','single_stock_affordable':bool(raw.get('is_available') and total>=Decimal('2'))}
          open('/tmp/deepseek-balance-before-private.json','w').write(json.dumps(report,indent=2))
          print(json.dumps({'balance_readable':True,'single_stock_affordable':report['single_stock_affordable'],'model_requests':0}))
          if not report['single_stock_affordable']:
              raise SystemExit('CURRENT_BALANCE_NOT_SUFFICIENT_FOR_SINGLE_STOCK_CAP')
          PY
          BID="ART-DSA-RUN018-FINAL-BALANCE-BEFORE-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python research/scripts/dsa_drive_bundle.py --source /tmp/deepseek-balance-before-private.json --run-id "$RECOVERY_RUN_ID" --artifact-id "$BID" --receipt /tmp/run018-final-balance-before-receipt.json

      - name: Persist durable append-only call intent
        run: |
          PYTHONPATH=research/scripts python - <<'PY'
          import hashlib,json,os,httpx
          from pathlib import Path
          from dsa_drive_store import DriveStore,scoped_token
          preflight=Path('research/probe/preflight.json').read_bytes()
          execution='CI-'+os.environ['GITHUB_RUN_ID']+'-'+os.environ['GITHUB_RUN_ATTEMPT']
          with httpx.Client(timeout=30,follow_redirects=False) as c:
              c.headers['Authorization']='Bearer '+scoped_token(c)
              receipt=DriveStore(c,os.environ['DSA_DRIVE_FOLDER_ID']).reserve_native_call(os.environ['RECOVERY_CHILD_ID'],os.environ['RECOVERY_RUN_ID'],hashlib.sha256(preflight).hexdigest(),execution)
          Path('/tmp/recovery-evidence/call-intent-receipt.json').write_text(json.dumps(receipt))
          print('FINAL_SUCCESSOR_CALL_INTENT_PERSISTED_MODEL_REQUESTS_0')
          PY

      - name: One authorized frozen original-native model request
        id: successor_call
        env:
          LLM_CHANNELS: deepseek
          LLM_DEEPSEEK_PROTOCOL: openai
          LLM_DEEPSEEK_BASE_URL: https://api.deepseek.com
          LLM_DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          LLM_DEEPSEEK_MODELS: deepseek-flash
          LITELLM_MODEL: openai/deepseek-flash
          LITELLM_FALLBACK_MODELS: ''
        run: |
          set +e
          python research/scripts/run_hk_original_model_probe.py \
            --checkout original \
            --expected-commit 089d9d26d68f8b839ea5a74a3784e4402925f8b7 \
            --preflight research/probe/preflight.json \
            --output /tmp/recovery-evidence/original-model \
            --limit-cny 2 \
            --carry-upper-cny 0.060156 \
            --target-boundary-adapter \
            > /tmp/recovery-evidence/native-stdout.log 2> /tmp/recovery-evidence/native-stderr.log
          rc=$?
          printf '{"run_id":"TRI-DSA-EXEC-20260915-018","native_process_exit_code":%s}\n' "$rc" > /tmp/recovery-evidence/process.json
          echo "$rc" > /tmp/recovery-evidence/process.rc
          exit 0

      - name: Persist successor raw bytes privately and restore verify
        if: ${{ always() && (steps.successor_call.outcome == 'success' || steps.successor_call.outcome == 'failure') }}
        env:
          DSA_SENSITIVE_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python research/scripts/dsa_drive_bundle.py --source /tmp/recovery-evidence --run-id "$RECOVERY_RUN_ID" --artifact-id "$RECOVERY_CHILD_ID" --receipt /tmp/recovery-child-drive-receipt.json

      - name: Save post-call balance privately and emit sanitized acceptance
        if: ${{ always() && (steps.successor_call.outcome == 'success' || steps.successor_call.outcome == 'failure') }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: |
          python - <<'PY'
          from urllib.request import Request,urlopen
          from decimal import Decimal
          from pathlib import Path
          import json,os
          before=json.load(open('/tmp/deepseek-balance-before-private.json'))
          req=Request('https://api.deepseek.com/user/balance',headers={'Authorization':'Bearer '+os.environ['DEEPSEEK_API_KEY']})
          with urlopen(req,timeout=20) as r: raw=json.load(r)
          rows=[x for x in raw.get('balance_infos',[]) if x.get('currency')=='CNY']
          after=Decimal(rows[0]['total_balance']) if rows else Decimal('-1')
          prior=Decimal(before['total_balance'])
          delta=(prior-after) if after>=0 and prior>=0 else None
          private={'run_id':os.environ['RECOVERY_RUN_ID'],'currency':'CNY','total_balance':str(after),'observed_balance_delta_cny':str(delta) if delta is not None else None}
          Path('/tmp/deepseek-balance-after-private.json').write_text(json.dumps(private,indent=2))
          rc=int(Path('/tmp/recovery-evidence/process.rc').read_text().strip())
          summary=Path('/tmp/recovery-evidence/original-model/probe-summary.json')
          out={'run_id':os.environ['RECOVERY_RUN_ID'],'workflow_run':os.environ['GITHUB_RUN_ID'],'child_artifact_id':os.environ['RECOVERY_CHILD_ID'],'canonical_claim_native_preserved':True,'append_only_child_saved_and_restored':True,'raw_text_evidence_private':True,'frozen_original_commit':'089d9d26d68f8b839ea5a74a3784e4402925f8b7','native_process_exit_code':rc,'manual_semantic_review_required':True,'observed_balance_delta_cny':private['observed_balance_delta_cny'],'runtime_activated':False,'real_orders':0}
          if summary.exists():
              d=json.loads(summary.read_text()); reqs=((d.get('budget') or {}).get('requests') or [])
              out['model_http_requests']=len(reqs); out['input_validated']=d.get('input_validated'); out['target_boundary_adapter']=d.get('target_boundary_adapter'); out['target_boundary_adapter_apply_count']=d.get('target_boundary_adapter_apply_count')
              if reqs:
                  u=reqs[-1].get('usage') or {}
                  out['prompt_tokens']=u.get('prompt_tokens'); out['completion_tokens']=u.get('completion_tokens'); out['total_tokens']=u.get('total_tokens'); out['request_status']=reqs[-1].get('status'); out['usage_peak_estimate_cny']=reqs[-1].get('usage_peak_estimate_cny')
          Path('/tmp/run018-final-sanitized.json').write_text(json.dumps(out,indent=2,sort_keys=True))
          print(json.dumps(out,sort_keys=True))
          if out.get('model_http_requests',0)>1: raise SystemExit('SUCCESSOR_REQUEST_CAP_VIOLATED')
          if rc!=0: raise SystemExit('RECOVERY_NATIVE_PROCESS_FAILED_AFTER_PRIVATE_CHILD_SAVE')
          PY
          AID="ART-DSA-RUN018-FINAL-BALANCE-AFTER-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          python research/scripts/dsa_drive_bundle.py --source /tmp/deepseek-balance-after-private.json --run-id "$RECOVERY_RUN_ID" --artifact-id "$AID" --receipt /tmp/run018-final-balance-after-receipt.json

      - name: Upload sanitized acceptance only
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: run018-final-successor-sanitized-${{ github.run_id }}
          path: /tmp/run018-final-sanitized.json
          if-no-files-found: warn
          retention-days: 14
